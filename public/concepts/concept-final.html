<!doctype html>
<!-- ============================================================
  ZHINO · CONCEPT FINAL — «لَونج لوکس ژینو» (ترکیب B + A)
  پایه: کانسپت B (محیط گرم، کرمی، دوست‌داشتنی، متصل به محصولات)
  افزودنی‌های A: نور سینمایی، عمق و سایه‌گذاری، جزئیات شیشه‌ای،
  قاب طلایی، هالهٔ زرشکی/طلایی، پلاک نام و پیل وضعیت
  • ربات زنده (همان ریگ concept-A-v3) — نقطهٔ تمرکز اصلی صفحه
  • RTL · موبایل‌اول · وزیرمتن + مارسلوس · بدون وابستگی خارجی
  • فعلاً فقط ظاهر ثابت؛ منطق سایت دست‌نخورده
============================================================ -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF7F2" />
<title>ژینو — کانسپت نهایی · لَونج لوکس</title>
<style>
@font-face{font-family:'Vazirmatn';font-style:normal;font-display:swap;font-weight:100 900;
  src:url('/fonts/vazirmatn-arabic-wght-normal.woff2') format('woff2-variations');
  unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC;}
@font-face{font-family:'Vazirmatn';font-style:normal;font-display:swap;font-weight:100 900;
  src:url('/fonts/vazirmatn-latin-wght-normal.woff2') format('woff2-variations');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Marcellus';font-style:normal;font-display:swap;font-weight:400;
  src:url('/fonts/marcellus-latin-400-normal.woff2') format('woff2');unicode-range:U+0000-00FF;}
@font-face{font-family:'Marcellus';font-style:normal;font-display:swap;font-weight:400;
  src:url('/fonts/marcellus-latin-ext-400-normal.woff2') format('woff2');unicode-range:U+0100-024F;}

:root{
  --page:#FAF7F2; --card:#F6EDDE; --line:#E7D8C6; --line-2:#DCC9B2;
  --ink:#292321; --ink-2:#6E5F57; --ink-3:#9A8B80;
  --wine:#71313B; --wine-2:#5A1725; --wine-soft:#F3E2E2;
  --gold:#B89A62; --gold-hi:#EAD097; --gold-soft:#E9DCBF;
  --jelly-raspberry:#C34A57; --jelly-orange:#E28B36; --jelly-kiwi:#7CA653;
  --jelly-blueberry:#6B7FB3; --jelly-grape:#8A6FAE; --jelly-lemon:#E4C04C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  height:100vh; height:100dvh; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(58% 34% at 84% -6%, rgba(200,120,110,.15) 0%, rgba(200,120,110,0) 60%),
    radial-gradient(48% 30% at 8% 12%, rgba(184,154,98,.13) 0%, rgba(184,154,98,0) 62%),
    radial-gradient(70% 44% at 50% 112%, rgba(90,23,37,.08) 0%, rgba(90,23,37,0) 64%);
}

/* ═══════ سربرگ ═══════ */
.zf-top{
  position:relative; z-index:30; flex:none;
  display:flex; align-items:center; justify-content:space-between; gap:.6rem;
  padding:calc(.6rem + env(safe-area-inset-top,0px)) .9rem .55rem;
}
.zf-chip{
  display:inline-flex; align-items:center; gap:.4rem;
  height:2.35rem; padding:0 .85rem; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:#fff;
  color:var(--ink-2); font:600 .74rem/1 'Vazirmatn',sans-serif;
  box-shadow:0 4px 14px -8px rgba(41,35,33,.18);
  transition:border-color .25s,color .25s,transform .18s,box-shadow .25s;
}
.zf-chip svg{width:.95rem;height:.95rem}
.zf-chip:hover{border-color:var(--gold);color:var(--wine)}
.zf-chip:active{transform:scale(.95)}
.zf-brand{display:flex;flex-direction:column;align-items:center;gap:.14rem;min-width:0}
.zf-brand-en{font-family:'Marcellus',serif;font-size:.86rem;letter-spacing:.42em;text-indent:.42em;color:var(--gold);line-height:1}
.zf-brand-fa{font-size:.66rem;font-weight:500;color:var(--ink-3);letter-spacing:.06em}

/* ═══════ اتاق ═══════ */
.zf-main{position:relative;z-index:10;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;padding:0 1rem}
.zf-room{
  position:relative; flex:1 1 auto; min-height:0; width:100%; max-width:780px;
  border-radius:26px; overflow:hidden;
  border:1px solid var(--line-2);
  background:linear-gradient(180deg,#F8F0E2 0%, #F3E7D3 100%);
  box-shadow:
    0 34px 64px -34px rgba(90,23,37,.38),
    0 12px 28px -18px rgba(41,35,33,.28),
    0 2px 0 rgba(255,255,255,.75) inset;
}
.zf-room::after{
  content:""; position:absolute; inset:8px; z-index:13; pointer-events:none;
  border-radius:19px; border:1.5px solid rgba(201,165,95,.55);
  box-shadow:0 0 0 3px rgba(201,165,95,.12), inset 0 0 18px rgba(255,244,214,.35);
}
.zf-room::before{
  content:""; position:absolute; inset:0; z-index:12; pointer-events:none;
  background:radial-gradient(125% 95% at 50% 38%, transparent 58%, rgba(90,23,37,.075) 100%);
}
.zf-room > svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.zf-room #g-head, .zf-room #g-torso, .zf-room .zf-jar, .zf-room .zf-custard{cursor:pointer}

/* ذرات طلایی معلق داخل نور (از A) */
.zf-motes{position:absolute; inset:0; z-index:11; pointer-events:none; overflow:hidden}
.zf-motes i{
  position:absolute; display:block; border-radius:50%;
  background:radial-gradient(circle,#EAD097 0%,rgba(201,165,95,0) 70%);
  animation:zfMote linear infinite;
}
@keyframes zfMote{
  0%{transform:translateY(10vh) translateX(0);opacity:0}
  14%{opacity:var(--o,.5)} 80%{opacity:var(--o,.5)}
  100%{transform:translateY(-72vh) translateX(var(--dx,8px));opacity:0}
}

/* ── پیل وضعیت (از A، نسخهٔ روشن) ── */
.zf-status{
  position:absolute; top:1.15rem; left:.95rem; z-index:14;
  display:inline-flex; align-items:center; gap:.42rem;
  height:1.9rem; padding:0 .75rem; border-radius:999px;
  background:rgba(255,255,255,.78); border:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  font:600 .64rem/1 'Vazirmatn',sans-serif; color:var(--ink-2);
  box-shadow:0 6px 16px -10px rgba(41,35,33,.28);
}
.zf-status i{width:.44rem;height:.44rem;border-radius:50%;background:#5FA97C;box-shadow:0 0 0 0 rgba(95,169,124,.45);animation:zfPulse 2.4s infinite}
.zf-status.is-think i{background:var(--gold)}
.zf-status.is-speak i{background:var(--jelly-raspberry)}
@keyframes zfPulse{0%{box-shadow:0 0 0 0 rgba(95,169,124,.4)}70%{box-shadow:0 0 0 6px rgba(95,169,124,0)}100%{box-shadow:0 0 0 0 rgba(95,169,124,0)}}

/* ── حباب گفتار ژینو ── */
.zf-speech{
  position:absolute; z-index:15; top:8.5%; right:7%; max-width:17rem;
  padding:.66rem .9rem; border-radius:1.05rem 1.05rem .3rem 1.05rem;
  background:#fff; border:1.5px solid var(--line);
  box-shadow:0 14px 30px -18px rgba(90,23,37,.35), 0 2px 0 rgba(201,165,95,.25);
  font:500 .76rem/1.9 'Vazirmatn',sans-serif; color:var(--ink);
  animation:zfPop .6s .5s cubic-bezier(.2,.9,.3,1.25) both;
}
.zf-speech::after{
  content:""; position:absolute; bottom:-9px; right:2.2rem;
  width:16px;height:16px; background:#fff;
  border-left:1.5px solid var(--line); border-bottom:1.5px solid var(--line);
  transform:rotate(-45deg); border-bottom-left-radius:4px;
}
.zf-speech b{color:var(--wine);font-weight:800}
.zf-speech .zf-caret{display:inline-block;width:2px;height:.85em;background:var(--gold);vertical-align:-.1em;margin-inline-start:2px;animation:zfBlink .8s steps(2) infinite}
@keyframes zfBlink{50%{opacity:0}}
@keyframes zfPop{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.zf-speech .zf-dots{display:inline-flex;gap:.28rem;padding:.2rem 0}
.zf-speech .zf-dots span{width:.34rem;height:.34rem;border-radius:50%;background:var(--gold);animation:zfDot 1s ease-in-out infinite}
.zf-speech .zf-dots span:nth-child(2){animation-delay:.14s}.zf-speech .zf-dots span:nth-child(3){animation-delay:.28s}
@keyframes zfDot{0%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-3px);opacity:1}}

/* ── برچسب قیمت محصولات ── */
.zf-tag{
  position:absolute; z-index:15; display:inline-flex; align-items:center; gap:.35rem;
  height:1.75rem; padding:0 .7rem; border-radius:999px; cursor:pointer;
  background:#fff; border:1px solid var(--line);
  font:600 .66rem/1 'Vazirmatn',sans-serif; color:var(--ink-2);
  box-shadow:0 8px 18px -10px rgba(41,35,33,.3), 0 1px 0 rgba(201,165,95,.3);
  transition:transform .18s,border-color .2s,color .2s,opacity .35s;
  opacity:0; left:50%; top:60%; white-space:nowrap;
}
.zf-tag.is-set{opacity:1}
.zf-tag i{width:.5rem;height:.5rem;border-radius:50%;flex:none}
.zf-tag:hover{border-color:var(--gold);color:var(--wine);transform:translateY(-1px)}
.zf-tag:active{transform:scale(.94)}

/* ── عناصر متحرک SVG ──
   نکته: موقعیت هر محصول روی یک <g> بیرونیِ ثابت است و کلاس انیمیشن روی
   <g> داخلی — بنابراین انیمیشن CSS هرگز جای عنصر را عوض نمی‌کند. */
.zf-jar,.zf-custard{transform-box:fill-box;transform-origin:50% 100%}
.zf-jiggle{animation:zfJiggle .9s cubic-bezier(.36,.07,.19,.97)}
@keyframes zfJiggle{
  0%{transform:scale(1,1)}18%{transform:scale(1.06,.9) rotate(-2deg)}38%{transform:scale(.95,1.07) rotate(2deg)}
  58%{transform:scale(1.03,.96) rotate(-1deg)}78%{transform:scale(.99,1.02) rotate(.6deg)}100%{transform:scale(1,1)}
}
.zf-wobble{animation:zfWobble 7s ease-in-out infinite}
@keyframes zfWobble{0%,86%,100%{transform:scale(1,1)}90%{transform:scale(1.03,.96) rotate(-1.4deg)}94%{transform:scale(.97,1.03) rotate(1.2deg)}98%{transform:scale(1.01,.99)}}
.zf-steam path{transform-box:fill-box;transform-origin:50% 100%;animation:zfSteam 3.4s ease-in-out infinite}
.zf-steam path:nth-child(2){animation-delay:1.1s}.zf-steam path:nth-child(3){animation-delay:2.2s}
@keyframes zfSteam{0%{transform:translateY(4px);opacity:0}30%{opacity:.5}100%{transform:translateY(-13px);opacity:0}}
.zf-bulb{animation:zfTwinkle 2.6s ease-in-out infinite}
.zf-bulb:nth-of-type(2n){animation-delay:.9s}.zf-bulb:nth-of-type(3n){animation-delay:1.6s}
@keyframes zfTwinkle{0%,100%{opacity:.55}50%{opacity:1}}
.zf-leaf{transform-box:fill-box;transform-origin:50% 100%;animation:zfLeaf 6s ease-in-out infinite}
@keyframes zfLeaf{0%,100%{transform:rotate(0)}50%{transform:rotate(2.4deg)}}
.zf-spark{transform-box:fill-box;transform-origin:50% 50%;animation:zfSpark 2.8s ease-in-out infinite}
.zf-spark.s2{animation-delay:1.4s}
@keyframes zfSpark{0%,100%{opacity:0;transform:scale(.5) rotate(0)}50%{opacity:.85;transform:scale(1) rotate(24deg)}}
body.is-speaking .zf-spark{animation-duration:1.4s}
.zf-haloBreath{transform-box:fill-box;transform-origin:50% 50%;animation:zfHalo 6.5s ease-in-out infinite}
@keyframes zfHalo{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}

/* ── پلاک نام (از A، نسخهٔ روشن) ── */
.zf-plaque{flex:none; text-align:center; padding:.6rem 0 .15rem; position:relative; z-index:6}
.zf-plaque-en{font-family:'Marcellus',serif;font-size:.64rem;letter-spacing:.48em;text-indent:.48em;color:rgba(184,154,98,.85)}
.zf-plaque h1{margin:.26rem 0 .16rem;font-size:clamp(1.1rem,3.9vw,1.5rem);font-weight:800;color:var(--ink);letter-spacing:-.01em}
.zf-plaque p{margin:0;font-size:.7rem;color:var(--ink-3);font-weight:500}
.zf-plaque .zf-rule{
  display:block;width:4.8rem;height:1.5px;margin:.45rem auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7;
}

/* ═══════ سیاط گفتگو ═══════ */
.zf-log{
  display:none; flex:none; z-index:20; flex-direction:column; gap:.55rem;
  width:100%; max-width:780px; max-height:30dvh; overflow-y:auto; overscroll-behavior:contain;
  padding:.8rem .95rem .3rem; scrollbar-width:thin; scrollbar-color:rgba(184,154,98,.35) transparent;
}
body.has-chat .zf-log{display:flex}
.zf-msg{display:flex;flex-direction:column;max-width:86%;animation:zfMsgIn .35s ease both}
@keyframes zfMsgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.zf-msg.is-user{align-self:flex-start;align-items:flex-start}
.zf-msg.is-bot{align-self:flex-end;align-items:flex-end}
.zf-who{display:inline-flex;align-items:center;gap:.32rem;font-size:.62rem;font-weight:700;color:var(--ink-3);margin:0 .3rem .22rem}
.zf-who svg{width:1.05rem;height:1.05rem}
.zf-bubble{
  padding:.6rem .85rem; border-radius:.35rem 1rem 1rem 1rem;
  background:#fff; border:1px solid var(--line);
  font-size:.8rem; line-height:1.95; font-weight:500; color:var(--ink);
  box-shadow:0 10px 22px -16px rgba(41,35,33,.22);
}
.zf-msg.is-user .zf-bubble{border-radius:1rem .35rem 1rem 1rem;background:var(--wine-soft);border-color:#E8CDCE}
.zf-bubble .zf-caret{display:inline-block;width:2px;height:.85em;background:var(--gold);vertical-align:-.1em;margin-inline-start:2px;animation:zfBlink .8s steps(2) infinite}

/* ═══════ کنسول پیام ═══════ */
.zf-console{
  position:relative; z-index:30; flex:none; width:100%;
  padding:.45rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg, rgba(250,247,242,0) 0%, var(--page) 30%);
}
.zf-console-inner{max-width:780px;margin:0 auto}
.zf-chips{display:flex;gap:.45rem;overflow-x:auto;padding:.15rem .05rem .5rem;scrollbar-width:none}
.zf-chips::-webkit-scrollbar{display:none}
.zf-chip-s{
  flex:none; display:inline-flex; align-items:center; gap:.4rem;
  height:2rem; padding:0 .85rem; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:#fff; color:var(--ink-2);
  font:500 .72rem/1 'Vazirmatn',sans-serif;
  box-shadow:0 3px 10px -6px rgba(41,35,33,.16);
  transition:transform .15s,border-color .2s,color .2s;
}
.zf-chip-s i{width:.42rem;height:.42rem;border-radius:50%;flex:none}
.zf-chip-s:hover{border-color:var(--gold);color:var(--wine)}
.zf-chip-s:active{transform:scale(.94)}
.zf-form{display:flex;align-items:center;gap:.5rem}
.zf-field{
  flex:1; display:flex; align-items:center; min-width:0; height:3rem;
  border-radius:1.1rem; border:1px solid var(--line); background:#fff;
  box-shadow:0 6px 18px -12px rgba(41,35,33,.2);
  transition:border-color .25s, box-shadow .25s;
}
.zf-field:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,154,98,.16)}
.zf-input{flex:1;min-width:0;height:100%;padding:0 1rem;border:0;outline:0;background:transparent;color:var(--ink);font:500 .84rem/1 'Vazirmatn',sans-serif}
.zf-input::placeholder{color:var(--ink-3)}
.zf-voice{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:2.2rem;height:2.2rem;border-radius:50%;cursor:pointer;margin-inline-end:.35rem;
  border:1px solid transparent;background:transparent;color:var(--ink-3);
  transition:color .2s,border-color .2s,background .2s;
}
.zf-voice svg{width:1.05rem;height:1.05rem}
.zf-voice:hover{color:var(--ink-2)}
.zf-voice.is-on{color:var(--wine);border-color:#E4C9CC;background:var(--wine-soft)}
.zf-send{
  flex:none;width:3rem;height:3rem;border-radius:1.05rem;border:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;color:#FBF3E4;
  background:linear-gradient(150deg,#8A454F 0%, var(--wine) 45%, var(--wine-2) 100%);
  box-shadow:0 10px 22px -10px rgba(90,23,37,.55), inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .18s, filter .2s;
}
.zf-send svg{width:1.3rem;height:1.3rem}
.zf-send:hover{filter:brightness(1.07)}
.zf-send:active{transform:scale(.93)}
.zf-send:disabled{filter:grayscale(.35) brightness(.9);cursor:default}
.zf-meta{display:flex;align-items:center;justify-content:space-between;padding:.4rem .3rem 0}
.zf-hint{font-size:.62rem;color:var(--ink-3);font-weight:500}
.zf-sign{font-size:.62rem;color:rgba(184,154,98,.8);font-weight:500}

/* توست */
.zf-toast{
  position:fixed; bottom:calc(5.6rem + env(safe-area-inset-bottom,0px)); left:50%; z-index:80;
  transform:translateX(-50%) translateY(8px); opacity:0; pointer-events:none;
  padding:.55rem 1rem; border-radius:999px; font:500 .72rem/1.6 'Vazirmatn',sans-serif;
  background:#fff; border:1px solid var(--line); color:var(--ink-2);
  box-shadow:0 12px 28px -14px rgba(41,35,33,.3);
  transition:opacity .3s, transform .3s; max-width:88vw; text-align:center;
}
.zf-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:720px){
  .zf-room{max-height:620px}
  .zf-main{justify-content:center}
}
@media (max-width:360px){
  .zf-speech{max-width:12.5rem;font-size:.7rem;right:5%}
  .zf-tag{font-size:.6rem;height:1.6rem}
  .zf-status{font-size:.58rem;height:1.7rem;padding:0 .6rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important}
}
</style>
</head>
<body>

<!-- ═══════ سربرگ ═══════ -->
<header class="zf-top">
  <button class="zf-chip" type="button" onclick="location.href='/'" aria-label="بازگشت به سایت">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>بازگشت به سایت</span>
  </button>
  <div class="zf-brand" aria-hidden="true">
    <span class="zf-brand-en">ZHINO</span>
    <span class="zf-brand-fa">دستیار هوشمند</span>
  </div>
  <button class="zf-chip" type="button" id="btnNew" aria-label="گفتگوی تازه">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.3 8.6A6.4 6.4 0 0 0 5.1 6.1L3.4 7.9m0 0V4.3m0 3.6h3.6m-3.3 3.5a6.4 6.4 0 0 0 11.2 2.5l1.7-1.8m0 0v3.6m0-3.6h-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</header>

<!-- ═══════ لَونج لوکس ═══════ -->
<main class="zf-main">
  <section class="zf-room" id="room" aria-label="لَونج ربات ژینو">

    <svg id="zf-svg" viewBox="0 0 760 680" role="img" aria-label="اتاق ربات ژینو با قفسهٔ ژله و کانتر محصولات">
      <g id="zf-world">
      <defs>

<script>
/* ============================================================
   موتور ربات — همان ریگ زندهٔ concept-A-v3 + نگاه به اشاره‌گر
============================================================ */
(function () {
  'use strict';
  function init() {
    function $(id) { return document.getElementById(id); }
    var els = {
      head: $('g-head'), antenna: $('g-antenna'), eyes: $('g-eyes'),
      torso: $('g-torso'),
      armL: $('g-upper-l'), foreL: $('g-fore-l'), elbowL: $('g-elbow-l'),
      armR: $('g-upper-r'), foreR: $('g-fore-r'), elbowR: $('g-elbow-r'),
      smile: $('m-smile'), talk: $('m-talk'), grin: $('m-grin'),
      talkGlow: $('m-talk-glow'), talkDots: $('m-talk-dots')
    };
    var R = Math.random;
    var seeds = []; for (var i = 0; i < 14; i++) seeds.push(R() * Math.PI * 2);
    function noise(t, i, speed) {
      var s = seeds[i % seeds.length]; speed = speed || 1;
      return Math.sin(t * 0.90 * speed + s) * 0.55 + Math.sin(t * 1.73 * speed + s * 2.7) * 0.30 + Math.sin(t * 2.57 * speed + s * 5.1) * 0.15;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function ease(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    var reduce = 1;
    try { if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) reduce = 0.25; } catch (e) {}

    var state = 'idle';
    var w = { idle: 1, thinking: 0, speaking: 0, greeting: 0 };
    var target = { idle: 1, thinking: 0, speaking: 0, greeting: 0 };
    var waveT0 = -100, thinkSide = R() < 0.5 ? -1 : 1, speechSeed = R() * 10;
    var clock = 0;
    var grinUntil = -1;

    function setState(s) {
      if (!(s in w)) return;
      if (s === state) { if (s === 'greeting') waveT0 = clock; return; }
      state = s;
      for (var k in target) target[k] = (k === s) ? 1 : 0;
      if (s === 'greeting') waveT0 = clock;
      if (s === 'thinking') thinkSide = R() < 0.5 ? -1 : 1;
      if (s === 'speaking') speechSeed = R() * 10;
    }

    var ptr = { x: 0, y: 0 }, ptrT = { x: 0, y: 0 };
    function onPointer(e) {
      var svg = document.getElementById('zf-svg'); if (!svg) return;
      var r = svg.getBoundingClientRect();
      var hx = r.left + r.width * 0.5, hy = r.top + r.height * 0.3;
      ptrT.x = clamp((e.clientX - hx) / (r.width * 0.5), -1, 1);
      ptrT.y = clamp((e.clientY - hy) / (r.height * 0.5), -1, 1);
    }
    window.addEventListener('pointermove', onPointer, { passive: true });
    window.addEventListener('pointerdown', onPointer, { passive: true });

    var nextBlink = 0.9 + R() * 2.2, blinkStart = -1, blinkDouble = false;
    function blinkScale(t) {
      if (blinkStart < 0) {
        if (t >= nextBlink) { blinkStart = t; blinkDouble = R() < 0.2; } else return 1;
      }
      var p = t - blinkStart;
      if (p < 0) return 1;
      var c = 0.085, h = 0.04, o = 0.17;
      if (p < c) return 1 - 0.94 * ease(p / c);
      if (p < c + h) return 0.06;
      if (p < c + h + o) return 0.06 + 0.94 * ease((p - c - h) / o);
      if (blinkDouble) { blinkDouble = false; blinkStart = t + 0.14; return 1; }
      blinkStart = -1; nextBlink = t + 1.5 + R() * 4.6; return 1;
    }
    var gx = 0, gy = 0, sx0 = 0, sy0 = 0, sx1 = 0, sy1 = 0, sacT0 = -1, sacDur = 0.12, nextSac = 0.5 + R();
    function stepGaze(t, dt) {
      ptr.x = lerp(ptr.x, ptrT.x, Math.min(1, dt * 3.4));
      ptr.y = lerp(ptr.y, ptrT.y, Math.min(1, dt * 3.4));
      if (t >= nextSac) {
        sx0 = gx; sy0 = gy;
        var tx, ty, hold;
        if (w.thinking > 0.4) { tx = thinkSide * (3 + R() * 3); ty = -6 - R() * 3; hold = 1.1; }
        else if (w.speaking > 0.4) { tx = (R() - 0.5) * 7; ty = (R() - 0.5) * 4; hold = 0.55; }
        else { tx = (R() - 0.5) * 11; ty = (R() - 0.5) * 5; hold = 0.75; }
        sx1 = tx + ptr.x * 7; sy1 = ty + ptr.y * 4.2;
        sacT0 = t; sacDur = 0.09 + R() * 0.09;
        nextSac = t + hold * (0.4 + R() * 1.6);
      }
      var k = sacT0 < 0 ? 1 : ease((t - sacT0) / sacDur);
      gx = lerp(sx0, sx1, k) + 0.35 * noise(t, 5, 1.9);
      gy = lerp(sy0, sy1, k) + 0.25 * noise(t, 6, 2.3);
    }
    var antA = 0, antV = 0, last = null, raf = 0;
    function step(dt) {
      var t = clock, k;
      for (k in w) w[k] += (target[k] - w[k]) * Math.min(1, dt / 0.26);
      var wp = (t - waveT0);
      var raise = 0;
      if (wp >= 0) {
        if (wp < 0.55) raise = ease(wp / 0.55);
        else if (wp < 2.35) raise = 1;
        else if (wp < 3.0) raise = 1 - ease((wp - 2.35) / 0.65);
        else { raise = 0; if (state === 'greeting') setState('idle'); }
      }
      var grin = t < grinUntil ? 1 : 0;
      var syl = Math.pow(Math.max(0, Math.sin(t * 2 * Math.PI * 2.7 + speechSeed)), 0.65);
      var gate = clamp(noise(t, 7, 0.5) * 0.9 + 0.62, 0, 1);
      var talkAmp = w.speaking * gate;
      var open = talkAmp * (0.22 + 0.78 * syl);
      var brPhase = t * 2 * Math.PI * 0.235 + 0.7 * noise(t, 3, 0.11);
      var br = 1 + reduce * 0.011 * Math.sin(brPhase);
      var torsoTy = reduce * 0.9 * Math.sin(brPhase);
      var torsoRot = reduce * 0.35 * noise(t, 9, 0.17);
      var hr = reduce * (1.05 * noise(t, 0, 0.19)
            + w.thinking * (1.6 * Math.sin(t * 0.7 + seeds[2]) + 1.2 * thinkSide)
            + w.speaking * 1.5 * syl * gate
            + raise * 1.9 * thinkSide * 0.6
            + ptr.x * 2.6);
      var hx = reduce * (1.4 * noise(t, 1, 0.15) + w.thinking * 1.2 * thinkSide + ptr.x * 2.2);
      var hy = reduce * (-1.1 * (br - 1) * 90 + w.thinking * 1.4 + raise * -1.0 + ptr.y * 2.0);
      var antTarget = -hr * 1.9 + reduce * (1.5 * noise(t, 4, 0.55)) * (0.55 + w.thinking * 0.9 + raise * 1.1 + w.speaking * 0.5);
      antV += ((antTarget - antA) * 46 - antV * 7.5) * dt;
      antA += antV * dt;
      stepGaze(t, dt);
      var bs = blinkScale(t);
      var squint = 1 - 0.16 * raise;
      var talkOp = clamp(w.speaking * 1.25, 0, 1) * clamp(gate * 2.2, 0, 1);
      var grinOp = clamp(Math.max(raise * 1.1, grin), 0, 1);
      var smileOp = clamp(1 - talkOp * 0.92 - grinOp * 0.85, 0, 1);
      var mrx = 13 + 8 * open, mry = 3 + 12 * open;
      var aL = reduce * (0.9 * noise(t, 8, 0.21) + w.speaking * 2.2 * Math.sin(t * 1.9 + 1.2) * gate);
      var fL = reduce * (1.3 * noise(t, 10, 0.29) + w.speaking * 5.5 * Math.sin(t * 2 * Math.PI * 0.85 + 0.4) * gate);
      var aR = reduce * (0.9 * noise(t, 11, 0.23)) - raise * 107;
      var fR = reduce * (1.3 * noise(t, 12, 0.31)) + raise * (-140 + 16 * Math.sin(t * 2 * Math.PI * 1.9 + 0.7));
      els.torso.setAttribute('transform', 'translate(0 ' + torsoTy.toFixed(2) + ') rotate(' + torsoRot.toFixed(2) + ' 360 662) translate(360 662) scale(1 ' + br.toFixed(4) + ') translate(-360 -662)');
      els.head.setAttribute('transform', 'translate(' + hx.toFixed(2) + ' ' + hy.toFixed(2) + ') rotate(' + hr.toFixed(2) + ' 360 400)');
      els.antenna.setAttribute('transform', 'rotate(' + antA.toFixed(2) + ' 136 236)');
      els.eyes.setAttribute('transform', 'translate(' + gx.toFixed(2) + ' ' + gy.toFixed(2) + ') translate(360 254) scale(1 ' + (bs * squint).toFixed(3) + ') translate(-360 -254)');
      els.armL.setAttribute('transform', 'rotate(' + aL.toFixed(2) + ' 204 472)');
      els.foreL.setAttribute('transform', 'rotate(' + fL.toFixed(2) + ' 185 557)');
      els.elbowL.setAttribute('transform', 'rotate(' + aL.toFixed(2) + ' 204 472) rotate(8 185 557)');
      els.armR.setAttribute('transform', 'rotate(' + aR.toFixed(2) + ' 516 472)');
      els.foreR.setAttribute('transform', 'rotate(' + fR.toFixed(2) + ' 535 557)');
      els.elbowR.setAttribute('transform', 'rotate(' + aR.toFixed(2) + ' 516 472) rotate(-8 535 557)');
      els.smile.setAttribute('opacity', smileOp.toFixed(3));
      els.talk.setAttribute('opacity', talkOp.toFixed(3));
      els.grin.setAttribute('opacity', grinOp.toFixed(3));
      els.talkGlow.setAttribute('rx', mrx.toFixed(2)); els.talkGlow.setAttribute('ry', mry.toFixed(2));
      els.talkDots.setAttribute('rx', mrx.toFixed(2)); els.talkDots.setAttribute('ry', mry.toFixed(2));
    }
    function frame(ts) {
      raf = requestAnimationFrame(frame);
      if (last === null) last = ts;
      var dt = Math.min(0.05, (ts - last) / 1000);
      last = ts; clock += dt; step(dt);
    }
    requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
      else if (!raf) { last = null; raf = requestAnimationFrame(frame); }
    });
    window.ZhinoRobot = {
      set: setState,
      wave: function () { setState('greeting'); },
      grin: function (ms) { grinUntil = clock + (ms || 1400) / 1000; },
      get state() { return state; }
    };
  }
  init();
})();

/* ============================================================
   گفتگو + حباب حرف + پیل وضعیت + واکنش به لمس محصولات
============================================================ */
(function () {
  'use strict';
  var robot = window.ZhinoRobot;
  var log = document.getElementById('log');
  var input = document.getElementById('input');
  var form = document.getElementById('form');
  var send = document.getElementById('btnSend');
  var speech = document.getElementById('speech');
  var toast = document.getElementById('toast');
  var status = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var busy = false, toastT = 0, typeTimer = 0;

  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { toast.classList.remove('show'); }, 3200);
  }

  function setStatus(mode, label) {
    status.classList.remove('is-think', 'is-speak');
    if (mode) status.classList.add(mode);
    statusText.textContent = label;
  }

  function reply(q) {
    if (/سلام|درود|خوبی/.test(q)) return 'سلام! خوش آمدید 🌼 من ژینوام؛ از همهٔ طعم‌های ژله و کاستر سرم می‌شود!';
    if (/طعم|ژله/.test(q)) return 'ژله‌های ژینو ۱۶ طعم دارند — انار، توت‌فرنگی، آلبالو، آناناس، هندوانه و… هر بستهٔ ۲۵۰ گرمی ۲۰۰٬۰۰۰ تومان. کدام را معرفی کنم؟';
    if (/کاستر/.test(q)) return 'کاستر ژینو در ۷ طعم: موز، شکلات، پرتقال، توت‌فرنگی، طالبی، هفت‌میوه و محلبی‌وانیلی 🍮 دسرِ نرم و خوش‌عطر برای هر مهمانی.';
    if (/مهمانی|پیشنهاد/.test(q)) return 'پیشنهاد من برای مهمانی: ژلهٔ انار با کاستر محلبی‌وانیلی — ترکیب محبوب مهمان‌های ژینو ✨';
    if (/ارسال|پست/.test(q)) return 'تهران ۱ تا ۲ روز کاری، سایر شهرها ۲ تا ۴ روز کاری. بسته‌بندی ایمن است و ژله‌ها سالم می‌رسند.';
    if (/قیمت|تومان/.test(q)) return 'هر بستهٔ ۲۵۰ گرمی — چه ژله چه کاستر — ۲۰۰٬۰۰۰ تومان. در فروشگاه همهٔ طعم‌ها را می‌بینید.';
    if (/مرسی|ممنون/.test(q)) return 'خواهش می‌کنم! هر وقت هوس طعم جدید کردید من همین‌جا هستم 🌼';
    return 'این یک پیش‌نمایش طراحی است و پاسخ‌ها نمایشی‌اند؛ در نسخهٔ نهایی به دادهٔ واقعی فروشگاه وصل می‌شوم. فعلاً ژله‌های قفسه را لمس کنید! 🍮';
  }

  /* ── حباب گفتار ── */
  function say(text, opts) {
    opts = opts || {};
    clearInterval(typeTimer);
    speech.innerHTML = '';
    if (opts.dots) {
      speech.innerHTML = '<span class="zf-dots"><span></span><span></span><span></span></span>';
      return;
    }
    var span = document.createElement('span'); span.className = 'zf-say';
    var caret = document.createElement('span'); caret.className = 'zf-caret';
    speech.appendChild(span); speech.appendChild(caret);
    var i = 0, step = Math.max(2, Math.round(text.length / 70));
    (function tick() {
      i = Math.min(text.length, i + step);
      span.textContent = text.slice(0, i);
      if (i < text.length) typeTimer = setTimeout(tick, 26);
      else caret.remove();
    })();
  }

  function botSayInLog(text) {
    var wrap = document.createElement('div');
    wrap.className = 'zf-msg is-bot';
    var who = document.createElement('span'); who.className = 'zf-who';
    who.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#F3E9D8" stroke="#D9C6A6"/><rect x="5" y="7.5" width="14" height="9" rx="4.5" fill="#171212"/><circle cx="9.3" cy="12" r="1.7" fill="#FFC673"/><circle cx="14.7" cy="12" r="1.7" fill="#FFC673"/></svg><span>ژینو</span>';
    var b = document.createElement('div'); b.className = 'zf-bubble'; b.textContent = text;
    wrap.appendChild(who); wrap.appendChild(b);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return b;
  }

  function addMsg(kind, text) {
    if (kind === 'bot') return botSayInLog(text);
    var wrap = document.createElement('div');
    wrap.className = 'zf-msg is-user';
    var who = document.createElement('span'); who.className = 'zf-who'; who.textContent = 'شما';
    var b = document.createElement('div'); b.className = 'zf-bubble'; b.textContent = text;
    wrap.appendChild(who); wrap.appendChild(b);
    log.appendChild(wrap); log.scrollTop = log.scrollHeight;
    return b;
  }

  function speakSequence(text) {
    robot && robot.set('speaking');
    document.body.classList.add('is-speaking');
    setStatus('is-speak', 'در حال پاسخ…');
    say(text);
    typeTimer = setTimeout(function () {
      robot && robot.set('idle');
      document.body.classList.remove('is-speaking');
      setStatus('', 'آنلاین و آمادهٔ گفتگو');
    }, Math.min(6000, 900 + text.length * 24));
  }

  function sendMsg(q) {
    q = (q || '').trim();
    if (!q || busy) return;
    busy = true; send.disabled = true;
    document.body.classList.add('has-chat');
    layoutRoom();
    addMsg('user', q);
    input.value = '';
    robot && robot.set('thinking');
    setStatus('is-think', 'در حال فکر کردن…');
    say('', { dots: true });
    setTimeout(function () {
      var text = reply(q);
      botSayInLog(text);
      speakSequence(text);
      setTimeout(function () {
        busy = false; send.disabled = false;
        if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) input.focus();
      }, 500);
    }, 850 + Math.random() * 450);
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); sendMsg(input.value); });
  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-q]');
    if (b) sendMsg(b.getAttribute('data-q'));
  });
  document.getElementById('btnNew').addEventListener('click', function () {
    log.innerHTML = '';
    document.body.classList.remove('has-chat');
    layoutRoom();
    busy = false; send.disabled = false;
    setStatus('', 'آنلاین و آمادهٔ گفتگو');
    welcome();
    robot && robot.wave();
  });
  document.getElementById('btnVoice').addEventListener('click', function () {
    var b = this; b.classList.toggle('is-on');
    showToast(b.classList.contains('is-on') ? 'خواندن با صدا در نسخهٔ نهایی به گویندهٔ فارسی وصل می‌شود.' : 'خواندن با صدا خاموش شد.');
  });

  /* ── لمس ژله‌ها و کاسترها ── */
  var jarLines = {
    'انار': 'این ژلهٔ اناره! قرمزِ درخشان، محبوبِ همهٔ مهمانی‌ها 😍',
    'پرتقال': 'ژلهٔ پرتقال زیر گنبد شیشه‌ای! انگار برش صبحگاهی پرتقال توی بسته است 🍊',
    'کیوی': 'ژلهٔ کیوی! سبز و شاد — بچه‌ها عاشقش می‌شوند 🥝',
    'بلوبری': 'و این هم ژلهٔ بلوبری؛ آبیِ آرام و خوش‌طعم 🫐',
    'کاستر': 'کاستر محلبی‌وانیلی! نرم و خوش‌عطر — ستارهٔ سینی دسر 🍮'
  };
  document.querySelectorAll('.zf-jar, .zf-custard').forEach(function (el) {
    el.addEventListener('click', function () {
      el.classList.remove('zf-jiggle'); void el.getBoundingClientRect(); el.classList.add('zf-jiggle');
      var flavor = el.getAttribute('data-flavor');
      if (flavor && jarLines[flavor]) {
        robot && robot.grin(1600);
        say(jarLines[flavor]);
      }
    });
  });

  /* ── برچسب محصولات روی کانتر ── */
  document.querySelectorAll('.zf-tag').forEach(function (el) {
    el.addEventListener('click', function () {
      var text = el.getAttribute('data-prod') === 'jelly'
        ? 'ژلهٔ انار ژینو — بستهٔ ۲۵۰ گرمی، ۲۰۰٬۰۰۰ تومان. رنگش روی میز مهمانی معجزه می‌کند!'
        : 'کاستر محلبی‌وانیلی ژینو — بستهٔ ۲۵۰ گرمی، ۲۰۰٬۰۰۰ تومان. عطر محلبی همهٔ خانه را برمی‌دارد 🍮';
      document.body.classList.add('has-chat');
      layoutRoom();
      botSayInLog(text);
      robot && robot.grin(1800);
      speakSequence(text);
    });
  });

  /* ── خوش‌آمد ── */
  function welcome() {
    say('سلام! من ژینوام 🌼 ژله‌های قفسه را لمس کن تا معرفی‌شان کنم، یا از من بپرس!');
  }
  welcome();
  setTimeout(function () { robot && robot.wave(); }, 700);

  /* ── چیدمان واکنش‌گرا: viewBox پویا + موقعیت برچسب‌ها ── */
  var room = document.getElementById('room');
  var tagJelly = document.querySelector('.zf-tag-jelly');
  var tagCustard = document.querySelector('.zf-tag-custard');

  function place(tag, anchorId, dx, dy) {
    if (!room || !tag) return;
    var anchor = document.getElementById(anchorId);
    if (!anchor) return;
    var rr = room.getBoundingClientRect();
    var ar = anchor.getBoundingClientRect();
    var x = ar.left - rr.left + dx;
    var y = ar.top - rr.top + dy;
    var w = tag.offsetWidth || 150, h = tag.offsetHeight || 28;
    x = Math.max(8, Math.min(rr.width - w - 8, x));
    y = Math.max(8, Math.min(rr.height - h - 8, y));
    tag.style.left = x + 'px';
    tag.style.top = y + 'px';
    tag.classList.add('is-set');
  }

  function layoutRoom() {
    if (!room) return;
    var svg = document.getElementById('zf-svg');
    if (!svg) return;
    var rr = room.getBoundingClientRect();
    if (rr.width < 2 || rr.height < 2) return;
    /* پنجرهٔ دید همیشه تمام ارتفاع صحنه را نشان می‌دهد؛ عرض بر اساس
       نسبت واقعی اتاق محاسبه می‌شود — هیچ‌گاه چیزی از بالا بریده نمی‌شود */
    var vbw = Math.max(430, Math.min(1600, 680 * (rr.width / rr.height)));
    var x0 = 380 - vbw / 2 + (vbw < 620 ? 12 : 0);
    svg.setAttribute('viewBox', x0.toFixed(1) + ' 0 ' + vbw.toFixed(1) + ' 680');
    place(tagJelly, 'zf-anchor-jelly', -((tagJelly.offsetWidth || 150) * 0.55), -32);
    place(tagCustard, 'zf-anchor-custard', 8, -14);
  }
  window.addEventListener('resize', layoutRoom);
  window.addEventListener('orientationchange', layoutRoom);
  setTimeout(layoutRoom, 50);
  setTimeout(layoutRoom, 600);

  /* لمس خود ربات → سلام */
  document.getElementById('room').addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#g-head,#g-torso')) robot && robot.wave();
  });

  /* ذرات طلایی معلق */
  var motes = document.getElementById('motes');
  for (var i = 0; i < 12; i++) {
    var s = document.createElement('i');
    var size = 2 + Math.random() * 3.5;
    s.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + (10 + Math.random() * 80) + '%;top:' + (34 + Math.random() * 58) +
      '%;--o:' + (0.3 + Math.random() * 0.45).toFixed(2) + ';--dx:' + ((Math.random() - 0.5) * 46).toFixed(0) + 'px;animation-duration:' + (10 + Math.random() * 13) + 's;animation-delay:-' + (Math.random() * 15).toFixed(1) + 's';
    motes.appendChild(s);
  }
})();
</script>
