<!doctype html>
<!-- ============================================================
  ZHINO · CONCEPT A — "PREMIUM ROBOT POD"
  پیش‌نمایش مستقل طراحی پروفایل ربات ژینو — نسخهٔ A
  • محفظهٔ شیشه‌ای سینمایی با قاب طلایی، نورپردازی لوکس
  • ربات زنده (پلک، نگاه، حالت فکر/گفتار/سلام) — جایگاه انیمیشن آینده
  • RTL · موبایل‌اول · فونت وزیرمتن + مارسلوس · بدون وابستگی خارجی
============================================================ -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#160409" />
<title>ژینو — کانسپت A · پاد پرمیوم</title>
<style>
/* ── فونت‌های سلف‌هاست (همان مالکیت سایت اصلی) ── */
@font-face{font-family:'Vazirmatn';font-style:normal;font-display:swap;font-weight:100 900;
  src:url('/fonts/vazirmatn-arabic-wght-normal.woff2') format('woff2-variations');
  unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC;}
@font-face{font-family:'Vazirmatn';font-style:normal;font-display:swap;font-weight:100 900;
  src:url('/fonts/vazirmatn-latin-wght-normal.woff2') format('woff2-variations');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Marcellus';font-style:normal;font-display:swap;font-weight:400;
  src:url('/fonts/marcellus-latin-400-normal.woff2') format('woff2');unicode-range:U+0000-00FF;}
@font-face{font-family:'Marcellus';font-style:normal;font-display:swap;font-weight:400;
  src:url('/fonts/marcellus-latin-ext-400-normal.woff2') format('woff2');unicode-range:U+0100-024F;}

:root{
  --noir:#160409; --noir-2:#1f060d; --wine-deep:#2a0b12; --wine:#5a1725; --wine-2:#71313b;
  --gold:#c9a55f; --gold-hi:#eed9a4; --gold-dim:rgba(201,165,95,.34);
  --ivory:#f5efe4; --ivory-dim:rgba(245,239,228,.66); --ivory-faint:rgba(245,239,228,.4);
  --glass:rgba(255,244,224,.055); --glass-line:rgba(201,165,95,.22);
  --ok:#8fd6a8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--noir); color:var(--ivory);
  font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  height:100vh; height:100dvh;
  -webkit-font-smoothing:antialiased;
}
/* ── بستر صحنه: عمق زرشکی-نوآر با هاله‌های گرم ── */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(120% 62% at 50% -14%, rgba(122,42,54,.42) 0%, rgba(122,42,54,0) 58%),
    radial-gradient(85% 52% at 50% 108%, rgba(90,23,37,.5) 0%, rgba(42,11,18,0) 62%),
    radial-gradient(46% 30% at 14% 30%, rgba(201,165,95,.08) 0%, rgba(201,165,95,0) 70%),
    radial-gradient(52% 34% at 88% 22%, rgba(113,49,59,.16) 0%, rgba(113,49,59,0) 72%),
    linear-gradient(180deg,#1a050b 0%, #160409 42%, #200811 100%);
}
/* بافت نقطه‌ای خیلی ظریف */
body::after{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background-image:radial-gradient(rgba(245,239,228,.05) .6px, transparent .8px);
  background-size:26px 26px;
  mask-image:radial-gradient(90% 70% at 50% 34%, #000 0%, transparent 78%);
  -webkit-mask-image:radial-gradient(90% 70% at 50% 34%, #000 0%, transparent 78%);
}

/* ═══════════ سربرگ ── نوار کنسول شیشه‌ای ═══════════ */
.za-top{
  position:relative; z-index:30; flex:none;
  display:flex; align-items:center; justify-content:space-between; gap:.6rem;
  padding:calc(.6rem + env(safe-area-inset-top,0px)) .9rem .55rem;
}
.za-chip{
  display:inline-flex; align-items:center; gap:.4rem;
  height:2.35rem; padding:0 .85rem; border-radius:999px;
  border:1px solid var(--glass-line); background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(1.25); backdrop-filter:blur(14px) saturate(1.25);
  color:var(--ivory-dim); font:600 .74rem/1 'Vazirmatn',sans-serif; cursor:pointer;
  transition:border-color .25s,color .25s,background .25s,transform .2s;
}
.za-chip svg{width:.95rem;height:.95rem}
.za-chip:hover{border-color:rgba(201,165,95,.5);color:var(--gold-hi);background:rgba(201,165,95,.08)}
.za-chip:active{transform:scale(.96)}
.za-brand{display:flex;flex-direction:column;align-items:center;gap:.14rem;min-width:0}
.za-brand-en{font-family:'Marcellus',serif;font-size:.86rem;letter-spacing:.42em;text-indent:.42em;color:var(--gold);line-height:1}
.za-brand-fa{font-size:.66rem;font-weight:500;color:var(--ivory-faint);letter-spacing:.06em}

/* ═══════════ صحنهٔ پاد ═══════════ */
.za-stage{
  position:relative; z-index:10; flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding:.2rem 1rem 0;
}
.za-scene{
  position:relative; flex:1 1 auto; min-height:0; width:100%; max-width:860px;
  display:flex; align-items:flex-end; justify-content:center;
}
.za-scene svg.za-pod{
  height:100%; max-height:100%; width:auto; max-width:100%;
  display:block; filter:drop-shadow(0 26px 60px rgba(0,0,0,.5));
}
/* دکمهٔ لمس روی ربات — نامرئی ولی با فیدبک */
.za-pod #g-head{cursor:pointer}
.za-pod #g-torso{cursor:pointer}

/* ── هالهٔ نور متحرک پشت پاد ── */
.za-halo{
  position:absolute; left:50%; bottom:16%; width:min(120vw,760px); aspect-ratio:1;
  transform:translateX(-50%); pointer-events:none; opacity:.55; z-index:-1;
  background:radial-gradient(circle, rgba(201,165,95,.14) 0%, rgba(90,23,37,.18) 34%, transparent 66%);
  animation:zaHalo 7s ease-in-out infinite;
}
@keyframes zaHalo{0%,100%{opacity:.45;transform:translateX(-50%) scale(1)}50%{opacity:.7;transform:translateX(-50%) scale(1.05)}}

/* ── پیل وضعیت ── */
.za-status{
  position:absolute; top:.55rem; right:0; z-index:6;
  display:inline-flex; align-items:center; gap:.45rem;
  height:1.9rem; padding:0 .8rem; border-radius:999px;
  border:1px solid var(--glass-line); background:rgba(22,4,9,.55);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  font:500 .68rem/1 'Vazirmatn',sans-serif; color:var(--ivory-dim);
}
.za-status i{width:.44rem;height:.44rem;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(143,214,168,.5);animation:zaPulse 2.4s infinite}
.za-status.is-think i{background:var(--gold-hi);box-shadow:0 0 0 0 rgba(238,217,164,.5)}
.za-status.is-speak i{background:#e79aa6;box-shadow:0 0 0 0 rgba(231,154,166,.5)}
@keyframes zaPulse{0%{box-shadow:0 0 0 0 rgba(143,214,168,.45)}70%{box-shadow:0 0 0 7px rgba(143,214,168,0)}100%{box-shadow:0 0 0 0 rgba(143,214,168,0)}}

/* برچسب عمودی کنار پاد (دسکتاپ) */
.za-side-tag{
  position:absolute; top:38%; left:-.4rem; z-index:6; display:none;
  writing-mode:vertical-rl; font-family:'Marcellus',serif; font-size:.66rem;
  letter-spacing:.5em; color:rgba(201,165,95,.4); user-select:none;
}

/* ── حباب پیام خوش‌آمد (شیشه‌ای، لبهٔ طلایی) ── */
.za-comm{
  position:absolute; top:8%; right:2%; z-index:6; max-width:15rem;
  padding:.6rem .85rem; border-radius:1rem .3rem 1rem 1rem;
  border:1px solid var(--glass-line); background:rgba(31,6,13,.62);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  font:500 .74rem/1.75 'Vazirmatn',sans-serif; color:var(--ivory);
  box-shadow:0 14px 34px -18px rgba(0,0,0,.65);
  animation:zaCommIn .7s .8s cubic-bezier(.2,.9,.3,1.2) both;
}
.za-comm b{color:var(--gold-hi);font-weight:700}
@keyframes zaCommIn{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}

/* ── پلاک نام زیر پاد ── */
.za-plaque{flex:none; text-align:center; padding:.65rem 0 .2rem; position:relative; z-index:6}
.za-plaque-en{font-family:'Marcellus',serif;font-size:.68rem;letter-spacing:.5em;text-indent:.5em;color:rgba(201,165,95,.62)}
.za-plaque h1{margin:.28rem 0 .18rem;font-size:clamp(1.25rem,4.6vw,1.7rem);font-weight:800;color:var(--ivory);letter-spacing:-.01em}
.za-plaque p{margin:0;font-size:.72rem;color:var(--ivory-faint);font-weight:500}
.za-plaque .za-rule{
  display:block;width:5.2rem;height:1px;margin:.5rem auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6;
}

/* ═══════════ سیاط گفتگو (فقط بعد از اولین پیام) ═══════════ */
.za-log{
  display:none; flex:none; z-index:20; flex-direction:column; gap:.55rem;
  max-height:31dvh; overflow-y:auto; overscroll-behavior:contain;
  padding:.8rem .95rem .3rem; scrollbar-width:thin; scrollbar-color:rgba(201,165,95,.25) transparent;
}
body.has-chat .za-log{display:flex}
.za-msg{display:flex;flex-direction:column;max-width:86%;animation:zaMsgIn .35s ease both}
@keyframes zaMsgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.za-msg.is-user{align-self:flex-start;align-items:flex-start}
.za-msg.is-bot{align-self:flex-end;align-items:flex-end}
.za-who{font-size:.62rem;font-weight:700;letter-spacing:.05em;color:rgba(201,165,95,.7);margin:0 .3rem .22rem}
.za-msg.is-user .za-who{color:rgba(231,154,166,.75)}
.za-bubble{
  padding:.62rem .85rem; border-radius:.4rem 1rem 1rem 1rem; font-size:.8rem; line-height:1.95; font-weight:500;
  border:1px solid var(--glass-line); background:rgba(31,6,13,.72);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 12px 28px -18px rgba(0,0,0,.7);
}
.za-msg.is-user .za-bubble{border-radius:1rem .4rem 1rem 1rem;border-color:rgba(231,154,166,.26);background:rgba(90,23,37,.4)}
.za-bubble .za-caret{display:inline-block;width:1px;height:.9em;background:var(--gold-hi);vertical-align:-.12em;margin-inline-start:2px;animation:zaBlink .8s steps(2) infinite}
@keyframes zaBlink{50%{opacity:0}}
.za-dots{display:inline-flex;gap:.3rem;padding:.35rem .1rem}
.za-dots span{width:.38rem;height:.38rem;border-radius:50%;background:var(--gold);opacity:.5;animation:zaDot 1.1s ease-in-out infinite}
.za-dots span:nth-child(2){animation-delay:.15s}.za-dots span:nth-child(3){animation-delay:.3s}
@keyframes zaDot{0%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}

/* ═══════════ کنسول پیام ═══════════ */
.za-console{
  position:relative; z-index:30; flex:none;
  padding:.45rem .9rem calc(.7rem + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg, rgba(22,4,9,0) 0%, rgba(22,4,9,.88) 34%, #160409 100%);
}
.za-chips{display:flex;gap:.45rem;overflow-x:auto;padding:.15rem .05rem .5rem;scrollbar-width:none}
.za-chips::-webkit-scrollbar{display:none}
.za-chip-s{
  flex:none; display:inline-flex; align-items:center; gap:.38rem;
  height:2rem; padding:0 .85rem; border-radius:999px; cursor:pointer;
  border:1px solid rgba(201,165,95,.2); background:rgba(201,165,95,.07);
  color:var(--ivory-dim); font:500 .72rem/1 'Vazirmatn',sans-serif;
  transition:border-color .22s,color .22s,transform .15s,background .22s;
}
.za-chip-s::before{content:"";width:.34rem;height:.34rem;border-radius:50%;background:var(--gold);opacity:.75}
.za-chip-s:hover{border-color:rgba(201,165,95,.48);color:var(--gold-hi)}
.za-chip-s:active{transform:scale(.95)}
.za-form{display:flex;align-items:center;gap:.5rem}
.za-field{
  flex:1; display:flex; align-items:center; min-width:0; height:3rem;
  border-radius:1.1rem; border:1px solid var(--glass-line);
  background:rgba(255,244,224,.05);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  transition:border-color .25s, box-shadow .25s;
}
.za-field:focus-within{border-color:rgba(201,165,95,.55);box-shadow:0 0 0 3px rgba(201,165,95,.12), inset 0 1px 0 rgba(255,255,255,.05)}
.za-input{
  flex:1; min-width:0; height:100%; padding:0 1rem; border:0; outline:0; background:transparent;
  color:var(--ivory); font:500 .84rem/1 'Vazirmatn',sans-serif;
}
.za-input::placeholder{color:rgba(245,239,228,.34)}
.za-voice{
  flex:none; display:inline-flex;align-items:center;justify-content:center;
  width:2.2rem;height:2.2rem;border-radius:50%;cursor:pointer;margin-inline-end:.35rem;
  border:1px solid transparent;background:transparent;color:rgba(245,239,228,.4);
  transition:color .2s,border-color .2s,background .2s;
}
.za-voice svg{width:1.05rem;height:1.05rem}
.za-voice:hover{color:var(--ivory-dim)}
.za-voice.is-on{color:var(--gold-hi);border-color:rgba(201,165,95,.4);background:rgba(201,165,95,.1)}
.za-send{
  flex:none; width:3rem; height:3rem; border-radius:1.05rem; border:0; cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center; color:#2a0b12;
  background:linear-gradient(145deg,#eed9a4 0%,#c9a55f 52%,#a5813e 100%);
  box-shadow:0 10px 26px -10px rgba(201,165,95,.55), inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .18s, box-shadow .25s, filter .2s;
}
.za-send svg{width:1.3rem;height:1.3rem}
.za-send:hover{filter:brightness(1.06)}
.za-send:active{transform:scale(.93)}
.za-send:disabled{filter:grayscale(.45) brightness(.75);cursor:default;box-shadow:none}
.za-meta{display:flex;align-items:center;justify-content:space-between;padding:.4rem .3rem 0}
.za-hint{font-size:.62rem;color:rgba(245,239,228,.3);font-weight:500}
.za-sign{font-size:.62rem;color:rgba(201,165,95,.4);font-weight:500}

/* ── توست ── */
.za-toast{
  position:fixed; bottom:calc(5.6rem + env(safe-area-inset-bottom,0px)); left:50%; z-index:80;
  transform:translateX(-50%) translateY(8px); opacity:0; pointer-events:none;
  padding:.55rem 1rem; border-radius:999px; font:500 .72rem/1.6 'Vazirmatn',sans-serif;
  border:1px solid var(--glass-line); background:rgba(31,6,13,.9); color:var(--ivory);
  transition:opacity .3s, transform .3s; max-width:88vw; text-align:center;
}
.za-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── ذرات طلایی (روی کل صحنه) ── */
.za-dust{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.za-dust i{
  position:absolute; display:block; border-radius:50%;
  background:radial-gradient(circle,#eed9a4 0%,rgba(201,165,95,0) 70%);
  animation:zaFloat linear infinite;
}
@keyframes zaFloat{
  0%{transform:translateY(12vh) translateX(0);opacity:0}
  12%{opacity:var(--o,.5)}
  82%{opacity:var(--o,.5)}
  100%{transform:translateY(-78vh) translateX(var(--dx,10px));opacity:0}
}

/* ═══════════ تبلت/دسکتاپ: صحنه عریض‌تر ═══════════ */
@media (min-width:720px){
  .za-scene{max-width:760px}
  .za-side-tag{display:block}
  .za-log{max-width:760px;margin:0 auto;width:100%}
  .za-console{padding-inline:calc(50vw - 380px)}
}
/* موبایل خیلی باریک: وضعیت چپ می‌ماند ولی جمع‌تر */
@media (max-width:360px){
  .za-status{padding:0 .6rem;font-size:.6rem}
  .za-comm{max-width:12.5rem;font-size:.68rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important}
}
</style>
</head>
<body>

<!-- ═══════ سربرگ ═══════ -->
<header class="za-top">
  <button class="za-chip" type="button" onclick="location.href='/'" aria-label="بازگشت به سایت">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>بازگشت به سایت</span>
  </button>
  <div class="za-brand" aria-hidden="true">
    <span class="za-brand-en">ZHINO</span>
    <span class="za-brand-fa">دستیار هوشمند</span>
  </div>
  <button class="za-chip" type="button" id="btnNew" aria-label="گفتگوی تازه">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.3 8.6A6.4 6.4 0 0 0 5.1 6.1L3.4 7.9m0 0V4.3m0 3.6h3.6m-3.3 3.5a6.4 6.4 0 0 0 11.2 2.5l1.7-1.8m0 0v3.6m0-3.6h-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</header>

<!-- ═══════ صحنهٔ پاد ═══════ -->
<main class="za-stage">
  <div class="za-halo" aria-hidden="true"></div>

  <div class="za-scene">
    <span class="za-side-tag" aria-hidden="true">ZHINO&nbsp;·&nbsp;POD&nbsp;Z-01</span>

    <div class="za-status" id="status" role="status"><i></i><span id="statusText">آمادهٔ گفتگو</span></div>

    <div class="za-comm" id="comm"><b>ژینو:</b> سلام! هرچه دربارهٔ ژله و کاستر بدانی، اینجا می‌درخشد ✨ بپرس…</div>

    <!-- ── پاد شیشه‌ای + ربات زنده (یک SVG واحد، همان ریگ concept-A-v3) ── -->
    <svg class="za-pod" id="podSvg" viewBox="0 0 760 940" role="img" aria-label="ربات ژینو داخل محفظهٔ شیشه‌ای">
      <defs>
        <linearGradient id="za-goldV" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#EAD097"/><stop offset=".5" stop-color="#C9A55F"/><stop offset="1" stop-color="#8F6E2B"/>
        </linearGradient>
        <radialGradient id="za-gold" cx="35%" cy="30%" r="85%">
          <stop offset="0" stop-color="#F2DCA9"/><stop offset=".45" stop-color="#D2AF6C"/><stop offset="1" stop-color="#96752E"/>
        </radialGradient>
        <radialGradient id="za-maroon" cx="35%" cy="30%" r="85%">
          <stop offset="0" stop-color="#9A605C"/><stop offset=".55" stop-color="#804D4C"/><stop offset="1" stop-color="#5E3634"/>
        </radialGradient>
        <radialGradient id="za-creamR" cx="35%" cy="28%" r="80%">
          <stop offset="0" stop-color="#F9F2E4"/><stop offset=".45" stop-color="#F3E9D8"/><stop offset=".8" stop-color="#E7DAC4"/><stop offset="1" stop-color="#D6C6AC"/>
        </radialGradient>
        <linearGradient id="za-creamL" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#F7F0E1"/><stop offset=".55" stop-color="#EFE4D1"/><stop offset="1" stop-color="#DACAB0"/>
        </linearGradient>
        <linearGradient id="za-creamLr" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="#F7F0E1"/><stop offset=".55" stop-color="#EFE4D1"/><stop offset="1" stop-color="#DACAB0"/>
        </linearGradient>
        <radialGradient id="za-creamPod" cx="35%" cy="30%" r="80%">
          <stop offset="0" stop-color="#F9F2E4"/><stop offset="1" stop-color="#DFD0B6"/>
        </radialGradient>
        <radialGradient id="za-screen" cx="42%" cy="34%" r="85%">
          <stop offset="0" stop-color="#272524"/><stop offset=".55" stop-color="#141312"/><stop offset="1" stop-color="#060605"/>
        </radialGradient>

        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 7.6h2.4L10.5 5v10L6.4 12.4H4a.9.9 0 0 1-.9-.9V8.5c0-.5.4-.9.9-.9Zm9.1-.5a3.4 3.4 0 0 1 0 5.8m1.9-8.2a6.3 6.3 0 0 1 0 10.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </span>
    <button class="za-send" type="submit" id="btnSend" aria-label="ارسال پیام">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.7 9.3 17.2 2.6a.6.6 0 0 1 .8.75l-6.6 14.9a.6.6 0 0 1-1.1-.05l-1.8-5-5.05-1.8a.6.6 0 0 1-.05-1.1Z" fill="currentColor"/></svg>
    </button>
  </form>
  <div class="za-meta">
    <span class="za-hint">برای ارسال، Enter را بزنید</span>
    <span class="za-sign">ساخته شده توسط m.azizi</span>
  </div>
</footer>

<div class="za-toast" id="toast" role="status"></div>
<div class="za-dust" id="dust" aria-hidden="true"></div>

<script>
/* ============================================================
   موتور ربات ژینو — همان ریگ زندهٔ concept-A-v3
   حالت‌ها: idle / thinking / speaking / greeting + نگاه به اشاره‌گر
============================================================ */
(function () {
  'use strict';
  function init() {
    function $(id) { return document.getElementById(id); }
    var els = {
      head: $('g-head'), antenna: $('g-antenna'), eyes: $('g-eyes'),
      torso: $('g-torso'),
      armL: $('g-upper-l'), foreL: $('g-fore-l'), elbowL: $('g-elbow-l'),
      armR: $('g-upper-r'), foreR: $('g-fore-r'), elbowR: $('g-elbow-r'),
      smile: $('m-smile'), talk: $('m-talk'), grin: $('m-grin'),
      talkGlow: $('m-talk-glow'), talkDots: $('m-talk-dots')
    };
    var R = Math.random;
    var seeds = []; for (var i = 0; i < 14; i++) seeds.push(R() * Math.PI * 2);
    function noise(t, i, speed) {
      var s = seeds[i % seeds.length]; speed = speed || 1;
      return Math.sin(t * 0.90 * speed + s) * 0.55 + Math.sin(t * 1.73 * speed + s * 2.7) * 0.30 + Math.sin(t * 2.57 * speed + s * 5.1) * 0.15;
    }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function ease(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
    function lerp(a, b, k) { return a + (b - a) * k; }
    var reduce = 1;
    try { if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) reduce = 0.25; } catch (e) {}

    var state = 'idle';
    var w = { idle: 1, thinking: 0, speaking: 0, greeting: 0 };
    var target = { idle: 1, thinking: 0, speaking: 0, greeting: 0 };
    var waveT0 = -100, thinkSide = R() < 0.5 ? -1 : 1, speechSeed = R() * 10;
    var clock = 0;

    function setState(s) {
      if (!(s in w)) return;
      if (s === state) { if (s === 'greeting') waveT0 = clock; return; }
      state = s;
      for (var k in target) target[k] = (k === s) ? 1 : 0;
      if (s === 'greeting') waveT0 = clock;
      if (s === 'thinking') thinkSide = R() < 0.5 ? -1 : 1;
      if (s === 'speaking') speechSeed = R() * 10;
    }

    /* نگاه به اشاره‌گر کاربر */
    var ptr = { x: 0, y: 0 }, ptrT = { x: 0, y: 0 };
    function onPointer(e) {
      var svg = $('podSvg'); if (!svg) return;
      var r = svg.getBoundingClientRect();
      var hx = r.left + r.width * 0.5, hy = r.top + r.height * 0.27; /* حدود سر ربات */
      ptrT.x = clamp((e.clientX - hx) / (r.width * 0.55), -1, 1);
      ptrT.y = clamp((e.clientY - hy) / (r.height * 0.5), -1, 1);
    }
    window.addEventListener('pointermove', onPointer, { passive: true });
    window.addEventListener('pointerdown', onPointer, { passive: true });

    var nextBlink = 0.9 + R() * 2.2, blinkStart = -1, blinkDouble = false;
    function blinkScale(t) {
      if (blinkStart < 0) {
        if (t >= nextBlink) { blinkStart = t; blinkDouble = R() < 0.2; } else return 1;
      }
      var p = t - blinkStart;
      if (p < 0) return 1;
      var c = 0.085, h = 0.04, o = 0.17;
      if (p < c) return 1 - 0.94 * ease(p / c);
      if (p < c + h) return 0.06;
      if (p < c + h + o) return 0.06 + 0.94 * ease((p - c - h) / o);
      if (blinkDouble) { blinkDouble = false; blinkStart = t + 0.14; return 1; }
      blinkStart = -1; nextBlink = t + 1.5 + R() * 4.6; return 1;
    }
    var gx = 0, gy = 0, sx0 = 0, sy0 = 0, sx1 = 0, sy1 = 0, sacT0 = -1, sacDur = 0.12, nextSac = 0.5 + R();
    function stepGaze(t, dt) {
      ptr.x = lerp(ptr.x, ptrT.x, Math.min(1, dt * 3.4));
      ptr.y = lerp(ptr.y, ptrT.y, Math.min(1, dt * 3.4));
      if (t >= nextSac) {
        sx0 = gx; sy0 = gy;
        var tx, ty, hold;
        if (w.thinking > 0.4) { tx = thinkSide * (3 + R() * 3); ty = -6 - R() * 3; hold = 1.1; }
        else if (w.speaking > 0.4) { tx = (R() - 0.5) * 7; ty = (R() - 0.5) * 4; hold = 0.55; }
        else { tx = (R() - 0.5) * 11; ty = (R() - 0.5) * 5; hold = 0.75; }
        sx1 = tx + ptr.x * 7; sy1 = ty + ptr.y * 4.2;
        sacT0 = t; sacDur = 0.09 + R() * 0.09;
        nextSac = t + hold * (0.4 + R() * 1.6);
      }
      var k = sacT0 < 0 ? 1 : ease((t - sacT0) / sacDur);
      gx = lerp(sx0, sx1, k) + 0.35 * noise(t, 5, 1.9);
      gy = lerp(sy0, sy1, k) + 0.25 * noise(t, 6, 2.3);
    }
    var antA = 0, antV = 0, last = null, raf = 0;
    function step(dt) {
      var t = clock, k, s;
      for (k in w) w[k] += (target[k] - w[k]) * Math.min(1, dt / 0.26);
      var wp = (t - waveT0);
      var raise = 0;
      if (wp >= 0) {
        if (wp < 0.55) raise = ease(wp / 0.55);
        else if (wp < 2.35) raise = 1;
        else if (wp < 3.0) raise = 1 - ease((wp - 2.35) / 0.65);
        else { raise = 0; if (state === 'greeting') setState('idle'); }
      }
      var syl = Math.pow(Math.max(0, Math.sin(t * 2 * Math.PI * 2.7 + speechSeed)), 0.65);
      var gate = clamp(noise(t, 7, 0.5) * 0.9 + 0.62, 0, 1);
      var talkAmp = w.speaking * gate;
      var open = talkAmp * (0.22 + 0.78 * syl);
      var brPhase = t * 2 * Math.PI * 0.235 + 0.7 * noise(t, 3, 0.11);
      var br = 1 + reduce * 0.011 * Math.sin(brPhase);
      var torsoTy = reduce * 0.9 * Math.sin(brPhase);
      var torsoRot = reduce * 0.35 * noise(t, 9, 0.17);
      var hr = reduce * (1.05 * noise(t, 0, 0.19)
            + w.thinking * (1.6 * Math.sin(t * 0.7 + seeds[2]) + 1.2 * thinkSide)
            + w.speaking * 1.5 * syl * gate
            + raise * 1.9 * thinkSide * 0.6
            + ptr.x * 2.6);
      var hx = reduce * (1.4 * noise(t, 1, 0.15) + w.thinking * 1.2 * thinkSide + ptr.x * 2.2);
      var hy = reduce * (-1.1 * (br - 1) * 90 + w.thinking * 1.4 + raise * -1.0 + ptr.y * 2.0);
      var antTarget = -hr * 1.9 + reduce * (1.5 * noise(t, 4, 0.55)) * (0.55 + w.thinking * 0.9 + raise * 1.1 + w.speaking * 0.5);
      antV += ((antTarget - antA) * 46 - antV * 7.5) * dt;
      antA += antV * dt;
      stepGaze(t, dt);
      var bs = blinkScale(t);
      var squint = 1 - 0.16 * raise;
      var talkOp = clamp(w.speaking * 1.25, 0, 1) * clamp(gate * 2.2, 0, 1);
      var grinOp = clamp(raise * 1.1, 0, 1);
      var smileOp = clamp(1 - talkOp * 0.92 - grinOp * 0.85, 0, 1);
      var mrx = 13 + 8 * open, mry = 3 + 12 * open;
      var aL = reduce * (0.9 * noise(t, 8, 0.21) + w.speaking * 2.2 * Math.sin(t * 1.9 + 1.2) * gate);
      var fL = reduce * (1.3 * noise(t, 10, 0.29) + w.speaking * 5.5 * Math.sin(t * 2 * Math.PI * 0.85 + 0.4) * gate);
      var aR = reduce * (0.9 * noise(t, 11, 0.23)) - raise * 107;
      var fR = reduce * (1.3 * noise(t, 12, 0.31)) + raise * (-140 + 16 * Math.sin(t * 2 * Math.PI * 1.9 + 0.7));
      els.torso.setAttribute('transform', 'translate(0 ' + torsoTy.toFixed(2) + ') rotate(' + torsoRot.toFixed(2) + ' 360 662) translate(360 662) scale(1 ' + br.toFixed(4) + ') translate(-360 -662)');
      els.head.setAttribute('transform', 'translate(' + hx.toFixed(2) + ' ' + hy.toFixed(2) + ') rotate(' + hr.toFixed(2) + ' 360 400)');
      els.antenna.setAttribute('transform', 'rotate(' + antA.toFixed(2) + ' 136 236)');
      els.eyes.setAttribute('transform', 'translate(' + gx.toFixed(2) + ' ' + gy.toFixed(2) + ') translate(360 254) scale(1 ' + (bs * squint).toFixed(3) + ') translate(-360 -254)');
      els.armL.setAttribute('transform', 'rotate(' + aL.toFixed(2) + ' 204 472)');
      els.foreL.setAttribute('transform', 'rotate(' + fL.toFixed(2) + ' 185 557)');
      els.elbowL.setAttribute('transform', 'rotate(' + aL.toFixed(2) + ' 204 472) rotate(8 185 557)');
      els.armR.setAttribute('transform', 'rotate(' + aR.toFixed(2) + ' 516 472)');
      els.foreR.setAttribute('transform', 'rotate(' + fR.toFixed(2) + ' 535 557)');
      els.elbowR.setAttribute('transform', 'rotate(' + aR.toFixed(2) + ' 516 472) rotate(-8 535 557)');
      els.smile.setAttribute('opacity', smileOp.toFixed(3));
      els.talk.setAttribute('opacity', talkOp.toFixed(3));
      els.grin.setAttribute('opacity', grinOp.toFixed(3));
      els.talkGlow.setAttribute('rx', mrx.toFixed(2)); els.talkGlow.setAttribute('ry', mry.toFixed(2));
      els.talkDots.setAttribute('rx', mrx.toFixed(2)); els.talkDots.setAttribute('ry', mry.toFixed(2));
    }
    function frame(ts) {
      raf = requestAnimationFrame(frame);
      if (last === null) last = ts;
      var dt = Math.min(0.05, (ts - last) / 1000);
      last = ts; clock += dt; step(dt);
    }
    requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
      else if (!raf) { last = null; raf = requestAnimationFrame(frame); }
    });
    window.ZhinoRobot = {
      set: setState,
      wave: function () { setState('greeting'); },
      grin: function () { waveT0 = clock; setState('greeting'); },
      get state() { return state; }
    };
  }
  init();
})();

/* ============================================================
   رابط گفتگوی نمایشی — چیدمان، وضعیت ربات و پاسخ‌های نمونه
============================================================ */
(function () {
  'use strict';
  var robot = window.ZhinoRobot;
  var log = document.getElementById('log');
  var input = document.getElementById('input');
  var form = document.getElementById('form');
  var send = document.getElementById('btnSend');
  var status = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var comm = document.getElementById('comm');
  var toast = document.getElementById('toast');
  var busy = false, toastT = 0;

  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { toast.classList.remove('show'); }, 3200);
  }

  /* پاسخ‌های نمونهٔ محلی — در نسخهٔ نهایی به موتور واقعی دستیار وصل می‌شود */
  function reply(q) {
    if (/سلام|درود|هی|خوبی/.test(q)) return 'سلام! خوش آمدید 🌟 من ژینو هستم؛ راهنمای پودرهای ژله و کاستر. دنبال چه طعمی هستید؟';
    if (/ژله/.test(q) && /طعم|چه|چی|لیست|دارید/.test(q) || /طعم/.test(q)) return 'پودرهای ژلهٔ ژینو در ۱۶ طعم — از انار، توت‌فرنگی و آلبالو تا آناناس، هندوانه و هفت‌میوه. هر بستهٔ ۲۵۰ گرمی ۲۰۰٬۰۰۰ تومان است. کدام را بازگو کنم؟';
    if (/کاستر/.test(q)) return 'کاستر ژینو در ۷ طعم: موز، شکلات، پرتقال، توت‌فرنگی، طالبی، هفت‌میوه و محلبی‌وانیلی 🍮 برای دسرِ یک‌دست و خوشمزه عالی است.';
    if (/مهمانی|پیشنهاد|پیشنهاد/.test(q)) return 'برای مهمانی، ترکیب محبوب خانه‌ها: ژلهٔ انار + کاستر محلبی‌وانیلی. ساده، شیک و همیشه می‌درخشد ✨';
    if (/ارسال|پست|چند روز/.test(q)) return 'سفارش‌ها تهران ۱ تا ۲ روز کاری و سایر شهرها ۲ تا ۴ روز کاری به دست‌تان می‌رسد. بسته‌بندی ایمن است و ژله‌ها سالم می‌رسند.';
    if (/قیمت|تومان|چند/.test(q)) return 'هر بستهٔ ۲۵۰ گرمی پودر ژله و کاستر ۲۰۰٬۰۰۰ تومان است؛ لیست کامل طعم‌ها در فروشگاه موجود است.';
    if (/مرسی|ممنون|تشکر/.test(q)) return 'خواهش می‌کنم! هر وقت طعم جدیدی خواستید، من همین‌جا هستم 🌟';
    if (/خرید|سبد|سفارش/.test(q)) return 'از دکمهٔ «بازگشت به سایت» وارد فروشگاه شوید؛ افزودن به سبد همان‌جا انجام می‌شود. اینجا هم می‌توانم راهنمایی‌تان کنم.';
    return 'این یک پیش‌نمایش طراحی است و پاسخ‌ها نمایشی‌اند؛ در نسخهٔ نهایی به دادهٔ واقعی فروشگاه وصل می‌شوم. فعلاً از ژله‌ها برایتان بگویم؟ 🍮';
  }

  function addMsg(kind, text) {
    var wrap = document.createElement('div');
    wrap.className = 'za-msg is-' + kind;
    var who = document.createElement('span');
    who.className = 'za-who'; who.textContent = kind === 'user' ? 'شما' : 'ژینو';
    var b = document.createElement('div'); b.className = 'za-bubble';
    if (text) b.textContent = text;
    wrap.appendChild(who); wrap.appendChild(b);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return b;
  }

  function setStatus(mode, label) {
    status.classList.remove('is-think', 'is-speak');
    if (mode) status.classList.add(mode);
    statusText.textContent = label;
  }

  function typeOut(bubble, text, done) {
    bubble.innerHTML = '<span class="za-txt"></span><span class="za-caret"></span>';
    var t = bubble.querySelector('.za-txt'), i = 0, step = Math.max(2, Math.round(text.length / 90));
    (function tick() {
      i = Math.min(text.length, i + step);
      t.textContent = text.slice(0, i);
      log.scrollTop = log.scrollHeight;
      if (i < text.length) setTimeout(tick, 24);
      else { bubble.querySelector('.za-caret').remove(); done(); }
    })();
  }

  function sendMsg(q) {
    q = (q || '').trim();
    if (!q || busy) return;
    busy = true; send.disabled = true;
    document.body.classList.add('has-chat');
    if (comm) comm.style.display = 'none';
    addMsg('user', q);
    input.value = '';
    setStatus('is-think', 'در حال فکر کردن…');
    robot && robot.set('thinking');
    var dots = addMsg('bot', '');
    dots.innerHTML = '<span class="za-dots"><span></span><span></span><span></span></span>';
    log.scrollTop = log.scrollHeight;
    setTimeout(function () {
      dots.innerHTML = '';
      var text = reply(q);
      setStatus('is-speak', 'در حال پاسخ…');
      robot && robot.set('speaking');
      typeOut(dots, text, function () {
        robot && robot.set('idle');
        setStatus('', 'آمادهٔ گفتگو');
        busy = false; send.disabled = false;
        if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) input.focus();
      });
    }, 700 + Math.random() * 500);
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); sendMsg(input.value); });
  document.getElementById('chips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-q]');
    if (b) sendMsg(b.getAttribute('data-q'));
  });
  document.getElementById('btnNew').addEventListener('click', function () {
    log.innerHTML = '';
    document.body.classList.remove('has-chat');
    if (comm) comm.style.display = '';
    busy = false; send.disabled = false;
    setStatus('', 'آمادهٔ گفتگو');
    robot && robot.wave();
  });
  document.getElementById('btnVoice').addEventListener('click', function () {
    var b = this; b.classList.toggle('is-on');
    showToast(b.classList.contains('is-on')
      ? 'خواندن با صدا در نسخهٔ نهایی به گویندهٔ فارسی وصل می‌شود.'
      : 'خواندن با صدا خاموش شد.');
  });

  /* سلام اولیهٔ ربات */
  setTimeout(function () { robot && robot.wave(); }, 650);

  /* لمس ربات → سلام و لبخند */
  var pod = document.getElementById('podSvg');
  pod.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#g-head,#g-torso')) { robot && robot.wave(); }
  });

  /* ذرات طلایی */
  var dust = document.getElementById('dust');
  for (var i = 0; i < 14; i++) {
    var s = document.createElement('i');
    var size = 2 + Math.random() * 4;
    s.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + (4 + Math.random() * 92) + '%;top:' + (30 + Math.random() * 62) +
      '%;--o:' + (0.25 + Math.random() * 0.5).toFixed(2) + ';--dx:' + ((Math.random() - 0.5) * 60).toFixed(0) + 'px;animation-duration:' + (9 + Math.random() * 12) + 's;animation-delay:-' + (Math.random() * 14).toFixed(1) + 's';
    dust.appendChild(s);
  }
})();
</script>
</body>
</html>
