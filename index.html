<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff7ef">
<meta name="description" content="ژینو؛ دنیایی از ژله‌های کریستالی و کاسترهای خوش‌طعم.">
<title>ژینو | دنیای طعم‌ها</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fffaf5;
  --paper:#fff;
  --ink:#241b18;
  --muted:#756964;
  --line:#eee2d9;
  --accent:#e85b45;
  --accent2:#f3a33b;
  --green:#5b8f62;
  --shadow:0 18px 50px rgba(72,39,24,.10);
  --radius:24px;
  --max:1180px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Vazirmatn,Tahoma,sans-serif;
  color:var(--ink);
  background:var(--bg);
  line-height:1.8;
}

a{
  text-decoration:none;
  color:inherit;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.container{
  width:min(var(--max),calc(100% - 32px));
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,250,245,.90);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(238,226,217,.8);
}

.nav{
  height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:23px;
}

.logo-mark{
  width:42px;
  height:42px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;
  place-items:center;
  color:white;
  box-shadow:0 8px 20px #e85b4540;
}

.navlinks{
  display:flex;
  gap:24px;
  color:#5e514c;
  font-weight:600;
}

.navlinks a{
  transition:.2s;
}

.navlinks a:hover{
  color:var(--accent);
}

.nav-actions{
  display:flex;
  gap:10px;
}

.iconbtn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#fff;
  border:1px solid var(--line);
  position:relative;
}

.badge{
  position:absolute;
  top:-6px;
  left:-5px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:99px;
  background:var(--accent);
  color:#fff;
  font-size:11px;
  display:grid;
  place-items:center;
}

.menu{
  display:none;
}

/* HERO */

.hero{
  padding:72px 0 55px;
  overflow:hidden;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.02fr .98fr;
  gap:55px;
  align-items:center;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#fff0e5;
  color:#b84938;
  padding:8px 14px;
  border-radius:99px;
  font-weight:800;
  font-size:13px;
}

h1{
  font-size:clamp(42px,6vw,76px);
  line-height:1.15;
  margin:18px 0 15px;
  letter-spacing:-2px;
}

h1 span{
  color:var(--accent);
}

.hero p{
  font-size:18px;
  color:var(--muted);
  max-width:650px;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin:28px 0;
}

.btn{
  padding:13px 20px;
  border-radius:15px;
  font-weight:800;
  transition:.2s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn-primary{
  background:var(--ink);
  color:white;
  box-shadow:0 10px 25px #241b1820;
}

.btn-primary:hover{
  transform:translateY(-2px);
}

.btn-light{
  background:#fff;
  border:1px solid var(--line);
}

.btn-light:hover{
  border-color:#d5c5bb;
}

.hero-points{
  display:flex;
  gap:22px;
  flex-wrap:wrap;
  color:#625650;
  font-size:14px;
  font-weight:600;
}

.hero-points span{
  display:flex;
  gap:7px;
  align-items:center;
}

.hero-art{
  min-height:490px;
  position:relative;
  display:grid;
  place-items:center;
}

.blob{
  position:absolute;
  width:430px;
  height:430px;
  background:linear-gradient(145deg,#ffe0c0,#fff1dd);
  border-radius:48% 52% 56% 44%;
  transform:rotate(8deg);
}

.hero-card{
  position:relative;
  width:min(390px,90%);
  aspect-ratio:4/5;
  border-radius:34px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transform:rotate(2deg);
  background:#ddd;
}

.hero-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.float{
  position:absolute;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  border-radius:18px;
  padding:11px 15px;
  font-weight:800;
  font-size:13px;
}

.float.one{
  top:45px;
  right:0;
}

.float.two{
  bottom:52px;
  left:0;
}

/* SECTIONS */

.section{
  padding:85px 0;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:28px;
}

.kicker{
  color:var(--accent);
  font-weight:900;
  font-size:13px;
}

.section h2{
  font-size:38px;
  line-height:1.3;
  margin:5px 0;
}

.section-head p{
  margin:0;
  color:var(--muted);
}

/* PRODUCTS */

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:22px;
}

.filter{
  background:#fff;
  border:1px solid var(--line);
  padding:9px 15px;
  border-radius:99px;
  font-weight:700;
  color:#695b55;
}

.filter.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink);
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  transition:.22s;
  box-shadow:0 5px 20px #5c35200a;
}

.product:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow);
}

.product-img{
  aspect-ratio:1/1;
  overflow:hidden;
  background:#f5eee8;
}

.product-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.35s;
}

.product:hover img{
  transform:scale(1.05);
}

.product-body{
  padding:16px;
}

.tag{
  font-size:11px;
  color:var(--green);
  font-weight:800;
}

.product h3{
  margin:4px 0;
  font-size:18px;
}

.product p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

.product-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:13px;
}

.price{
  font-weight:900;
}

.add{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#fff1eb;
  color:var(--accent);
  font-size:22px;
}

.add:hover{
  background:var(--accent);
  color:#fff;
}

/* FLAVORS */

.flavor{
  background:#241b18;
  color:#fff;
  border-radius:32px;
  padding:42px;
}

.flavor-grid{
  display:grid;
  grid-template-columns:.75fr 1.25fr;
  gap:30px;
  align-items:center;
}

.flavor h2{
  font-size:42px;
  margin:4px 0;
}

.flavor p{
  color:#cbbcb5;
}

.chips{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.chip{
  min-height:115px;
  border-radius:20px;
  padding:18px;
  display:flex;
  flex-direction:column;
  justify-content:end;
  font-weight:900;
  background-size:cover;
  background-position:center;
  position:relative;
  overflow:hidden;
}

.chip:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(transparent,rgba(0,0,0,.7));
}

.chip span{
  position:relative;
  z-index:1;
}

/* GALLERY */

.gallery{
  display:grid;
  grid-template-columns:1.1fr .9fr .9fr;
  grid-auto-rows:210px;
  gap:14px;
}

.gallery figure{
  margin:0;
  border-radius:22px;
  overflow:hidden;
  position:relative;
}

.gallery figure:first-child{
  grid-row:span 2;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.3s;
}

.gallery figure:hover img{
  transform:scale(1.04);
}

/* ABOUT */

.about{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:center;
}

.about img{
  width:100%;
  height:430px;
  object-fit:cover;
  border-radius:30px;
}

.checks{
  display:grid;
  gap:14px;
  margin-top:22px;
}

.check{
  display:flex;
  gap:12px;
  align-items:flex-start;
  background:#fff;
  padding:14px;
  border:1px solid var(--line);
  border-radius:17px;
}

.check b{
  display:block;
}

.check small{
  color:var(--muted);
}

/* CONTACT */

.contact{
  background:#fff;
  border:1px solid var(--line);
  border-radius:30px;
  padding:35px;
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:40px;
}

.contact-items{
  display:grid;
  gap:12px;
}

.contact-item{
  padding:15px;
  border-radius:16px;
  background:#fffaf5;
  border:1px solid var(--line);
}

form{
  display:grid;
  gap:12px;
}

input,
textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fffaf5;
  border-radius:14px;
  padding:13px 15px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:var(--accent);
}

textarea{
  min-height:125px;
  resize:vertical;
}

/* FOOTER */

footer{
  margin-top:70px;
  background:#241b18;
  color:#fff;
  padding:45px 0;
}

.footer-grid{
  display:flex;
  justify-content:space-between;
  gap:30px;
  flex-wrap:wrap;
}

.footer-muted{
  color:#b9aaa3;
  font-size:13px;
}

.socials{
  display:flex;
  gap:8px;
}

.socials a{
  width:42px;
  height:42px;
  border:1px solid #ffffff22;
  border-radius:13px;
  display:grid;
  place-items:center;
}

/* CART */

.drawer{
  position:fixed;
  inset:0;
  z-index:100;
  pointer-events:none;
}

.drawer-bg{
  position:absolute;
  inset:0
