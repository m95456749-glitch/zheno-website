<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#651fff">
<meta name="description" content="ژینو؛ تجربه‌ای متفاوت از ژله‌های میوه‌ای و کاسترهای خوش‌طعم.">
<meta name="author" content="Zheno">

<title>ژینو | طعم متفاوت، تجربه متفاوت</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#651fff;
  --primary2:#8b5cf6;
  --pink:#ec4899;
  --dark:#18121f;
  --text:#292331;
  --muted:#77717f;
  --bg:#faf8ff;
  --white:#fff;
  --line:#ece7f3;
  --green:#16a34a;
  --danger:#dc2626;
  --shadow:0 15px 45px rgba(40,20,70,.10);
  --shadow2:0 25px 70px rgba(40,20,70,.16);
  --radius:24px;
  --container:1180px;
  --transition:220ms ease;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Vazirmatn",Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.8;
  overflow-x:hidden;
}

body.lock{
  overflow:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  display:block;
  max-width:100%;
}

:focus-visible{
  outline:3px solid var(--pink);
  outline-offset:3px;
}

.container{
  width:min(var(--container),calc(100% - 36px));
  margin:auto;
}

section{
  scroll-margin-top:90px;
}

.section{
  padding:95px 0;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--pink);
  font-size:14px;
  font-weight:900;
  margin-bottom:10px;
}

.section-title{
  font-size:clamp(32px,5vw,56px);
  line-height:1.25;
  font-weight:900;
  letter-spacing:-1.5px;
}

.section-description{
  color:var(--muted);
  max-width:700px;
  margin:14px auto 0;
  font-size:16px;
}

.section-head{
  text-align:center;
  margin-bottom:48px;
}

/* TOP BAR */

.topbar{
  background:var(--dark);
  color:white;
  font-size:12px;
}

.topbar-inner{
  min-height:36px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.topbar strong{
  color:#f9a8d4;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(250,248,255,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(236,231,243,.8);
}

.nav{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.logo{
  font-size:31px;
  font-weight:900;
  color:var(--primary);
}

.logo span{
  color:var(--pink);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:26px;
}

.nav-links a{
  color:#595160;
  font-size:14px;
  font-weight:700;
  transition:var(--transition);
}

.nav-links a:hover{
  color:var(--primary);
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
  border-radius:14px;
  box-shadow:0 5px 20px rgba(40,20,70,.07);
  transition:var(--transition);
}

.icon-btn:hover{
  transform:translateY(-2px);
  background:#f4edff;
}

.cart-btn{
  position:relative;
  height:46px;
  min-width:110px;
  padding:0 16px;
  border-radius:15px;
  background:var(--dark);
  color:white;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.cart-count{
  position:absolute;
  top:-8px;
  right:-7px;
  min-width:23px;
  height:23px;
  border-radius:50%;
  background:var(--pink);
  color:white;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid var(--bg);
}

.menu-btn{
  display:none;
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  padding:72px 0 95px;
  background:
    radial-gradient(circle at 5% 20%,rgba(236,72,153,.16),transparent 28%),
    radial-gradient(circle at 90% 5%,rgba(101,31,255,.18),transparent 32%),
    linear-gradient(135deg,#fff,#faf4ff);
}

.hero-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:70px;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:9px 15px;
  border-radius:999px;
  background:white;
  color:var(--primary);
  box-shadow:0 7px 25px rgba(40,20,70,.07);
  font-size:13px;
  font-weight:800;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(45px,7vw,78px);
  line-height:1.12;
  font-weight:900;
  letter-spacing:-3px;
  margin-bottom:15px;
}

.hero h1 span{
  color:var(--primary);
}

.hero-subtitle{
  font-size:clamp(19px,2vw,25px);
  color:var(--pink);
  font-weight:900;
  margin-bottom:15px;
}

.hero-text{
  color:var(--muted);
  font-size:16px;
  max-width:610px;
  margin-bottom:28px;
}

.hero-buttons{
  display:flex;
  gap:11px;
  flex-wrap:wrap;
}

.btn{
  min-height:51px;
  padding:0 22px;
  border-radius:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:800;
  font-size:14px;
  transition:var(--transition);
}

.btn:hover{
  transform:translateY(-3px);
}

.btn-primary{
  color:white;
  background:var(--primary);
  box-shadow:0 12px 30px rgba(101,31,255,.25);
}

.btn-primary:hover{
  background:#5216dc;
}

.btn-light{
  background:white;
  color:var(--dark);
  box-shadow:0 8px 25px rgba(40,20,70,.08);
}

.btn-dark{
  background:var(--dark);
  color:white;
}

.hero-trust{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:28px;
}

.trust{
  padding:7px 12px;
  background:white;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  color:#68616f;
}

.hero-visual{
  position:relative;
}

.hero-image{
  position:relative;
  aspect-ratio:1/.98;
  overflow:hidden;
  border-radius:42px;
  transform:rotate(1deg);
  box-shadow:var(--shadow2);
}

.hero-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero-image:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(20,10,30,.5),transparent 55%);
}

.float-card{
  position:absolute;
  z-index:3;
  background:rgba(255,255,255,.95);
  padding:15px 18px;
  border-radius:20px;
  box-shadow:var(--shadow);
}

.float-top{
  top:24px;
  right:-20px;
}

.float-bottom{
  left:-25px;
  bottom:25px;
}

.float-number{
  color:var(--primary);
  font-size:25px;
  font-weight:900;
}

.float-label{
  color:var(--muted);
  font-size:11px;
}

/* FEATURES */

.features-wrap{
  margin-top:-36px;
  position:relative;
  z-index:5;
}

.features{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:white;
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.feature{
  display:flex;
  gap:12px;
  align-items:center;
  padding:22px 18px;
  border-left:1px solid var(--line);
}

.feature:last-child{
  border-left:0;
}

.feature-icon{
  width:46px;
  height:46px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4edff;
  border-radius:14px;
  font-size:21px;
}

.feature strong{
  display:block;
  font-size:13px;
}

.feature small{
  color:var(--muted);
  font-size:11px;
}

/* PRODUCTS */

.products{
  background:white;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:30px;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.filter{
  min-height:42px;
  padding:0 16px;
  border-radius:999px;
  background:#f6f2fa;
  color:#68616f;
  font-size:12px;
  font-weight:800;
  transition:var(--transition);
}

.filter.active,
.filter:hover{
  background:var(--primary);
  color:white;
}

.search-sort{
  display:flex;
  gap:8px;
}

.search{
  position:relative;
  width:240px;
}

.search input{
  width:100%;
  height:44px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#faf9fc;
  padding:0 42px 0 13px;
  outline:none;
}

.search span{
  position:absolute;
  right:13px;
  top:50%;
  transform:translateY(-50%);
  color:#8d8593;
}

.sort{
  height:44px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#faf9fc;
  padding:0 10px;
  color:#5e5765;
  outline:none;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.product{
  position:relative;
  overflow:hidden;
  background:white;
  border:1px solid var(--line);
  border-radius:25px;
  transition:var(--transition);
}

.product:hover{
  transform:translateY(-6px);
  box-shadow:var(--shadow);
  border-color:#ded1f0;
}

.product-image{
  position:relative;
  aspect-ratio:1/.85;
  overflow:hidden;
  background:#f3eef8;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:500ms ease;
}

.product:hover .product-image img{
  transform:scale(1.07);
}

.badge{
  position:absolute;
  right:13px;
  top:13px;
  padding:5px 9px;
  background:white;
  border-radius:999px;
  color:var(--primary);
  font-size:10px;
  font-weight:900;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.favorite{
  position:absolute;
  left:12px;
  top:12px;
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  transition:var(--transition);
}

.favorite.active{
  color:var(--pink);
  background:#fff0f7;
}

.product-info{
  padding:18px;
}

.category{
  color:var(--pink);
  font-size:10px;
  font-weight:900;
}

.product h3{
  font-size:19px;
  font-weight:900;
  margin:3px 0;
}

.product p{
  color:var(--muted);
  font-size:12px;
  min-height:46px;
  margin-bottom:13px;
}

.product-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.price{
  font-size:17px;
  font-weight:900;
}

.price small{
  color:var(--muted);
  font-size:10px;
  font-weight:500;
}

.product-actions{
  display:flex;
  gap:7px;
}

.details-btn{
  height:43px;
  padding:0 12px;
  border-radius:13px;
  background:#f5f1fa;
  color:#544c5d;
  font-size:11px;
  font-weight:800;
}

.add{
  width:43px;
  height:43px;
  border-radius:13px;
  background:var(--dark);
  color:white;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.add:hover{
  background:var(--primary);
}

.no-results{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}

/* FLAVORS */

.flavors{
  background:
    radial-gradient(circle at 10% 20%,rgba(236,72,153,.12),transparent 28%),
    #faf8ff;
}

.flavor-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.flavor-card{
  position:relative;
  min-height:265px;
  overflow:hidden;
  border-radius:25px;
  cursor:pointer;
  box-shadow:var(--shadow);
}

.flavor-card.big{
  grid-column:span 2;
  min-height:325px;
}

.flavor-card img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:600ms ease;
}

.flavor-card:hover img{
  transform:scale(1.08);
}

.flavor-card:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(15,8,20,.76),transparent 55%);
}

.flavor-content{
  position:absolute;
  z-index:2;
  right:20px;
  left:20px;
  bottom:18px;
  color:white;
}

.flavor-content h3{
  font-size:24px;
  font-weight:900;
}

.flavor-content p{
  font-size:12px;
  opacity:.9;
}

/* STORY */

.story{
  background:white;
}

.story-grid{
  display:grid;
  grid-template-columns:.95fr 1.05fr;
  gap:65px;
  align-items:center;
}

.story-img{
  position:relative;
  border-radius:36px;
  overflow:hidden;
  box-shadow:var(--shadow2);
}

.story-img img{
  width:100%;
  aspect-ratio:1/.9;
  object-fit:cover;
}

.story-tag{
  position:absolute;
  right:18px;
  bottom:18px;
  background:white;
  padding:12px 16px;
  border-radius:16px;
  box-shadow:var(--shadow);
  font-size:13px;
  font-weight:900;
}

.story-text h2{
  font-size:clamp(34px,5vw,53px);
  line-height:1.25;
  font-weight:900;
  margin-bottom:15px;
}

.story-text>p{
  color:var(--muted);
  font-size:15px;
  margin-bottom:23px;
}

.points{
  display:grid;
  gap:12px;
}

.point{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.check{
  width:29px;
  height:29px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f0eaff;
  color:var(--primary);
  border-radius:50%;
  font-weight:900;
}

/* QUALITY */

.quality-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.quality-card{
  padding:28px;
  border:1px solid var(--line);
  border-radius:24px;
  background:white;
  box-shadow:0 5px 25px rgba(40,20,70,.05);
}

.quality-icon{
  font-size:30px;
  margin-bottom:14px;
}

.quality-card h3{
  font-size:19px;
  margin-bottom:7px;
}

.quality-card p{
  color:var(--muted);
  font-size:13px;
}

/* GALLERY */

.gallery{
  background:white;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:190px;
  gap:14px;
}

.gallery-item{
  overflow:hidden;
  border-radius:20px;
  cursor:pointer;
  position:relative;
}

.gallery-item.big{
  grid-column:span 2;
  grid-row:span 2;
}

.gallery-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:500ms ease;
}

.gallery-item:hover img{
  transform:scale(1.07);
}

.gallery-item:after{
  content:"🔍";
  position:absolute;
  left:12px;
  top:12px;
  background:rgba(255,255,255,.9);
  width:35px;
  height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  opacity:0;
  transition:var(--transition);
}

.gallery-item:hover:after{
  opacity:1;
}

/* TESTIMONIALS */

.testimonials{
  background:#faf8ff;
}

.testimonial-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.testimonial{
  background:white;
  border:1px solid var(--line);
  border-radius:23px;
  padding:24px;
}

.stars{
  color:#f59e0b;
  margin-bottom:10px;
}

.testimonial p{
  color:#5f5866;
  font-size:13px;
  margin-bottom:16px;
}

.testimonial strong{
  font-size:13px;
}

/* FAQ */

.faq{
  background:white;
}

.faq-list{
  max-width:850px;
  margin:auto;
  display:grid;
  gap:10px;
}

.faq-item{
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
}

.faq-question{
  width:100%;
  padding:17px 18px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:right;
  font-weight:800;
  color:var(--text);
}

.faq-question span{
  font-size:20px;
  transition:var(--transition);
}

.faq-item.open .faq-question span{
  transform:rotate(45deg);
}

.faq-answer{
  max-height:0;
  overflow:hidden;
  transition:max-height 300ms ease;
}

.faq-answer p{
  padding:0 18px 18px;
  color:var(--muted);
  font-size:13px;
}

/* CONTACT */

.contact{
  background:
    radial-gradient(circle at 90% 10%,rgba(101,31,255,.15),transparent 30%),
    #faf8ff;
}

.contact-grid{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:25px;
}

.contact-info,
.contact-form{
  background:white;
  border:1px solid var(--line);
  border-radius:25px;
  padding:28px;
}

.contact-info h2{
  font-size:30px;
  font-weight:900;
  margin-bottom:10px;
}

.contact-info>p{
  color:var(--muted);
  font-size:13px;
  margin-bottom:25px;
}

.contact-links{
  display:grid;
  gap:10px;
}

.contact-link{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  background:#faf8fc;
  border-radius:14px;
}

.contact-link-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#f0eaff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.field{
  display:grid;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:12px;
  font-weight:800;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px 13px;
  outline:none;
  background:#faf9fc;
}

.field input{
  height:45px;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--primary);
  background:white;
}

.form-submit{
  margin-top:13px;
}

/* NEWSLETTER */

.newsletter{
  background:var(--dark);
  color:white;
}

.newsletter-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.newsletter h2{
  font-size:30px;
  font-weight:900;
}

.newsletter p{
  color:#bdb4c5;
  font-size:13px;
}

.newsletter-form{
  display:flex;
  gap:8px;
  width:min(470px,100%);
}

.newsletter-form input{
  flex:1;
  min-width:0;
  height:49px;
  border:0;
  border-radius:14px;
  padding:0 15px;
  outline:none;
}

/* FOOTER */

footer{
  background:#100c15;
  color:white;
  padding:55px 0 25px;
}

.footer-grid{
  display:grid;
  grid-template-columns:1.2fr .8fr .8fr;
  gap:35px;
  padding-bottom:35px;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.footer-logo{
  font-size:32px;
  font-weight:900;
  color:#a78bfa;
  margin-bottom:10px;
}

.footer-brand p{
  color:#aaa0b2;
  font-size:12px;
  max-width:400px;
}

.footer-col h3{
  font-size:14px;
  margin-bottom:12px;
}

.footer-col a{
  display:block;
  color:#aaa0b2;
  font-size:12px;
  margin-bottom:7px;
}

.footer-col a:hover{
  color:white;
}

.footer-bottom{
  padding-top:20px;
  display:flex;
  justify-content:space-between;
  gap:15px;
  color:#817687;
  font-size:11px;
}

/* CART DRAWER */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(10,5,15,.5);
  z-index:1500;
  opacity:0;
  visibility:hidden;
  transition:var(--transition);
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

.cart-drawer{
  position:fixed;
  z-index:1600;
  top:0;
  left:0;
  width:min(430px,100%);
  height:100%;
  background:white;
  transform:translateX(-105%);
  transition:350ms ease;
  display:flex;
  flex-direction:column;
  box-shadow:20px 0 70px rgba(0,0,0,.18);
}

.cart-drawer.open{
  transform:translateX(0);
}

.cart-head{
  padding:20px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cart-head h2{
  font-size:21px;
}

.close{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#f5f1f8;
}

.cart-items{
  flex:1;
  overflow:auto;
  padding:16px;
}

.empty-cart{
  text-align:center;
  color:var(--muted);
  padding:70px 20px;
}

.cart-item{
  display:flex;
  gap:11px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.cart-item img{
  width:72px;
  height:72px;
  border-radius:14px;
  object-fit:cover;
}

.cart-item-info{
  flex:1;
}

.cart-item-info h4{
  font-size:13px;
  margin-bottom:3px;
}

.cart-item-price{
  font-size:12px;
  color:var(--primary);
  font-weight:900;
}

.quantity{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:7px;
}

.quantity button{
  width:26px;
  height:26px;
  border-radius:8px;
  background:#f3eff7;
}

.remove-item{
  color:var(--danger);
  background:none;
  font-size:11px;
  margin-top:4px;
}

.cart-footer{
  padding:18px;
  border-top:1px solid var(--line);
}

.total-row{
  display:flex;
  justify-content:space-between;
  font-weight:900;
  margin-bottom:12px;
}

.full-btn{
  width:100%;
}

/* MODAL */

.modal{
  position:fixed;
  z-index:1700;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(10,5,15,.6);
  opacity:0;
  visibility:hidden;
  transition:var(--transition);
}

.modal.show{
  opacity:1;
  visibility:visible;
}

.modal-box{
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:28px;
  box-shadow:var(--shadow2);
  transform:translateY(20px) scale(.97);
  transition:var(--transition);
}

.modal.show .modal-box{
  transform:none;
}

.modal-close{
  position:absolute;
  top:15px;
  left:15px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:white;
  z-index:2;
}
