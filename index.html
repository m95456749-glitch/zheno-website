<!doctype html>
<html lang="fa" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ژینو — پودر ژله و پودر کاستر با کیفیت واقعی؛ ۱۵ طعم اصیل در بسته‌بندی ۲۵۰ گرمی" />
    <meta name="theme-color" content="#2A0B12" />
    <meta property="og:title" content="ژینو | Zheno — طعمِ اصیل، انتخابِ متفاوت" />
    <meta property="og:description" content="یک تجربه متفاوت از دنیای ژله و کاستر؛ ۱۵ طعم اصیل در بسته‌بندی ۲۵۰ گرمی." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AE%3C/text%3E%3C/svg%3E" />
    <title>ژینو | Zheno - کیفیت واقعی، انتخاب ژینو</title>
    <!-- Google Fonts: Vazirmatn (Persian UI/body) + Marcellus (latin display accents) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Marcellus&display=swap" rel="stylesheet">
  </head>
  <body class="bg-cream-50 text-espresso font-vazirmatn antialiased overflow-x-hidden selection:bg-wine-800 selection:text-cream-50">
    <div id="root"></div>
    <!-- Boot watchdog (plain ES5, no dependencies): if the app bundle
         never mounts #root — e.g. this browser cannot parse it, or a
         stale/corrupted copy of this page is cached — show a recovery
         card with a reload button instead of a blank white page. When
         the app boots normally this does nothing (root already has
         children before the timer fires). -->
    <script>
      (function () {
        setTimeout(function () {
          var root = document.getElementById("root");
          if (!root || root.hasChildNodes()) return;
          var wrap = document.createElement("div");
          wrap.setAttribute(
            "style",
            "min-height:100vh;display:flex;align-items:center;justify-content:center;" +
              "background:#1d070c;color:#faf7f2;text-align:center;padding:24px;box-sizing:border-box;" +
              "font-family:Vazirmatn,system-ui,-apple-system,'Segoe UI',sans-serif"
          );
          var card = document.createElement("div");
          card.setAttribute("style", "max-width:34rem;line-height:2");
          var h = document.createElement("h1");
          h.setAttribute("style", "font-size:1.4rem;font-weight:600;margin:0 0 .5rem");
          h.textContent = "صفحه بارگیری نشد";
          var p = document.createElement("p");
          p.setAttribute("style", "margin:0 0 1rem;color:#e9ded6");
          p.textContent =
            "به‌نظر می‌رسد اپلیکیشن راه‌اندازی نشد (مرورگر قدیمی یا نسخهٔ قدیمی/نقص‌دار ذخیره‌شدهٔ این صفحه). لطفاً صفحه را یک‌بار بازنشانی کنید.";
          var b = document.createElement("button");
          b.setAttribute(
            "style",
            "background:#faf7f2;color:#2a0b12;border:0;border-radius:999px;padding:.7rem 2rem;" +
              "font:inherit;font-weight:600;cursor:pointer"
          );
          b.textContent = "بازنشانی صفحه";
          b.onclick = function () { location.reload(); };
          var e = document.createElement("p");
          e.setAttribute("style", "margin:1rem 0 0;font-size:.75rem;color:#c9b8ae;direction:ltr");
          e.textContent = "The app failed to boot — reload (Ctrl/Cmd+Shift+R clears a stale cached copy).";
          card.appendChild(h);
          card.appendChild(p);
          card.appendChild(b);
          card.appendChild(e);
          wrap.appendChild(card);
          document.body.appendChild(wrap);
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
