<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zheno Assistant — Static Robot</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      background: #F2E4D0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    img.robot {
      height: 96vh;
      max-width: 96vw;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <img class="robot" src="./robot.svg" alt="ربات دستیار ژینو" />
</body>
</html>
