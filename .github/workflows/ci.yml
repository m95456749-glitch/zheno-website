# ZHINO — lightweight, read-only CI for pull requests.
#
# Everything in this workflow is safe by construction:
#   - no database connection is ever opened
#   - no secrets are read or required
#   - nothing is deployed and nothing is written anywhere
#
# It runs the same checks a developer runs locally:
#   typecheck, production build, catalog data consistency, runtime smoke
#   tests, and offline validation of the supabase/ directory (file
#   presence, migration naming/ordering, read-only verify.sql, and a
#   committed-secret scan).
#
# Production migrations remain MANUAL ONLY via the separate
# "Supabase migrate (manual)" workflow (workflow_dispatch).

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Supabase structure (offline — no DB connection)
        run: npm run verify:supabase

      - name: Verify catalog data consistency
        run: npm run verify:data

      - name: Build (production)
        run: npm run build

      - name: Runtime smoke tests
        run: npm run smoke

      # Live synthetic check of the deployed cloud voice. Read-only for our
      # infrastructure (one GET + one POST to the public endpoint, exactly the
      # two calls the storefront makes) and it NEVER blocks the build: the
      # result is reported as an annotation so it is visible on the run page.
      - name: Live voice probe — GET health + real POST synthesis (non-blocking)
        env:
          VOICE_BASE: ${{ vars.VITE_SUPABASE_URL }}
          VOICE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -uo pipefail
          base="${VOICE_BASE:-https://kijhqsyftzufydonggeb.supabase.co}"; base="${base%/}"
          url="${base}/functions/v1/zhino-voice"
          key="${VOICE_KEY:-}"
          auth=()
          if [ -n "$key" ]; then auth=(-H "Authorization: Bearer ${key}" -H "apikey: ${key}"); fi

          echo "===== GET ${url} ====="
          gcode=$(curl -sS -m 30 -o /tmp/voice-get.json -w '%{http_code}' "${auth[@]}" "$url" 2>/dev/null) || gcode="000"
          echo "HTTP ${gcode}"; head -c 400 /tmp/voice-get.json 2>/dev/null; echo

          echo
          echo "===== POST ${url} ====="
          pcode=$(curl -sS -m 60 -D /tmp/voice.hdr -o /tmp/voice.bin -w '%{http_code}' \
                  -X POST -H 'Content-Type: application/json' "${auth[@]}" \
                  --data '{"text":"سلام، صدای ژینو"}' "$url" 2>/dev/null) || pcode="000"
          ctype=$(sed -e 's/\r$//' /tmp/voice.hdr 2>/dev/null | awk 'tolower($1)=="content-type:"{print $2}' | head -1)
          size=$(wc -c < /tmp/voice.bin 2>/dev/null | tr -d ' ') || size=0
          echo "HTTP ${pcode} | content-type=${ctype:-n/a} | bytes=${size:-0}"
          echo "--- response headers (the function never returns a key) ---"
          sed -e 's/\r$//' /tmp/voice.hdr 2>/dev/null | head -12
          case "${ctype:-}" in
            audio/*) echo "--- first bytes ---"; head -c 4 /tmp/voice.bin | od -An -tx1 | head -1 ;;
            *) echo "--- body (first 400 bytes) ---"; head -c 400 /tmp/voice.bin 2>/dev/null; echo ;;
          esac

          if [ "$pcode" = "200" ] && [ "${ctype:-audio/none}" = "audio/mpeg" ] && [ "${size:-0}" -gt 1000 ]; then
            echo "::notice::LIVE VOICE OK — POST returned HTTP 200 ${ctype} with ${size} bytes of MP3."
          else
            echo "::error::LIVE VOICE NOT OK — GET=${gcode}, POST=${pcode}, content-type=${ctype:-n/a}, bytes=${size:-0}."
          fi
          # Diagnostic only: a voice outage must not fail unrelated pull requests.
          exit 0
