name: Supabase deploy functions (manual)

# Manual-only workflow. Deploys the two Edge Functions in supabase/functions/
# (zhino-voice = cloud Persian voice, zhino-assistant = chat AI) to the real
# Supabase project, sets their Supabase secrets only when the corresponding
# GitHub secrets are present, and finishes with a live HTTP health check of
# both endpoints.
#
# This is the missing step of the "voice not working" issue: the function
# code has been committed to the repository, but it was never deployed.
# Nothing else in this repo auto-deploys Edge Functions (deploy.yml only
# ships the static site), so this workflow is the deploy path.
#
# Security contract (same rules as supabase-migrate.yml):
#   * No secret value is ever printed. The token and every secret are
#     reported only by class / length / sha256[1:12] fingerprint, and each
#     is registered with ::add-mask:: so an accidental echo cannot leak it.
#   * permissions: contents: read ONLY — no pages:write, no id-token,
#     nothing else. The only credentials in scope are repository secrets.
#   * Manual only (workflow_dispatch): a pull request can never trigger a
#     deploy, and nothing auto-runs on push.
#   * No database access of any kind: only the Supabase Functions and
#     Management APIs are called. No migration is ever applied.
#   * Deploys are idempotent: re-running the workflow just updates the
#     functions; it never duplicates or deletes anything.
#
# REQUIRED repository secret (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN — a Supabase PERSONAL ACCESS TOKEN (starts with
#   sbp_) created at https://supabase.com/dashboard/account/tokens, from the
#   SAME account that owns the project. Project API keys (sb_publishable_…
#   or sb_secret_…) do NOT work — the CLI cannot use data-plane keys.
#
# OPTIONAL repository secrets (each is conditional — set only what you have):
#   TTS_API_KEY (+ TTS_API_URL, TTS_MODEL, TTS_VOICE_FEMALE, TTS_VOICE_MALE)
#       — enables the cloud voice through OpenAI «gpt-4o-mini-tts»
#         (zhino-voice answers 200 with audio). One key is enough; it is
#         the only credential the voice function needs on this path.
#   AZURE_SPEECH_KEY + AZURE_SPEECH_REGION (+ AZURE_SPEECH_VOICE)
#       — the alternate cloud voice provider (Azure AI Speech). Kept
#         available: with both keys set, auto mode prefers OpenAI, so
#         setting VOICE_PROVIDER (see VARIABLES) picks the provider.
#   AI_API_KEY + AI_MODEL (+ AI_API_URL)
#       — enables the chat AI (zhino-assistant answers with model replies)
#
# Repository VARIABLES used (public by design, exactly like deploy.yml):
#   VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY — for the final health
#   check. The publishable key already ships in the website bundle, so using
#   it here adds no new exposure. If unset, the check falls back to an
#   unauthenticated probe where "anything but 404" still proves the function
#   exists.
#   VOICE_PROVIDER — optional, not a secret: `openai` or `azure`. When it is
#   left unset the voice function picks automatically (OpenAI if TTS_API_KEY
#   exists, otherwise Azure).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: kijhqsyftzufydonggeb

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — token present, normalised and classified
        id: guard
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_TOKEN:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions). It must be a Supabase personal access token (sbp_…) from https://supabase.com/dashboard/account/tokens — NOT a project API key."
            exit 1
          fi
          # A token pasted into a GitHub secret very often carries a trailing
          # newline, surrounding spaces/quotes or a "Bearer " prefix. Any of
          # those makes the Management API answer 401. Strip them
          # automatically, and note it without printing the value.
          tok=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n\t' \
                | sed -e "s/^[[:space:]\"']*//" -e "s/[[:space:]\"']*$//" \
                      -e "s/^[Bb][Ee][Aa][Rr][Ee][[:space:]]*//" \
                      -e "s/^[[:space:]\"']*//" -e "s/[[:space:]\"']*$//")
          if [ "$tok" != "$RAW_TOKEN" ]; then
            echo "note: SUPABASE_ACCESS_TOKEN contained stray whitespace/quotes/'Bearer ' — trimmed automatically."
          fi
          echo "::add-mask::$tok"

          case "$tok" in
            sbp_fc*)   cls="scoped (fine-grained) personal access token, sbp_fc…" ;;
            sbp_*)     cls="classic personal access token, sbp_…" ;;
            sb_secret_*)
              cls="PROJECT SECRET API KEY, sb_secret_… (data key — the CLI cannot use it)"
              echo "::error::SUPABASE_ACCESS_TOKEN holds a project SECRET API key. Create a personal access token at https://supabase.com/dashboard/account/tokens and store THAT value as the secret instead."
              exit 1 ;;
            sb_publishable_*)
              cls="PROJECT PUBLISHABLE API KEY, sb_publishable_… (data key — the CLI cannot use it)"
              echo "::error::SUPABASE_ACCESS_TOKEN holds the project PUBLISHABLE key. Create a personal access token at https://supabase.com/dashboard/account/tokens and store THAT value as the secret instead."
              exit 1 ;;
            eyJ*)
              cls="legacy JWT, eyJ… (data key — the CLI cannot use it)"
              echo "::error::SUPABASE_ACCESS_TOKEN looks like an old JWT key. Create a personal access token at https://supabase.com/dashboard/account/tokens and store THAT value as the secret instead."
              exit 1 ;;
            *)
              cls="unrecognised format (a Supabase access token starts with sbp_)"
              echo "::error::SUPABASE_ACCESS_TOKEN does not look like a Supabase access token (expected an sbp_… value)."
              exit 1 ;;
          esac

          fp=$(printf '%s' "$tok" | sha256sum | cut -c1-12)
          echo "token class        : $cls"
          echo "token length       : ${#tok}"
          echo "token sha256[1:12] : $fp (the value itself is never printed)"
          echo "SUPABASE_ACCESS_TOKEN=$tok" >> "$GITHUB_ENV"
          echo "token_fp=$fp" >> "$GITHUB_OUTPUT"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned on purpose (same version and same reason as
          # supabase-migrate.yml): 'latest' resolves the newest release
          # through the unauthenticated GitHub API and can die with
          # "Failed to resolve latest Supabase CLI release: rate limit
          # exceeded". Bump deliberately, never implicitly.
          version: 2.117.0

      - name: Record CLI version and ensure supabase/config.toml exists
        run: |
          set -euo pipefail
          echo "supabase CLI: $(supabase --version 2>&1 | head -1)"
          if [ ! -f supabase/config.toml ]; then
            supabase init --force
            echo "Created a default supabase/config.toml for the CLI inside the runner (no file in the repository was touched)."
          fi
          echo "function sources:"
          ls -l supabase/functions/zhino-voice/index.ts supabase/functions/zhino-assistant/index.ts

      - name: Pre-flight — does this token reach this project?
        id: preflight
        run: |
          set -uo pipefail
          ref="${PROJECT_REF:?the project ref is empty}"

          echo "== 1/2  Public probe: does the project hostname answer at all? =="
          rest=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://${ref}.supabase.co/rest/v1/" 2>/dev/null) || rest="000"
          echo "https://${ref}.supabase.co/rest/v1/ -> HTTP ${rest}"
          if [ "$rest" = "000" ]; then
            echo "::warning::That hostname did not answer at all — the ref is mistyped, or the project is paused. The deploy step below will fail with a clear error if that is real."
          else
            echo "The API gateway answered, so the ref itself is real."
          fi

          echo
          echo "== 2/2  Authenticated probe: can the token see this project? =="
          code=$(curl -s -o /tmp/preflight.json -m 30 -w '%{http_code}' \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                  -H "Accept: application/json" \
                  "https://api.supabase.com/v1/projects/${ref}" 2>/dev/null) || code="000"
          echo "GET api.supabase.com/v1/projects/${ref} -> HTTP ${code}"
          head -c 300 /tmp/preflight.json 2>/dev/null; echo

          case "$code" in
            200) echo "The token can see the project — ready to deploy." ;;
            401) echo "::error::The token was rejected (HTTP 401): expired, revoked, or copied incompletely. Create a new one at https://supabase.com/dashboard/account/tokens and update the secret. (stored value fingerprint sha256[1:12]=${token_fp})"
                 exit 1 ;;
            403) echo "::error::The token is valid but forbidden (HTTP 403): it was created by a different Supabase account/organization than the owner of project ${ref}, or it is a scoped token without the needed permission. In the SAME account that owns the project, create a CLASSIC personal access token (full permissions) at https://supabase.com/dashboard/account/tokens and store THAT value."
                 exit 1 ;;
            404) echo "::error::The token works but project ${ref} is not visible to it — the ref is wrong, or the token belongs to a different account."
                 exit 1 ;;
            000) echo "::warning::api.supabase.com could not be reached from the runner — usually a transient network issue. The deploy step will try anyway; if it fails, just re-run the workflow." ;;
            *)   echo "::error::Unexpected Management API response (HTTP ${code})."
                 exit 1 ;;
          esac

      - name: Deploy zhino-voice (cloud Persian voice)
        run: |
          set -euo pipefail
          supabase functions deploy zhino-voice --project-ref "$PROJECT_REF"

      - name: Deploy zhino-assistant (chat AI)
        run: |
          set -euo pipefail
          supabase functions deploy zhino-assistant --project-ref "$PROJECT_REF"

      - name: Confirm the deploy + open zhino-voice to the browser (verify_jwt=false)
        run: |
          set -uo pipefail
          ref="${PROJECT_REF:?the project ref is empty}"
          api="https://api.supabase.com/v1/projects/${ref}/functions"

          # 'supabase functions deploy' exiting 0 is not proof the function is
          # live: the site only works when the Management API lists the slug.
          # Read the authoritative list and fail loudly if it is missing.
          list_functions() {
            curl -sS -m 30 \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Accept: application/json" \
              "${api}" 2>/dev/null
          }

          echo "== functions in project ${ref} (Management API) =="
          raw=$(list_functions) || raw=""
          if [ -z "$raw" ]; then
            echo "::error::Could not read the function list from the Management API — the deploy cannot be confirmed."
            exit 1
          fi
          echo "$raw" | jq -r 'if type=="array" then (.[] | "\(.slug)\t\(.status)\tv\(.version)\tverify_jwt=\(.verify_jwt)") else "unexpected payload" end' 2>/dev/null \
            || head -c 400 <<<"$raw"

          if ! echo "$raw" | jq -e 'type=="array" and (map(.slug) | index("zhino-voice") != null)' >/dev/null 2>&1; then
            echo "::error::zhino-voice is NOT in the project's function list even though 'supabase functions deploy' exited 0 — this is exactly what the storefront shows as «صدا در دسترس نیست» (its request gets 404). Re-run this workflow once; if it persists, deploy by hand: supabase functions deploy zhino-voice --project-ref ${ref}"
            exit 1
          fi
          echo "ok: zhino-voice exists in the project."

          # The storefront is anonymous: src/services/assistant/voice.ts sends
          # the project's PUBLISHABLE key in Authorization + apikey, and the
          # platform's verify_jwt gate only accepts a real user JWT — an API
          # key is rejected with 401 BEFORE our code runs. So the gate is
          # turned off for this one public endpoint. The function keeps its own
          # guards (per-IP rate limit, 2000-char / 8KB caps, ALLOWED_ORIGINS,
          # admin master switch) and never touches private data.
          echo
          echo "== set verify_jwt=false on zhino-voice =="
          patch=$(curl -sS -m 30 -o /tmp/patch-voice.json -w '%{http_code}' -X PATCH \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d '{"verify_jwt": false}' \
                  "${api}/zhino-voice" 2>/dev/null) || patch="000"
          echo "PATCH .../functions/zhino-voice -> HTTP ${patch}"
          head -c 300 /tmp/patch-voice.json 2>/dev/null; echo
          if [ "$patch" != "200" ]; then
            echo "::error::Could not disable JWT verification on zhino-voice (HTTP ${patch}) — the browser would keep getting 401 from the platform."
            exit 1
          fi

          echo
          echo "== state after the change =="
          raw2=$(list_functions) || raw2=""
          echo "$raw2" | jq -r 'if type=="array" then (.[] | "\(.slug)\t\(.status)\tverify_jwt=\(.verify_jwt)") else "unexpected payload" end' 2>/dev/null || true
          if echo "$raw2" | jq -e '(map(select(.slug=="zhino-voice")) | .[0] | .verify_jwt == false)' >/dev/null 2>&1; then
            echo "ok: zhino-voice is deployed and callable without a user JWT."
          else
            echo "::warning::verify_jwt is not reported as false for zhino-voice — the browser may still be answered 401."
          fi

      - name: Set Supabase secrets — only the names that were provided
        env:
          # ONLY these names are wired into this step — nothing else.
          # An undefined repository secret/variable evaluates to an empty
          # string, which the conditionals below treat as "not provided".
          VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_API_URL: ${{ secrets.TTS_API_URL }}
          TTS_MODEL: ${{ secrets.TTS_MODEL }}
          TTS_VOICE_FEMALE: ${{ secrets.TTS_VOICE_FEMALE }}
          TTS_VOICE_MALE: ${{ secrets.TTS_VOICE_MALE }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_VOICE: ${{ secrets.AZURE_SPEECH_VOICE }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
        run: |
          set -euo pipefail
          # The values live in GitHub secrets and travel only inside this
          # command invocation; they are never echoed (and ::add-mask:: in
          # the guard step covers accidental repetition of the token).
          echo "::add-mask::${TTS_API_KEY:-}"
          echo "::add-mask::${AZURE_SPEECH_KEY:-}"
          echo "::add-mask::${AI_API_KEY:-}"

          set_pair() {  # $1=label $2=name $3=value  — sets NAME only if value non-empty
            if [ -n "$3" ]; then
              supabase secrets set "$2=$3" --project-ref "$PROJECT_REF"
              echo "set ${2} on the Supabase project (value never printed)"
            fi
          }

          if [ -n "${TTS_API_KEY:-}" ]; then
            set_pair openai-tts TTS_API_KEY "${TTS_API_KEY}"
            set_pair openai-tts TTS_API_URL "${TTS_API_URL:-}"
            set_pair openai-tts TTS_MODEL "${TTS_MODEL:-}"
            set_pair openai-tts TTS_VOICE_FEMALE "${TTS_VOICE_FEMALE:-}"
            set_pair openai-tts TTS_VOICE_MALE "${TTS_VOICE_MALE:-}"
          fi

          # Not a secret — just which provider serves the voice. Empty means
          # "auto" (OpenAI when TTS_API_KEY exists, otherwise Azure).
          if [ -n "${VOICE_PROVIDER:-}" ]; then
            case "${VOICE_PROVIDER}" in
              openai|azure) set_pair voice-provider VOICE_PROVIDER "${VOICE_PROVIDER}" ;;
              *)
                echo "::error::VOICE_PROVIDER must be either 'openai' or 'azure' (got: ${VOICE_PROVIDER}). Leaving it unset so the function keeps choosing automatically."
                ;;
            esac
          fi

          if [ -n "${AZURE_SPEECH_KEY:-}" ]; then
            if [ -z "${AZURE_SPEECH_REGION:-}" ]; then
              echo "::warning::AZURE_SPEECH_KEY is set but AZURE_SPEECH_REGION is not — the voice function needs the region (or an AZURE_SPEECH_ENDPOINT) to reach Azure."
            fi
            set_pair azure-speech AZURE_SPEECH_KEY "${AZURE_SPEECH_KEY}"
            set_pair azure-speech AZURE_SPEECH_REGION "${AZURE_SPEECH_REGION:-}"
            set_pair azure-speech AZURE_SPEECH_VOICE "${AZURE_SPEECH_VOICE:-}"
          fi

          if [ -n "${AI_API_KEY:-}" ]; then
            if [ -z "${AI_MODEL:-}" ]; then
              echo "::warning::AI_API_KEY is set but AI_MODEL is not — the assistant function needs the model name."
            fi
            set_pair ai-model AI_API_KEY "${AI_API_KEY}"
            set_pair ai-model AI_MODEL "${AI_MODEL:-}"
            set_pair ai-model AI_API_URL "${AI_API_URL:-}"
          fi

          if [ -z "${TTS_API_KEY:-}" ] && [ -z "${AZURE_SPEECH_KEY:-}" ] && [ -z "${AI_API_KEY:-}" ]; then
            echo "::notice::No TTS/Azure/AI secrets were provided as GitHub secrets — both functions are deployed, but cloud voice answers 501 (not_configured) and the chat AI stays off. Add TTS_API_KEY (OpenAI gpt-4o-mini-tts) and/or AZURE_SPEECH_KEY + AZURE_SPEECH_REGION and/or AI_API_KEY + AI_MODEL under Settings > Secrets and variables > Actions, then re-run this workflow (re-running is safe: deploys are idempotent)."
          fi

      - name: Verify — live HTTP health check of both deployed functions
        env:
          PROJECT_URL: ${{ vars.VITE_SUPABASE_URL }}
          PUBLIC_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -uo pipefail
          # The project URL can always be derived from the ref; the public
          # key comes from the repository variables (it already ships in the
          # website bundle, so using it here adds no new exposure).
          base="${PROJECT_URL:-https://${PROJECT_REF}.supabase.co}"; base="${base%/}"
          key="${PUBLIC_KEY:-}"
          # A mismatch here means the site talks to a DIFFERENT project than the
          # one this workflow deploys to — the function would exist and the
          # storefront would still get 404.
          canonical="https://${PROJECT_REF}.supabase.co"
          echo "health base : ${base}"
          echo "deployed to : ${canonical}"
          if [ "$base" != "$canonical" ]; then
            echo "::warning::VITE_SUPABASE_URL (${base}) is NOT the project this workflow deploys to (${canonical}). If these differ, the deployed functions can never be reached by the site — fix the repository variable or PROJECT_REF."
          fi
          if [ -n "$key" ]; then
            echo "health check using the project's publishable key (public by design)"
          else
            echo "::warning::VITE_SUPABASE_PUBLISHABLE_KEY repository variable is not set — probing unauthenticated. With verify_jwt on, a deployed function answers 401/405/200; only 404 means 'not deployed'."
          fi

          failures=0
          for fn in zhino-voice zhino-assistant; do
            echo "===== health: ${fn} ====="
            code="000"
            for attempt in 1 2 3; do
              if [ -n "$key" ]; then
                code=$(curl -sS -m 30 -D "/tmp/health-${fn}.hdr" -o "/tmp/health-${fn}.json" -w '%{http_code}' \
                  -H "Authorization: Bearer ${key}" -H "apikey: ${key}" \
                  "${base}/functions/v1/${fn}" 2>/dev/null) || code="000"
              else
                code=$(curl -sS -m 30 -D "/tmp/health-${fn}.hdr" -o "/tmp/health-${fn}.json" -w '%{http_code}' \
                  "${base}/functions/v1/${fn}" 2>/dev/null) || code="000"
              fi
              echo "attempt ${attempt} -> HTTP ${code}"
              if [ "$code" != "000" ]; then break; fi
              sleep 10
            done
            grep -i '^sb-error-code:' "/tmp/health-${fn}.hdr" 2>/dev/null || true
            head -c 500 "/tmp/health-${fn}.json" 2>/dev/null; echo

            case "$code" in
              404)
                echo "::error::${fn} still answers 404 — the deploy did not take effect. Re-run the workflow once; if it persists, inspect the deploy step log."
                failures=$((failures + 1)) ;;
              401|403)
                # The platform's verify_jwt gate answers 401 for a publishable
                # key (it only accepts a real user JWT). For zhino-voice that is
                # a hard failure: the storefront is anonymous and can never
                # present a user JWT.
                if [ "$fn" = "zhino-voice" ]; then
                  echo "::error::${fn} answered ${code} — the platform JWT gate is still on, so every browser call dies before our code runs. The previous step must set verify_jwt=false for this public function."
                  failures=$((failures + 1))
                else
                  echo "::warning::${fn} answered ${code} — deployed, but its JWT gate is on, so an anonymous storefront cannot call it."
                fi ;;
              200)
                echo "ok: ${fn} is deployed and answers 200."
                if [ "$fn" = "zhino-voice" ] && [ -f "/tmp/health-${fn}.json" ]; then
                  if grep -q '"configured":true' "/tmp/health-${fn}.json"; then
                    echo "ok: ${fn} reports configured:true — its TTS secret is active."
                  else
                    echo "::warning::${fn} reports configured:false — deployed and reachable, but no TTS secret is set (TTS_API_KEY / AZURE_SPEECH_KEY), so real requests answer 501 and the site falls back to the browser voice."
                  fi
                fi ;;
              000)
                # Not a pass: an unreachable endpoint proves nothing, and
                # treating it as OK is how a missing deploy looks "green".
                echo "::error::${fn} could not be reached after 3 attempts — the deploy cannot be confirmed, so this run is marked failed."
                failures=$((failures + 1)) ;;
              *)
                echo "note: ${fn} is deployed (any HTTP answer other than 404 proves existence); this probe got HTTP ${code}." ;;
            esac
          done
          [ "$failures" -eq 0 ] || exit 1
          echo "✅ Both functions answer — the 404 is gone."

      - name: Result summary
        if: always()
        env:
          TOKEN_FP: ${{ steps.guard.outputs.token_fp }}
        run: |
          set -uo pipefail
          {
            echo "### Supabase functions deploy — ${PROJECT_REF}"
            echo
            echo "- token: Supabase personal access token, sha256[1:12]=${TOKEN_FP:-n/a} (value never printed)"
            echo "- functions: zhino-voice + zhino-assistant (deploy is idempotent — re-running is safe)"
            echo "- secrets: only the names that existed as GitHub secrets were set; no value was ever printed"
            echo "- live check: see the 'Verify' step — HTTP status + health body of both endpoints"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
