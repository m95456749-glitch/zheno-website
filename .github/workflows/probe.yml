name: Probe token perms
on:
  pull_request:
    paths:
      - ".github/workflows/probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe endpoints
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: kijhqsyftzufydonggeb
        run: |
          set -uo pipefail
          tmp=$(mktemp -d)
          get() {
            local path=$1
            local code body
            resp=$(curl -sS -m 20 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Accept: application/json" -w $'\n%{http_code}' "https://api.supabase.com${path}" 2>$tmp/err || true)
            code=${resp##*$'\n'}
            body=${resp%$'\n'*}
            echo "GET $path -> $code"
            echo "$body" | head -c 500; echo
            echo "::notice title=probe $path::HTTP $code body=$(echo "$body" | head -c 300)"
          }
          get "/v1/profile"
          get "/v1/organizations"
          get "/v1/projects/${PROJECT_REF}"
          get "/v1/projects/${PROJECT_REF}/jit-access"
          get "/v1/projects/${PROJECT_REF}/database/jit/list"
          get "/v1/projects/${PROJECT_REF}/database/jit"
          get "/v1/projects/${PROJECT_REF}/config/database/pooler"
          # Try to get org slug first
          resp=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/${PROJECT_REF})
          org=$(echo "$resp" | jq -r '.organization_slug // empty')
          echo "org_slug $org"
          if [ -n "$org" ]; then
            get "/v1/organizations/$org"
            get "/v1/organizations/$org/members"
            get "/v2/organizations/$org/members"
          fi
          get "/v1/projects/${PROJECT_REF}/api-keys"
          get "/v1/projects/${PROJECT_REF}/config/auth"
