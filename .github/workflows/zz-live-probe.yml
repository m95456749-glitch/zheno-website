# TEMPORARY read-only probe (deleted in a later commit).
# 1) runs verify:live against the Worker AND the production domain,
# 2) asks the Supabase Management API (read-only GET) whether the project ref
#    embedded in the deployed bundle actually exists and what state it is in.
# No write, no migration, no secret printed (only booleans, refs, names, status).
name: zz-live-probe
on:
  push:
    branches:
      - arena/81ab77fc-zheno-website
    paths:
      - ".github/workflows/zz-live-probe.yml"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Worker deployment (read-only)
        run: |
          node scripts/verify-live-readonly.mjs https://zheno.m95456749.workers.dev > worker.log 2>&1 || true
          tail -n 30 worker.log | sed 's/^/::notice title=worker::/' || true

      - name: Production domain zheno.devs.surf (read-only)
        run: |
          node scripts/verify-live-readonly.mjs https://zheno.devs.surf > prod.log 2>&1 || true
          tail -n 30 prod.log | sed 's/^/::notice title=prod::/' || true
          echo "::notice title=prod-compare::worker-shell=$(grep -o 'shell served at / ([0-9]*' worker.log | grep -o '[0-9]*') prod-shell=$(grep -o 'shell served at / ([0-9]*' prod.log | grep -o '[0-9]*')"

      - name: Independent DNS check for the Supabase project host (DoH, read-only)
        run: |
          for name in kijhqsyftzufydonggeb.supabase.co supabase.co; do
            code=$(curl -s -o /tmp/d.json -w '%{http_code}' -H 'accept: application/dns-json' \
              "https://cloudflare-dns.com/dns-query?name=$name&type=A")
            status=$(python3 -c "import json;d=json.load(open('/tmp/d.json'));print(d.get('Status'))" 2>/dev/null || echo '?')
            answer=$(python3 -c "import json;d=json.load(open('/tmp/d.json'));print(','.join(r['data'] for r in d.get('Answer',[])) or 'none')" 2>/dev/null || echo '?')
            echo "::notice title=doh::$name HTTP=$code DNS-Status=$status (0=NOERROR,3=NXDOMAIN) answers=$answer"
          done

      - name: Supabase project state (Management API, read-only GET)
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: kijhqsyftzufydonggeb
        run: |
          set -uo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning title=supabase-api::SUPABASE_ACCESS_TOKEN is not configured; project state cannot be queried."
            exit 0
          fi
          code=$(curl -s -o /tmp/p.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.supabase.com/v1/projects)
          echo "::notice title=supabase-api::GET /v1/projects -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning title=supabase-api::the token could not list projects (HTTP $code). Nothing else was attempted."
            exit 0
          fi
          python3 - "$REF" <<'PY'
          import json, sys
          ref = sys.argv[1]
          projects = json.load(open('/tmp/p.json'))
          if not isinstance(projects, list):
              print("::warning title=supabase-api::unexpected response shape")
              raise SystemExit(0)
          print(f"::notice title=supabase-api::token sees {len(projects)} project(s)")
          for p in projects:
              print(f"::notice title=supabase-api-reflist::ref={p.get('id')} name={p.get('name')} status={p.get('status')} region={p.get('region')}")
          match = [p for p in projects if p.get('id') == ref]
          if match:
              print(f"::notice title=supabase-api-verdict::project {ref} EXISTS status={match[0].get('status')}")
          else:
              print(f"::warning title=supabase-api-verdict::project {ref} is NOT in the token's project list (deleted, moved, or a different account)")
          PY
