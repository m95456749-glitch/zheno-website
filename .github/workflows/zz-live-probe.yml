# TEMPORARY read-only probe (deleted in the next commit).
# Runs verify:live against the Worker and the production domain, plus an
# independent DNS-over-HTTPS check of the Supabase project host.
# Read-only (GET/OPTIONS), no secret printed. GitHub caps annotations at 10 per
# step, so results are emitted as three compact annotations.
name: zz-live-probe
on:
  push:
    branches:
      - arena/81ab77fc-zheno-website
    paths:
      - ".github/workflows/zz-live-probe.yml"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify both hosts (read-only)
        run: |
          set +e
          for target in https://zheno.m95456749.workers.dev https://zheno.devs.surf; do
            slug=$([ "$target" = "https://zheno.devs.surf" ] && echo prod || echo worker)
            node scripts/verify-live-readonly.mjs "$target" > "$slug.log" 2>&1
            echo "$slug exit=$?" >> exits.txt
          done
          set -e
          {
            echo "target / exit code / result line"
            for slug in worker prod; do
              echo "--- $slug ---"
              grep -E '^(RESULT|FAIL):' "$slug.log" || echo "(no RESULT/FAIL line)"
              grep -E '^[0-9]+ read-only checks' "$slug.log" | sed 's/^/counts: /'
              grep -c '^PASS:' "$slug.log" | sed 's/^/passed: /'
              grep -c '^WARN:' "$slug.log" | sed 's/^/warned: /'
            done
          } > compact.txt
          cat compact.txt
          while IFS= read -r line; do
            echo "::notice title=live-verify::${line}"
          done < compact.txt

      - name: Independent DNS check (DoH) of the Supabase project host
        run: |
          for name in kijhqsyftzufydonggeb.supabase.co supabase.co; do
            curl -s -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$name&type=A" -o /tmp/d.json
            status=$(python3 -c "import json;print(json.load(open('/tmp/d.json')).get('Status'))")
            answer=$(python3 -c "import json;d=json.load(open('/tmp/d.json'));print(','.join(r['data'] for r in d.get('Answer',[])) or 'none')")
            echo "::notice title=doh::$name DNS-Status=$status (0=NOERROR,3=NXDOMAIN) answers=$answer"
          done
