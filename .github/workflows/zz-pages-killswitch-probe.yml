# TEMPORARY probe — verifies the GitHub Pages kill-switch before PR #99 merge.
# Prints only a boolean; the variable itself is not a secret. Deleted right after
# the result is read (it must not stay on main).
name: zz-pages-killswitch-probe
on:
  push:
    branches:
      - arena/81ab77fc-zheno-website
    paths:
      - ".github/workflows/zz-pages-killswitch-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report kill-switch state (boolean only)
        env:
          KILLSWITCH: ${{ vars.DISABLE_GITHUB_PAGES }}
        run: |
          echo "DISABLE_GITHUB_PAGES value-is-true: $([ "$KILLSWITCH" = "true" ] && echo YES || echo NO)"
          echo "deploy.yml build job would run:      $([ "$KILLSWITCH" = "true" ] && echo NO-skipped || echo YES-deploys-to-zheno.devs.surf)"
          echo "raw length: ${#KILLSWITCH}"
