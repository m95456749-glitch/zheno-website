name: Supabase JIT authorize (gated)

# Authorizes the *calling token's own* Supabase user for a Postgres role under
# Temporary Access (JIT), using the correct Management API contract.
#
# ── Why this workflow exists ───────────────────────────────────────────────────
# The previous attempt assumed JIT authorization needs a `user_id` (gotrue_id)
# obtained from `GET /v1/profile` or `GET /v1/organizations/{slug}/members`.
# That assumption is wrong, and it is what produced the 403/400/406 dead end.
#
# Verified against supabase/supabase @ apps/docs/spec/api_v1_openapi.json:
#
#   POST /v1/projects/{ref}/database/jit          "Authorize JIT access"
#     summary      : Authorize user-id to role mappings for JIT access
#     description  : "Authorizes the request to assume a role in the project
#                     database"   <- the API resolves the user FROM THE TOKEN
#     x-fga-permissions : [["database_jit_read"]]   <- READ, not write
#     requestBody  : AuthorizeJitAccessBody
#                      role  : string, minLength 1, REQUIRED
#                      rhost : REQUIRED, anyOf [ ipv4 literal, ipv6 literal ]
#                      required: ["role", "rhost"]   <- there is NO user_id field
#                      example : {"role":"postgres","rhost":"203.0.113.10"}
#     200 response : JitAuthorizeAccessResponse_Output
#                      user_id : uuid, REQUIRED   <- THIS is the gotrue_id
#                      user_role: { role, expires_at?, allowed_networks?, branches_only? }
#
#   PUT  /v1/projects/{ref}/database/jit          "Update JIT access"
#     x-fga-permissions : [["database_jit_write"]]
#     requestBody  : UpdateJitAccessBody
#                      user_id : uuid, REQUIRED
#                      roles   : array, REQUIRED   <- "roles", NOT "user_roles"
#                      example expires_at: 1740787200  (SECONDS)
#
#   DELETE /v1/projects/{ref}/database/jit/{user_id}
#     x-fga-permissions : [["database_jit_write"]]
#
# So `rhost` (a bare IPv4/IPv6 literal — not a CIDR, not a hostname) was the
# missing required field behind every HTTP 400 seen previously, and the
# `user_roles` key in the Temporary-access guide page is stale: the spec and the
# Dashboard's own apps/studio/data/jit-db-access/jit-db-access-grant-mutation.ts
# both use `roles`.
#
# ── Security properties ────────────────────────────────────────────────────────
# * workflow_dispatch, plus a path-filtered pull_request trigger for this file
#   only. The pull_request trigger does NOT execute unless the PR title carries
#   the literal marker [run-jit-auth-test], and the job is additionally gated on
#   a same-repository PR (fork PRs receive no repository secrets anyway, and the
#   guard step fails closed when the token secret is missing). So no incidental
#   PR can cause a JIT grant. This mirrors supabase-jit-enable.yml, which the
#   repo already merged (PR #45).
# * DRY RUN BY DEFAULT. `confirm` defaults to "false": the workflow prints the
#   exact request it would send and exits 0 without issuing any write.
# * The grant is IP-BOUND. `rhost` is the runner's own public egress IPv4, so the
#   resulting mapping only authorizes connections from that address. That is a
#   tighter posture than an unrestricted mapping, not a weaker one.
# * Authorization and the psql verification happen in the SAME job, because a
#   GitHub-hosted runner's egress IP is per-job and would change otherwise.
# * The token is masked and never printed. It is passed to psql via PGPASSWORD,
#   never on a command line.
# * No migration is applied. `run_dry_run` only reports what
#   `supabase db push --dry-run` WOULD apply, and it must run in the same job
#   as the grant because the JIT mapping is IP-bound. No schema, password,
#   SSL or network setting is changed.
# * Optional `revoke_after_test` deletes the mapping again when you only want a
#   one-shot verification.

on:
  pull_request:
    paths:
      - ".github/workflows/supabase-jit-authorize.yml"
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref"
        required: true
        default: kijhqsyftzufydonggeb
      role:
        description: "Postgres role to authorize"
        required: true
        default: postgres
      confirm:
        description: "Set to 'true' to actually perform the authorization. Any other value = dry run."
        required: true
        default: "false"
      rhost:
        description: "Optional explicit IPv4/IPv6 literal for rhost. Blank = auto-detect this runner's egress IP."
        required: false
        default: ""
      expires_hours:
        description: "Optional. >0 issues a follow-up PUT that bounds the grant to N hours (expires_at in SECONDS). 0 = leave whatever the API applies."
        required: false
        default: "0"
      db_host:
        description: "Host used for the psql verification"
        required: true
        default: aws-1-eu-west-1.pooler.supabase.com
      db_port:
        description: "Port used for the psql verification (5432 = session pooler)"
        required: true
        default: "5432"
      run_psql_test:
        description: "After authorizing, verify with a real psql connection"
        required: true
        default: "true"
      run_dry_run:
        description: "If the psql check succeeds, run 'supabase db push --dry-run' in THIS job (read-only; applies nothing; must be same-job because the grant is IP-bound)"
        required: false
        default: "true"
      revoke_after_test:
        description: "Delete the JIT mapping again once the test finishes"
        required: true
        default: "false"

permissions:
  contents: read

concurrency:
  group: supabase-jit-authorize
  cancel-in-progress: false

jobs:
  authorize:
    # pull_request runs only for same-repository PRs; a PR from a fork never has
    # the secrets and is skipped outright.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: ${{ github.event.inputs.project_ref || 'kijhqsyftzufydonggeb' }}
      ROLE: ${{ github.event.inputs.role || 'postgres' }}
      CONFIRM: ${{ github.event.inputs.confirm || (contains(github.event.pull_request.title, '[run-jit-auth-test]') && 'true' || 'false') }}
      RHOST_INPUT: ${{ github.event.inputs.rhost || '' }}
      # For PR runs (no inputs): 1-hour bound via the PUT step, and the mapping is
      # revoked at the end of the job — the grant only ever exists for this test.
      EXPIRES_HOURS: ${{ github.event.inputs.expires_hours || '1' }}
      DB_HOST: ${{ github.event.inputs.db_host || 'aws-1-eu-west-1.pooler.supabase.com' }}
      DB_PORT: ${{ github.event.inputs.db_port || '5432' }}
      RUN_PSQL: ${{ github.event.inputs.run_psql_test || 'true' }}
      RUN_DRYRUN: ${{ github.event.inputs.run_dry_run || 'true' }}
      REVOKE: ${{ github.event.inputs.revoke_after_test || 'true' }}
      API: https://api.supabase.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — token present, normalised, masked
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_TOKEN:-}" ]; then
            echo "::error::Missing secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          tok=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n\t' \
                | sed -e "s/^[[:space:]\"']*//" -e "s/[[:space:]\"']*$//" \
                      -e "s/^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]*//" \
                      -e "s/^[[:space:]\"']*//" -e "s/[[:space:]\"']*$//")
          echo "::add-mask::$tok"
          fp=$(printf '%s' "$tok" | sha256sum | cut -c1-12)
          case "$tok" in
            sbp_fc*) cls="scoped fine-grained PAT (sbp_fc…)" ;;
            sbp_*)   cls="classic PAT (sbp_…)" ;;
            *)       cls="unrecognised" ;;
          esac
          echo "token class=$cls length=${#tok} sha256[1:12]=$fp"
          echo "::notice title=token fingerprint::class=$cls len=${#tok} fp=$fp"
          {
            echo "SUPABASE_ACCESS_TOKEN=$tok"
            echo "SB_TOKEN_FP=$fp"
            echo "SB_TOKEN_CLASS=$cls"
          } >> "$GITHUB_ENV"

      - name: Install psql client
        if: env.CONFIRM == 'true' && env.RUN_PSQL == 'true'
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Egress diagnostics (informational, non-fatal)
        if: env.CONFIRM == 'true'
        run: |
          # INFORMATIONAL ONLY — this step must never fail the job.
          # Run 34841778856 (5eaace4) proved it could: GitHub's default bash
          # runs with -e, and `set -uo pipefail` does NOT clear errexit, so
          # the first unguarded substitution — a curl that could not connect
          # (exit 7) — aborted the step before any probe result was printed
          # and every later step was skipped. Hence: explicit `set +e`,
          # `|| true` guards on command substitutions whose rc is not needed,
          # rc captured separately where it is, and a final `exit 0`.
          set +e
          set -uo pipefail
          echo "== addresses =="
          ip -brief addr 2>/dev/null | head -20 || true
          echo "== default routes =="
          ip route 2>/dev/null | head -5 || true
          ip -6 route 2>/dev/null | grep -m2 default || true
          echo "== DNS (management API + the real Postgres targets) =="
          for h in api.supabase.com api.github.com api.ipify.org 1.1.1.1 \
                   "${DB_HOST}" "db.${PROJECT_REF}.supabase.co"; do
            a=$(getent ahostsv4 "$h" 2>/dev/null | awk '{print $1}' | sort -u | head -4 | tr '\n' ' ' || true)
            aaaa=$(getent ahostsv6 "$h" 2>/dev/null | awk '{print $1}' | sort -u | head -4 | tr '\n' ' ' || true)
            echo "dns $h A=[${a:-none}] AAAA=[${aaaa:-none}]"
          done
          echo "== HTTP probes (rc = curl exit: 6=DNS 7=connect 28=timeout 35=TLS) =="
          for t in https://api.supabase.com/auth/v1/health https://api.github.com/meta https://api.ipify.org; do
            for m in v4 v6 any; do
              case $m in v4) f="-4";; v6) f="-6";; *) f="";; esac
              out=$(curl -sS -o /dev/null -m 10 -w '%{http_code}' $f "$t" 2>/tmp/perr)
              rc=$?
              err=$(head -c 120 /tmp/perr 2>/dev/null | tr '\n' ' ' || true)
              echo "probe $t [$m] rc=$rc http=${out:-n/a} err=${err:-none}"
            done
          done
          echo "== TCP connect probes — the REAL Postgres targets =="
          # ${DB_HOST}:5432 is the session pooler the psql + dry-run steps use
          # (temporary access does not work over the :6543 transaction pooler);
          # db.${PROJECT_REF}.supabase.co:5432 (direct) is probed for contrast.
          for hp in "${DB_HOST}:5432" "${DB_HOST}:6543" "db.${PROJECT_REF}.supabase.co:5432"; do
            h="${hp%%:*}"; p="${hp##*:}"
            t0=$(date +%s%N 2>/dev/null || echo 0)
            timeout 12 bash -c "exec 3<>/dev/tcp/${h}/${p}" 2>/tmp/tcperr
            rc=$?
            t1=$(date +%s%N 2>/dev/null || echo 0)
            err=$(head -c 120 /tmp/tcperr 2>/dev/null | tr '\n' ' ' || true)
            echo "tcp ${hp} rc=${rc} (0=open 1=refused/unreachable 124=timeout) $(( (t1 - t0) / 1000000 ))ms err=${err:-none}"
          done
          echo "== rhost-resolution endpoint spot check (rc + first bytes of body) =="
          for t in https://api.supabase.com/cdn-cgi/trace https://1.1.1.1/cdn-cgi/trace \
                   https://api.ipify.org https://checkip.amazonaws.com https://ifconfig.co/ip https://api64.ipify.org; do
            body=$(curl -sS -m 10 -A 'Mozilla/5.0 (compatible; GitHub-Actions; zheno-jit-ci)' "$t" 2>/tmp/eerr | tr -d '\r')
            rc=$?
            snippet=$(printf '%s' "$body" | head -c 100 | tr '\n' '|' || true)
            eerrsnip=$(head -c 120 /tmp/eerr 2>/dev/null | tr '\n' ' ' || true)
            echo "echo-svc $t rc=$rc body[:100]=[${snippet:-<empty>}] err=${eerrsnip:-none}"
          done
          rm -f /tmp/perr /tmp/tcperr /tmp/eerr
          exit 0
      - name: Resolve rhost (IPv4/IPv6 literal, per AuthorizeJitAccessBody)
        id: rhost
        run: |
          set -uo pipefail
          # Strict literal-IPv4 pattern taken verbatim from AuthorizeJitAccessBody
          # in apps/docs/spec/api_v1_openapi.json. rhost must NOT be a CIDR and
          # must NOT be a hostname. The contract also accepts a literal IPv6.
          # Same octet rules as AuthorizeJitAccessBody's schema, expressed in POSIX
          # ERE (grep -E does NOT support PCRE-style (?:…) groups — using them
          # makes every candidate silently fail validation).
          OCTET='(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])'
          IPV4_RE="^(${OCTET}\.){3}${OCTET}$"
          is_ipv4_public() {
            local c="$1"
            printf '%s' "$c" | grep -Eq "$IPV4_RE" || return 1
            case "$c" in 0.*|10.*|127.*|169.254.*|192.168.*|224.*|255.*) return 1 ;; esac
            return 0
          }
          is_ipv6_global() {
            python3 - "$1" <<'PYEOF'
          import socket, sys
          s = sys.argv[1]
          try:
              socket.inet_pton(socket.AF_INET6, s)
          except OSError:
              sys.exit(1)
          sys.exit(1 if s.lower().startswith(("::1", "fe80", "fc", "fd", "ff")) else 0)
          PYEOF
          }
          UA='Mozilla/5.0 (compatible; GitHub-Actions; zheno-jit-ci)'
          # cdn-cgi/trace echoes the client IP as an `ip=` line; api.supabase.com
          # is the one domain this workflow is known to reach from this runner pool.
          trace_eps="https://api.supabase.com/cdn-cgi/trace https://1.1.1.1/cdn-cgi/trace http://1.1.1.1/cdn-cgi/trace https://www.cloudflare.com/cdn-cgi/trace"
          echo_eps="https://api.ipify.org http://checkip.amazonaws.com https://ipinfo.io/ip https://ifconfig.me/ip https://myexternalip.com/raw https://ipv4.icanhazip.com https://ifconfig.co/ip https://api64.ipify.org"

          try_fetch() {  # $1=svc; candidate printed on stdout (empty on failure), details on stderr
            local svc="$1" body cand f last_err=""
            for f in "-4" "-6" ""; do
              case "$svc" in *ipv4*) [ "$f" = "-6" ] && continue ;; esac
              case "$svc" in *ipv6*) [ "$f" = "-4" ] && continue ;; esac
              body=$(curl -sS -m 12 -A "$UA" $f "$svc" 2>/tmp/rerr | tr -d '\r' || true)
              last_err=$(head -c 90 /tmp/rerr 2>/dev/null | tr '\n' ' ')
              if printf '%s' "$svc" | grep -q 'cdn-cgi/trace'; then
                cand=$(printf '%s' "$body" | sed -n 's/^ip=\([0-9a-fA-F:.]*\)$/\1/p' | head -n1)
              else
                cand=$(printf '%s' "$body" | grep -Eo '^([0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9a-fA-F:]*:[0-9a-fA-F:.]+$' | head -n1)
              fi
              if is_ipv4_public "$cand"; then echo "  [$(date +%T)] $svc (mode=${f:-any}) -> IPv4 $cand" >&2; printf '%s' "$cand"; return 0; fi
              if is_ipv6_global "$cand"; then echo "  [$(date +%T)] $svc (mode=${f:-any}) -> IPv6 $cand" >&2; printf '%s' "$cand"; return 0; fi
            done
            echo "  [$(date +%T)] $svc -> unresolved${last_err:+ err=${last_err}}" >&2
            return 1
          }

          candidate="${RHOST_INPUT}"
          if [ -n "$candidate" ]; then
            echo "using explicit rhost input"
            is_ipv4_public "$candidate" || is_ipv6_global "$candidate" || { echo "::error::explicit rhost is not a valid literal IPv4/IPv6"; exit 1; }
          else
            echo "auto-detecting this runner's public egress IP (IPv4 preferred; IPv6 accepted)…"
            for round in 1 2; do
              [ "$round" = "2" ] && sleep 5
              for svc in $trace_eps $echo_eps; do
                if cand=$(try_fetch "$svc") && [ -n "$cand" ]; then candidate="$cand"; break 2; fi
              done
              echo "round $round: no endpoint yielded a usable egress literal yet"
            done
          fi

          if [ -z "$candidate" ]; then
            echo "::error::could not resolve a valid literal IPv4/IPv6 for rhost (got '<empty>'). See the Egress diagnostics step. Pass the rhost input explicitly (or relax runner egress rules)."
            exit 1
          fi
          echo "rhost=$candidate"
          echo "rhost=$candidate" >> "$GITHUB_OUTPUT"

      - name: Pre-flight (read-only) — JIT state and existing mapping
        id: pre
        run: |
          set -uo pipefail
          ref="${PROJECT_REF:?}"
          g() {
            curl -sS -m 30 -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                 -H "Accept: application/json" -w $'\n%{http_code}' "${API}$1" 2>/dev/null || true
          }
          r=$(g "/v1/projects/${ref}/jit-access");  c="${r##*$'\n'}"; b="${r%$'\n'*}"
          echo "GET /v1/projects/${ref}/jit-access -> HTTP $c body=$(printf '%s' "$b" | head -c 200)"
          state=$(printf '%s' "$b" | jq -r '.state // empty' 2>/dev/null || echo "")
          if [ "$state" != "enabled" ]; then
            echo "::error::Temporary Access is not enabled (state='${state:-unknown}'). Run the 'Supabase JIT enable (manual)' workflow first."
            exit 1
          fi

          r=$(g "/v1/projects/${ref}/database/jit/list"); c="${r##*$'\n'}"; b="${r%$'\n'*}"
          echo "GET /v1/projects/${ref}/database/jit/list -> HTTP $c body=$(printf '%s' "$b" | head -c 400)"
          echo "jit_list_code=$c" >> "$GITHUB_OUTPUT"

          r=$(g "/v1/projects/${ref}/database/jit"); c="${r##*$'\n'}"; b="${r%$'\n'*}"
          echo "GET /v1/projects/${ref}/database/jit -> HTTP $c body=$(printf '%s' "$b" | head -c 300)"
          if [ "$c" = "403" ]; then
            echo "::error::database_jit_read is not effective on this token (403). POST /database/jit cannot be used."
            exit 1
          fi
          echo "database_jit_read is effective (HTTP $c != 403)."

      - name: DRY RUN — print the exact request, issue nothing
        if: env.CONFIRM != 'true'
        env:
          RHOST: ${{ steps.rhost.outputs.rhost }}
        run: |
          set -uo pipefail
          echo "confirm='${CONFIRM}' -> DRY RUN. No write request was issued."
          echo ""
          echo "The single request that resolves this blocker is:"
          echo ""
          echo "  curl -X POST \"https://api.supabase.com/v1/projects/${PROJECT_REF}/database/jit\" \\"
          echo "    -H \"Authorization: Bearer \$SUPABASE_ACCESS_TOKEN\" \\"
          echo "    -H \"Content-Type: application/json\" \\"
          echo "    -d '{\"role\": \"${ROLE}\", \"rhost\": \"${RHOST}\"}'"
          echo ""
          echo "Both fields are required; there is no user_id field. The 200 response"
          echo "returns { user_id, user_role } — user_id is the caller's gotrue_id, so"
          echo "this one call both authorizes and reveals the id."
          echo ""
          echo "::notice title=DRY RUN::re-dispatch with confirm=true to execute"

      - name: Authorize (POST /v1/projects/{ref}/database/jit)
        id: auth
        if: env.CONFIRM == 'true'
        env:
          RHOST: ${{ steps.rhost.outputs.rhost }}
        run: |
          set -uo pipefail
          ref="${PROJECT_REF:?}"; role="${ROLE:?}"; rhost="${RHOST:?}"
          payload=$(jq -cn --arg r "$role" --arg h "$rhost" '{role:$r, rhost:$h}')
          echo "POST /v1/projects/${ref}/database/jit  payload=$payload"

          resp=$(curl -sS -m 45 -X POST \
                   -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                   -H "Accept: application/json" -H "Content-Type: application/json" \
                   -d "$payload" -w $'\n%{http_code}' \
                   "${API}/v1/projects/${ref}/database/jit" 2>/dev/null) || true
          code="${resp##*$'\n'}"; body="${resp%$'\n'*}"
          echo "HTTP $code"
          printf '%s' "$body" | jq . 2>/dev/null || printf '%s' "$body" | head -c 800
          echo ""

          if [ "$code" != "200" ]; then
            eb=$(printf '%s' "$body" | tr -d '\r\n' | head -c 400)
            echo "::error title=authorize failed::POST /database/jit -> HTTP ${code} body=${eb}"
            exit 1
          fi
          uid=$(printf '%s' "$body" | jq -r '.user_id // empty')
          exp=$(printf '%s' "$body" | jq -r '.user_role.expires_at // "none"')
          if [ -z "$uid" ]; then
            echo "::error::200 but no user_id in response"
            exit 1
          fi
          echo "::notice title=user_id resolved::gotrue_id=${uid} (from the POST response — no members_read / /v1/profile needed)"
          echo "user_id=$uid"        >> "$GITHUB_OUTPUT"
          echo "expires_at=$exp"    >> "$GITHUB_OUTPUT"

      - name: Optionally bound the grant in time (PUT, expires_at in SECONDS)
        id: bound
        if: env.CONFIRM == 'true' && env.EXPIRES_HOURS != '0'
        env:
          UID_: ${{ steps.auth.outputs.user_id }}
          RHOST: ${{ steps.rhost.outputs.rhost }}
        run: |
          set -uo pipefail
          ref="${PROJECT_REF:?}"; role="${ROLE:?}"
          # AuthorizeJitAccessBody/UpdateJitAccessBody example uses SECONDS
          # (1740787200). The Temporary-access guide page shows milliseconds —
          # that page is stale; the spec and the Dashboard mutation use seconds.
          exp=$(( $(date +%s) + EXPIRES_HOURS * 3600 ))
          # IPv4 → allowed_cidrs /32; IPv6 literal → allowed_cidrs_v6 /128
          if printf '%s' "${RHOST:?}" | grep -q ':'; then mask=128; key=allowed_cidrs_v6; else mask=32; key=allowed_cidrs; fi
          payload=$(jq -cn --arg u "$UID_" --arg r "$role" --argjson e "$exp" --arg k "$key" --arg c "${RHOST}/${mask}" \
                    '{user_id:$u, roles:[{role:$r, expires_at:$e, allowed_networks:{($k):[{cidr:$c}]}}]}')
          echo "PUT /v1/projects/${ref}/database/jit  payload=$payload"
          resp=$(curl -sS -m 45 -X PUT \
                   -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                   -H "Accept: application/json" -H "Content-Type: application/json" \
                   -d "$payload" -w $'\n%{http_code}' \
                   "${API}/v1/projects/${ref}/database/jit" 2>/dev/null) || true
          code="${resp##*$'\n'}"; body="${resp%$'\n'*}"
          echo "HTTP $code"; printf '%s' "$body" | jq . 2>/dev/null || printf '%s' "$body" | head -c 600
          if [ "$code" != "200" ]; then
            echo "::warning title=PUT failed::HTTP $code — the POST grant is still in place; the body key is 'roles', not 'user_roles'."
          fi

      - name: Verify mapping (read-only)
        id: verify
        if: env.CONFIRM == 'true'
        run: |
          set -uo pipefail
          ref="${PROJECT_REF:?}"
          g() {
            curl -sS -m 30 -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                 -H "Accept: application/json" -w $'\n%{http_code}' "${API}$1" 2>/dev/null || true
          }
          r=$(g "/v1/projects/${ref}/database/jit"); c="${r##*$'\n'}"; b="${r%$'\n'*}"
          echo "GET /v1/projects/${ref}/database/jit -> HTTP $c"
          printf '%s' "$b" | jq . 2>/dev/null || printf '%s' "$b" | head -c 500
          r=$(g "/v1/projects/${ref}/database/jit/list"); c="${r##*$'\n'}"; b="${r%$'\n'*}"
          echo "GET /v1/projects/${ref}/database/jit/list -> HTTP $c"
          printf '%s' "$b" | jq . 2>/dev/null || printf '%s' "$b" | head -c 800
          echo ""

      - name: Verify over a REAL Postgres connection (session pooler, jit=true)
        id: psql
        if: env.CONFIRM == 'true' && env.RUN_PSQL == 'true'
        run: |
          set -uo pipefail
          ref="${PROJECT_REF:?}"
          pguser="postgres.${ref}"
          echo "host=${DB_HOST} port=${DB_PORT} user=${pguser} dbname=postgres sslmode=require options='-c jit=true'"
          echo "(password = SUPABASE_ACCESS_TOKEN, masked, supplied via PGPASSWORD env only — never on a command line)"
          set +e
          # PGPASSWORD is taken from the normalised+masked env var written by the
          # guard step, so the raw secret never appears in argv.
          out=$(PGPASSWORD="$SUPABASE_ACCESS_TOKEN" PGSSLMODE=require PGOPTIONS='-c jit=true' \
                psql -h "$DB_HOST" -p "$DB_PORT" -U "$pguser" -d postgres \
                     -v ON_ERROR_STOP=1 -tAc 'SELECT current_user, current_database();' 2>&1)
          rc=$?
          set -e
          echo "psql exit=$rc"
          printf '%s\n' "$out" | sed -E "s/${SB_TOKEN_FP:-__nofp__}/<redacted>/g"
          if [ "$rc" = "0" ]; then
            echo "::notice title=Postgres connection OK::current_user/current_database = $(printf '%s' "$out" | tr -d '\r\n' | head -c 120)"
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "identities=$(printf '%s' "$out" | tr -d '\r\n' | head -c 200)" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Postgres connection FAILED::exit=$rc $(printf '%s' "$out" | tr -d '\r\n' | head -c 400)"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi

      - name: Install Supabase CLI (dry-run only)
        if: env.CONFIRM == 'true' && env.RUN_DRYRUN == 'true' && steps.psql.outcome == 'success'
        uses: supabase/setup-cli@v1
        with:
          # Pinned for the same reason as supabase-migrate.yml: 'latest' resolves
          # through the unauthenticated GitHub API and dies on rate limits.
          version: 2.117.0

      - name: Migration dry-run — verify files, then 'supabase db push --dry-run' (read-only)
        # Runs in THIS job on purpose: the JIT grant is bound to this runner's
        # egress IP, so a second workflow run (different job, different IP) could
        # not reuse it. Strictly --dry-run: it reports, it never applies.
        id: dryrun
        if: env.CONFIRM == 'true' && env.RUN_DRYRUN == 'true' && steps.psql.outcome == 'success'
        run: |
          set -uo pipefail
          ref="${PROJECT_REF:?}"

          echo "== 1/2 Verify the repository migrations (read-only; nothing modified) =="
          files=$(ls -1 supabase/migrations/*.sql)
          printf '%s\n' "$files"
          expected="$(printf 'supabase/migrations/20260912000000_initial_schema.sql\nsupabase/migrations/20260912000001_seed_catalog.sql')"
          if [ "$files" != "$expected" ]; then
            echo "::error::supabase/migrations does not contain exactly the two expected files"
            exit 1
          fi
          sha256sum supabase/migrations/*.sql
          echo "supabase CLI: $(supabase --version 2>&1 | head -1)"
          if [ ! -f supabase/config.toml ]; then
            # Runner-side placeholder so the CLI has a project config; the repo
            # and the SQL files themselves are NOT touched. Same command as
            # supabase-migrate.yml uses ("no SQL file was touched").
            supabase init --force >/dev/null 2>&1 || true
          fi

          echo
          echo "== 2/2 supabase db push --dry-run (reports only; applies NOTHING) =="
          pguser="postgres.${ref}"
          # Percent-encoded db URL built in-shell: the password is the masked PAT
          # (temporary access / JIT credential) — never argv, never printed;
          # options carries the required jit=true GUC for Supavisor.
          url=$(python3 -c 'import sys, urllib.parse as u; h,p,usr,pw=sys.argv[1:5]; q=lambda s: u.quote(s, safe=""); print("postgresql://%s:%s@%s:%s/postgres?sslmode=require&options=%s" % (q(usr), q(pw), h, p, q("-c jit=true")))' "$DB_HOST" "$DB_PORT" "$pguser" "$SUPABASE_ACCESS_TOKEN")
          echo "::add-mask::$url"
          echo "target: ${pguser}@${DB_HOST}:${DB_PORT}/postgres (temporary-access/JIT credential)"

          echo "-- supabase migration list (local vs remote history; read-only) --"
          supabase migration list --db-url "$url" 2>&1 || echo "(migration list failed)"
          echo
          echo "-- supabase db push --dry-run --db-url --"
          if supabase db push --dry-run --db-url "$url" 2>&1; then
            echo "dryrun_ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Migration dry-run OK::supabase db push --dry-run completed — nothing was applied"
          else
            rc=$?
            echo "dryrun_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Migration dry-run FAILED::supabase db push --dry-run exited ${rc} — nothing was applied"
            exit "$rc"
          fi

      - name: Revoke mapping (only if requested)
        if: env.CONFIRM == 'true' && env.REVOKE == 'true' && always()
        env:
          UID_: ${{ steps.auth.outputs.user_id }}
        run: |
          set -uo pipefail
          [ -z "${UID_:-}" ] && { echo "no user_id to revoke"; exit 0; }
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X DELETE \
                   -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                   "${API}/v1/projects/${PROJECT_REF}/database/jit/${UID_}" 2>/dev/null) || true
          echo "DELETE /v1/projects/${PROJECT_REF}/database/jit/${UID_} -> HTTP $code"

      - name: Summary
        if: always()
        env:
          RHOST_OUT: ${{ steps.rhost.outputs.rhost }}
          USER_ID_OUT: ${{ steps.auth.outputs.user_id }}
          EXPIRES_OUT: ${{ steps.auth.outputs.expires_at }}
          PSQL_RESULT: ${{ steps.psql.outputs.result }}
          PSQL_IDENTITIES: ${{ steps.psql.outputs.identities }}
          DRYRUN_OK: ${{ steps.dryrun.outputs.dryrun_ok }}
        run: |
          set -uo pipefail
          if [ "${CONFIRM}" = "true" ]; then mode="EXECUTED"; else mode="DRY RUN (no write request issued)"; fi
          {
            echo "## Supabase JIT authorize"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| mode | ${mode} |"
            echo "| project ref | \`${PROJECT_REF}\` |"
            echo "| role | \`${ROLE}\` |"
            echo "| rhost | \`${RHOST_OUT}\` |"
            echo "| token | ${SB_TOKEN_CLASS}, sha256[1:12]=\`${SB_TOKEN_FP}\` |"
            echo "| user_id (gotrue_id) | \`${USER_ID_OUT:-n/a (dry run)}\` |"
            echo "| expires_at applied | \`${EXPIRES_OUT:-n/a}\` |"
            echo "| psql result | \`${PSQL_RESULT:-not run}\` |"
            echo "| psql identities | \`${PSQL_IDENTITIES:-n/a}\` |"
            echo "| supabase db push --dry-run | \`${DRYRUN_OK:-not run}\` (nothing is ever applied) |"
            echo ""
            echo "Endpoint contract used: \`POST /v1/projects/{ref}/database/jit\` with"
            echo "\`{\"role\": \"…\", \"rhost\": \"<ipv4|ipv6 literal>\"}\`, gated by"
            echo "\`database_jit_read\`. No \`user_id\` is sent — the 200 response returns it."
          } >> "$GITHUB_STEP_SUMMARY"
