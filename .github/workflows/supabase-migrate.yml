name: Supabase migrate (manual)

# Manual-only workflow. It reports (dry-run) or applies the exact SQL files in
# supabase/migrations/ to the real Supabase project and then runs supabase/verify.sql.
#
# Nothing here touches the frontend, design, cart, checkout or animations.
# No secret value is ever printed: the access token is described only by its
# class / length / sha256 fingerprint, the DB password is masked, and every
# Postgres connection string is registered with ::add-mask:: before it is used.
#
# Why this version no longer dies on
# "Authorization failed for the access token and project ref pair":
#   1. The token is normalised first — a pasted newline, space, quote or
#      "Bearer " prefix is stripped automatically (a very common cause of a 401).
#   2. A pre-flight step asks the Management API directly what the token can do,
#      so the log names the exact failure mode instead of a generic message.
#   3. `supabase link` is now a best-effort diagnostic, not a gate. A
#      scoped/fine-grained PAT can never satisfy
#      GET /v1/projects/{ref}/api-keys?reveal=true — the call `supabase link`
#      depends on (open Supabase bug supabase/supabase#50244, reported
#      2026-09-10). All migration commands therefore run against an explicit
#      percent-encoded Postgres URL (--db-url), which needs no link at all.
#   4. The Postgres endpoint is READ from
#      GET /v1/projects/{ref}/config/database/pooler (the PRIMARY entry, exactly
#      like the CLI does when linking) instead of being composed from the region:
#      aws-0-{region}.pooler.supabase.com is not universal and answering
#      "FATAL: (ENOTFOUND) tenant/user postgres.{ref} not found" means the project
#      lives on a different Supavisor cluster. db.{ref}.supabase.co is IPv6-only
#      unless the project has the IPv4 add-on, so IPv4 runners cannot use it.
#
# Why this version no longer reports a correct password as a wrong one
# (the "SUPABASE_DB_PASSWORD is not this project's database password" failure):
#   5. The endpoint is no longer a single bet. The previous version read the
#      pooler config and then THREW THE PORT AWAY — the log literally said
#      "API reported 6543/transaction, using 5432 for migrations". One wrong
#      guess aborted the whole run. It now builds an ordered candidate list
#      (the API-advertised host:port first, then the other Supavisor mode on the
#      same host, then the direct connection, then templated regional hosts) and
#      tries them in turn.
#   6. The password normalisation was broken. It deleted \r and \n but never
#      trimmed spaces/tabs, and its quote patterns were \"\"* and ''* — TWO
#      leading quotes — so a single wrapping pair, the common paste artifact,
#      survived into the connection string. It now trims whitespace, removes one
#      matching pair of wrapping quotes, records WHICH transform fired, and —
#      because a password may legitimately contain those characters — keeps the
#      alternatives so the probe can try them instead of guessing.
#   7. The probe distinguishes failure classes instead of blaming the password
#      for everything: tenant/user-not-found, DNS, refused/timeout, TLS,
#      Supavisor's auth circuit breaker, and a genuine credential rejection are
#      all reported separately. "The password is wrong" is now only claimed
#      after every endpoint AND every normalisation has been refused.
#      Attempts are bounded (max 6, stopping early on AUTH and on a circuit
#      breaker) so diagnosing cannot itself trip Supavisor's failure lockout.
#   8. Diagnostics never reveal the secret: only its length, its sha256[1:12]
#      fingerprint and the CHARACTER CLASS of its first/last character
#      (quote / space / tab / letter / digit / other-symbol) are printed, which
#      is enough to spot a paste artifact without exposing the value.
#
# Operator policy (2026-09-14):
#   * The connection path is the DATABASE PASSWORD over the shared SESSION
#     pooler (IPv4) on port 5432, user postgres.<ref>, sslmode=require — in that
#     order, before the API-advertised transaction port.
#   * The probe verifies with `SELECT current_user, current_database();` and
#     reports both values.
#   * The JIT temporary-access fallback is DISABLED (this project's
#     /database/jit endpoints answer an undocumented HTTP 406 for every token
#     class); set ALLOW_JIT_FALLBACK=yes to re-enable it.
#   * pull_request runs remain dry-run ONLY; mode=apply needs workflow_dispatch.

on:
  # A pull request that touches this workflow or the SQL files runs the SAME job in
  # dry-run mode only: `inputs.mode` does not exist for pull_request events and every
  # mutating step is additionally gated on github.event_name == 'workflow_dispatch'.
  pull_request:
    paths:
      - ".github/workflows/supabase-migrate.yml"
      - "supabase/**"
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref"
        required: true
        default: kijhqsyftzufydonggeb
      mode:
        description: "dry-run = report pending migrations only | apply = really push"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      db_host:
        description: "Optional: Postgres host from Dashboard > Connect (blank = auto-detect)"
        required: false
        default: ""
      db_port:
        description: "Optional: Postgres port, 5432 = session / 6543 = transaction (blank = auto)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_REF: ${{ github.event.inputs.project_ref || 'kijhqsyftzufydonggeb' }}
      # Only a private repository's log may show project / organization names.
      SHOW_NAMES: ${{ github.event.repository.private }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — secrets present, token normalised and classified
        id: guard
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RAW_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${RAW_TOKEN:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions)."
            missing=1
          fi
          if [ -z "${RAW_PASSWORD:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD (Dashboard > Project Settings > Database > Database password)."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

          # A token pasted into a GitHub secret very often carries a trailing
          # newline, surrounding spaces/quotes or a "Bearer " prefix. Any of
          # those makes the Management API answer 401 and the CLI report
          # "Authorization failed for the access token and project ref pair".
          tok=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n\t' \
                | sed -e "s/^[[:space:]\"']*//" -e "s/[[:space:]\"']*$//" \
                      -e "s/^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]*//" \
                      -e "s/^[[:space:]\"']*//" -e "s/[[:space:]\"']*$//")
          if [ "$tok" != "$RAW_TOKEN" ]; then
            echo "note: SUPABASE_ACCESS_TOKEN contained stray whitespace/quotes/'Bearer ' — trimmed automatically."
          fi
          echo "::add-mask::$tok"

          is_pat=no; is_scoped=no
          case "$tok" in
            sbp_fc*)          cls="scoped (fine-grained) personal access token, sbp_fc…"
                              is_pat=yes; is_scoped=yes ;;
            sbp_*)            cls="classic personal access token, sbp_…"
                              is_pat=yes ;;
            sb_secret_*)      cls="PROJECT SECRET API KEY, sb_secret_… (data key — the CLI cannot use it)" ;;
            sb_publishable_*) cls="PROJECT PUBLISHABLE API KEY, sb_publishable_… (data key — the CLI cannot use it)" ;;
            eyJ*)             cls="legacy JWT, eyJ… (anon/service_role key — the CLI cannot use it)" ;;
            *)                cls="unrecognised format (a Supabase access token starts with sbp_)" ;;
          esac

          # ---- database password: normalise, and record WHAT had to be removed ----
          # A secret pasted from the Dashboard, a .env file or a JSON blob very often
          # carries a trailing newline, a leading/trailing space, or ONE wrapping pair
          # of quotes. Any of those makes Supavisor answer
          #   FATAL: password authentication failed for user "postgres"
          # even though the operator is certain the stored value "is exactly the
          # password" — and even though the tenant/user was resolved correctly, which
          # is why the failure looks like a wrong password rather than a wrong user.
          #
          # The previous version of this step was broken in two ways:
          #   * its quote patterns were \"\"* and ''*, i.e. they required TWO leading
          #     quote characters, so a single wrapping pair — the common case — was
          #     never removed;
          #   * it only deleted \r and \n, so leading/trailing spaces and tabs were
          #     never trimmed at all.
          # Both artifacts are invisible in the UI and add 1-2 characters to the
          # reported length. Normalise properly, and (because a password may
          # legitimately contain a trailing space or quotes) keep the alternatives so
          # the probe step can try them instead of us having to guess.
          char_class() {  # describe ONE character without ever printing it
            case "$1" in
              '')       echo 'empty' ;;
              '"')      echo 'double-quote' ;;
              "'")      echo 'single-quote' ;;
              ' ')      echo 'space' ;;
              $'\t')    echo 'tab' ;;
              $'\r')    echo 'carriage-return' ;;
              $'\n')    echo 'newline' ;;
              [0-9])    echo 'digit' ;;
              [A-Za-z]) echo 'letter' ;;
              *)        echo 'other-symbol' ;;
            esac
          }
          raw_first_class=$(char_class "${RAW_PASSWORD:0:1}")
          raw_last_class=$(char_class "${RAW_PASSWORD: -1}")

          pw="$RAW_PASSWORD"
          fixes="none"
          note_fix() { [ "$fixes" = "none" ] && fixes="$1" || fixes="$fixes+$1"; }

          step=$(printf '%s' "$pw" | tr -d '\r\n')
          if [ "$step" != "$pw" ]; then note_fix "CR/LF removed"; fi
          pw="$step"

          step=$(printf '%s' "$pw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ "$step" != "$pw" ]; then note_fix "surrounding whitespace trimmed"; fi
          pw="$step"

          if [ "${#pw}" -ge 2 ]; then
            case "$pw" in
              '"'*'"') step="${pw#\"}"; step="${step%\"}"
                       note_fix "one wrapping pair of double quotes removed"; pw="$step" ;;
              "'"*"'") step="${pw#\'}"; step="${step%\'}"
                       note_fix "one wrapping pair of single quotes removed"; pw="$step" ;;
            esac
          fi

          step=$(printf '%s' "$pw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ "$step" != "$pw" ]; then note_fix "whitespace inside the quotes trimmed"; fi
          pw="$step"

          echo "::add-mask::$pw"
          if [ "$fixes" != "none" ]; then
            echo "note: SUPABASE_DB_PASSWORD was normalised — ${fixes}."
            echo "::warning title=SUPABASE_DB_PASSWORD normalised::${fixes} — the stored secret was not byte-identical to the password. Re-save it in Settings > Secrets without the extra characters."
          else
            echo "note: SUPABASE_DB_PASSWORD needed no normalisation (stored value is byte-clean)."
          fi
          pwfp=$(printf '%s' "$pw" | sha256sum | cut -c1-12)

          # Byte length vs character length: if they differ the secret holds
          # multi-byte UTF-8 (a non-ASCII character), which a copy/paste or a
          # locale-sensitive editor can silently alter. Counts only — no value.
          pw_bytes=$(printf '%s' "$pw" | wc -c | tr -d ' ')
          pw_chars=$(printf '%s' "$pw" | LC_ALL=C.UTF-8 wc -m 2>/dev/null | tr -d ' ' || echo "?")
          pw_nonascii=$(printf '%s' "$pw" | LC_ALL=C tr -dc '\200-\377' | wc -c | tr -d ' ')
          pw_control=$(printf '%s' "$RAW_PASSWORD" | LC_ALL=C tr -dc '\000-\010\013\014\016-\037' | wc -c | tr -d ' ')
          pw_shape="bytes=${pw_bytes} chars=${pw_chars} non-ascii-bytes=${pw_nonascii} control-chars=${pw_control}"
          if [ "$pw_nonascii" != "0" ] || [ "$pw_control" != "0" ] || [ "$pw_bytes" != "$pw_chars" ]; then
            echo "::warning title=SUPABASE_DB_PASSWORD encoding::${pw_shape} — the secret contains non-ASCII or control characters. Postgres will compare them byte-for-byte, so an editor or clipboard that normalised them will make an otherwise correct password fail."
          fi

          fp=$(printf '%s' "$tok" | sha256sum | cut -c1-12)
          echo "Both secrets are present."
          echo "  token class        : $cls"
          echo "  token length       : ${#tok}"
          echo "  token sha256[1:12] : $fp"
          echo "  db password length : ${#pw} (raw ${#RAW_PASSWORD}), sha256[1:12]=${pwfp}"
          echo "  db password edge   : first char=${raw_first_class}, last char=${raw_last_class} (classes only — the value is never printed)"
          echo "  db password fixes  : ${fixes}"
          echo "  db password shape  : ${pw_shape}"
          echo "  (to check which token is stored, run locally:"
          echo "   printf '%s' \"\$MY_TOKEN\" | sha256sum | cut -c1-12 )"

          # Annotations are readable through the API without downloading the job log.
          echo "::notice title=SUPABASE_ACCESS_TOKEN::class=${cls} | length=${#tok} | sha256[1:12]=${fp}"
          echo "::notice title=SUPABASE_DB_PASSWORD::length=${#pw} (raw ${#RAW_PASSWORD}) | sha256[1:12]=${pwfp} | normalisation=${fixes} | first=${raw_first_class} last=${raw_last_class} | ${pw_shape}"

          {
            echo "SUPABASE_ACCESS_TOKEN=$tok"
            echo "SUPABASE_DB_PASSWORD=$pw"
            echo "SB_TOKEN_CLASS=$cls"
            echo "SB_TOKEN_IS_PAT=$is_pat"
            echo "SB_TOKEN_IS_SCOPED=$is_scoped"
            echo "SB_TOKEN_FP=$fp"
            echo "SB_PW_FP=$pwfp"
            echo "SB_PW_RAW_FP=$(printf '%s' "$RAW_PASSWORD" | sha256sum | cut -c1-12)"
            echo "SB_PW_FIXES=$fixes"
            echo "SB_PW_EDGE=first=${raw_first_class},last=${raw_last_class}"
            echo "SB_PW_SHAPE=$pw_shape"
          } >> "$GITHUB_ENV"
          {
            echo "token_is_pat=$is_pat"
            echo "token_is_scoped=$is_scoped"
            echo "token_class=$cls"
            echo "pw_fixes=$fixes"
            echo "pw_fp=$pwfp"
            echo "pw_raw_fp=$(printf '%s' "$RAW_PASSWORD" | sha256sum | cut -c1-12)"
            echo "pw_edge=first=${raw_first_class},last=${raw_last_class}"
            echo "pw_shape=$pw_shape"
          } >> "$GITHUB_OUTPUT"

      - name: Show the exact migration files that would be applied
        run: |
          set -euo pipefail
          ls -l supabase/migrations
          echo "--- sha256 (must stay identical to PR #31) ---"
          sha256sum supabase/migrations/*.sql supabase/verify.sql

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned on purpose: `latest` makes setup-cli resolve the newest release
          # through the unauthenticated GitHub API and dies with
          # "Failed to resolve latest Supabase CLI release: rate limit exceeded"
          # (seen in run 34755552801). Bump deliberately, never implicitly.
          version: 2.117.0

      - name: Record CLI version and ensure supabase/config.toml exists
        run: |
          set -euo pipefail
          echo "supabase CLI: $(supabase --version 2>&1 | head -1)"
          if [ ! -f supabase/config.toml ]; then
            supabase init --force
            echo "Created a default supabase/config.toml for the CLI (no SQL file was touched)."
          fi
          sha256sum supabase/migrations/*.sql

      - name: Pre-flight — what can this token actually do?
        id: preflight
        run: |
          set -uo pipefail
          ref="${PROJECT_REF:?the project_ref input is empty}"
          tmp="$RUNNER_TEMP/preflight"; mkdir -p "$tmp"
          CODE=000; BODY=""

          api_get() {  # $1 = path -> sets CODE and BODY, never fails the step
            local resp
            resp=$(curl -sS -m 30 \
                     -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                     -H "Accept: application/json" \
                     -w $'\n%{http_code}' \
                     "https://api.supabase.com$1" 2>"$tmp/curl.err") || true
            CODE="${resp##*$'\n'}"
            BODY="${resp%$'\n'*}"
            case "$CODE" in ''|*[!0-9]*) CODE="000" ;; esac
          }
          api_post() {  # $1 = path, $2 = json body -> sets CODE and BODY
            local resp
            resp=$(curl -sS -m 60 -X POST \
                     -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                     -H "Accept: application/json" \
                     -H "Content-Type: application/json" \
                     -d "$2" \
                     -w $'\n%{http_code}' \
                     "https://api.supabase.com$1" 2>"$tmp/curl.err") || true
            CODE="${resp##*$'\n'}"
            BODY="${resp%$'\n'*}"
            case "$CODE" in ''|*[!0-9]*) CODE="000" ;; esac
          }

          echo "== 1/5  Does project ref '$ref' exist? (public probe, no credentials used) =="
          rest=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://${ref}.supabase.co/rest/v1/" 2>/dev/null) || rest="000"
          echo "https://${ref}.supabase.co/rest/v1/ -> HTTP ${rest}"
          echo "::notice title=probe rest/v1::https://${ref}.supabase.co/rest/v1/ -> HTTP ${rest}"
          rest_headers=$(curl -s -D - -o /dev/null -m 20 "https://${ref}.supabase.co/rest/v1/" 2>/dev/null | tr -d '\r' | grep -iE '^(server|x-|cf-|via)' | head -8 | tr '\n' '; ')
          [ -n "$rest_headers" ] && echo "response headers: ${rest_headers}"
          ref_exists=yes
          if [ "$rest" = "000" ]; then
            ref_exists=no
            echo "::warning::That hostname did not answer at all — the ref is mistyped, or the project is paused/deleted."
          else
            echo "The API gateway answered, so the ref itself is real."
          fi

          echo
          echo "== 2/5  Token -> Management API =="
          api_get "/v1/projects"
          projects_code="$CODE"; projects_body="$BODY"
          token_valid=false
          if [ "$projects_code" = "200" ]; then
            token_valid=true
            n=$(printf '%s' "$projects_body" | jq -r 'if type=="array" then length else 0 end' 2>/dev/null || echo "?")
            echo "GET /v1/projects -> 200 — the token is accepted and can see ${n} project(s)."
            if [ "$SHOW_NAMES" = "true" ]; then
              printf '%s' "$projects_body" | jq -r '.[]? | "    - \(.id // .ref)  name=\(.name)  status=\(.status)  org=\(.organization_slug // .organization_id)"'
            else
              printf '%s' "$projects_body" | jq -r '.[]? | "    - \(.id // .ref)  status=\(.status)"'
            fi
          else
            echo "GET /v1/projects -> HTTP ${projects_code}"
            [ -s "$tmp/curl.err" ] && sed 's/^/  curl: /' "$tmp/curl.err"
            printf '%s' "$projects_body" | head -c 400; echo
          fi
          echo "::notice title=api /v1/projects::HTTP ${projects_code}"

          api_get "/v1/organizations"
          echo "GET /v1/organizations -> HTTP ${CODE}"
          if [ "$CODE" = "200" ] && [ "$SHOW_NAMES" = "true" ]; then
            printf '%s' "$BODY" | jq -r '.[]? | "    - \(.id)  \(.name)"'
          fi

          echo
          echo "== 3/5  This project, as seen by this token =="
          api_get "/v1/projects/${ref}"
          proj_code="$CODE"; proj_body="$BODY"
          echo "::notice title=api /v1/projects/{ref}::HTTP ${proj_code}"
          project_visible=false; region=""; pstatus=""; pname=""; pgver=""
          if [ "$proj_code" = "200" ]; then
            project_visible=true
            region=$(printf '%s' "$proj_body"  | jq -r '.region // empty' 2>/dev/null) || region=""
            pstatus=$(printf '%s' "$proj_body" | jq -r '.status // empty' 2>/dev/null) || pstatus=""
            pname=$(printf '%s' "$proj_body"   | jq -r '.name // empty'   2>/dev/null) || pname=""
            pgver=$(printf '%s' "$proj_body"   | jq -r '(.postgres_version // .database_version // .pg_version // (.database.version? ) // empty) | tostring' 2>/dev/null) || pgver=""
            # Key NAMES only (never values) — enough to spot where the version lives
            # without printing anything sensitive about the project.
            proj_keys=$(printf '%s' "$proj_body" | jq -r 'if type=="object" then (keys_unsorted | join(",")) else "not-an-object" end' 2>/dev/null) || proj_keys=""
            echo "GET /v1/projects/${ref} -> 200   status=${pstatus:-?}   region=${region:-?}   postgres=${pgver:-?}"
            if [ "$SHOW_NAMES" = "true" ] && [ -n "$pname" ]; then
              echo "project name: $pname"
            fi
          else
            echo "GET /v1/projects/${ref} -> HTTP ${proj_code}"
            printf '%s' "$proj_body" | head -c 300; echo
          fi

          echo
          echo "== 4/5  The endpoint 'supabase link' depends on =="
          api_get "/v1/projects/${ref}/api-keys?reveal=false"
          akeys_code="$CODE"
          echo "::notice title=api /v1/projects/{ref}/api-keys::HTTP ${akeys_code}"
          link_api_ok=false
          case "$akeys_code" in 2*) link_api_ok=true ;; esac
          echo "GET /v1/projects/${ref}/api-keys -> HTTP ${akeys_code}"

          echo
          echo "== 5/5  The project's REAL pooler connection (read, never templated) =="
          api_get "/v1/projects/${ref}/config/database/pooler"
          pooler_code="$CODE"; pooler_body="$BODY"
          echo "GET /v1/projects/${ref}/config/database/pooler -> HTTP ${pooler_code}"
          echo "::notice title=api pooler-config::HTTP ${pooler_code}"
          pooler_host=""; pooler_port=""; pooler_user=""; pool_mode=""
          if [ "$pooler_code" = "200" ]; then
            # array with one entry per database; the CLI uses the PRIMARY one
            entry=$(printf '%s' "$pooler_body" | jq -c 'if type=="array" then (map(select((.database_type // "")=="PRIMARY"))[0] // .[0]) else . end' 2>/dev/null) || entry=""
            if [ -n "$entry" ] && [ "$entry" != "null" ]; then
              pooler_host=$(printf '%s' "$entry" | jq -r '.db_host // empty' 2>/dev/null) || pooler_host=""
              pooler_port=$(printf '%s' "$entry" | jq -r '.db_port // empty' 2>/dev/null) || pooler_port=""
              pooler_user=$(printf '%s' "$entry" | jq -r '.db_user // empty' 2>/dev/null) || pooler_user=""
              pool_mode=$(printf '%s' "$entry" | jq -r '(.pool_mode // .db_pool_mode // empty)' 2>/dev/null) || pool_mode=""
              echo "pooler PRIMARY: ${pooler_user:-?}@${pooler_host:-?}:${pooler_port:-?}  pool_mode=${pool_mode:-?}"
              echo "::notice title=pooler PRIMARY::${pooler_user:-?}@${pooler_host:-?}:${pooler_port:-?} pool_mode=${pool_mode:-?}"
              printf '%s' "$pooler_body" | jq -c 'if type=="array" then map({database_type, db_host, db_port, db_user, pool_mode}) else . end' 2>/dev/null | sed 's/^/  entries: /'
            else
              echo "  no usable entry in the response"
            fi
          else
            printf '%s' "$pooler_body" | head -c 300; echo
          fi
          if [ -z "$pooler_host" ]; then
            echo "::warning::The pooler host could not be read (HTTP ${pooler_code}). Pass it manually: Dashboard > Connect > Session pooler, then run this workflow with db_host/db_port."
          fi

          echo
          echo "== 6/6  Temporary access (JIT) — can the ACCESS TOKEN be used as the DB credential? =="
          # Supabase "temporary access" lets a Personal Access Token be used as the
          # Postgres password. It is validated LIVE against Supabase on every
          # connection instead of against Supavisor's cached copy of the role
          # password, so it is immune to the stale-pooler-cache failure that makes
          # a freshly reset database password get rejected on every pooler port
          # (supabase/supabase#44210). Supabase's own docs recommend exactly this
          # for CI: "generate API tokens for services you don't want to share your
          # Postgres role password with (for example a GitHub Action)".
          api_get "/v1/projects/${ref}/jit-access"
          jit_code="$CODE"; jit_body="$BODY"
          jit_state=""
          echo "GET /v1/projects/${ref}/jit-access -> HTTP ${jit_code}"
          echo "::notice title=api jit-access::HTTP ${jit_code}"
          if [ "$jit_code" = "200" ]; then
            jit_state=$(printf '%s' "$jit_body" | jq -r '(.state // (if .enabled == true then "enabled" elif .enabled == false then "disabled" else empty end) // empty)' 2>/dev/null) || jit_state=""
            echo "temporary access state: ${jit_state:-unknown}"
            printf '%s' "$jit_body" | jq -c 'if type=="object" then (del(.users) | .) else . end' 2>/dev/null | head -c 300 | sed 's/^/  body: /'; echo
          else
            echo "  (a scoped PAT may not be allowed to read this; the probe still TRIES the token)"
            printf '%s' "$jit_body" | head -c 200; echo
          fi
          if [ "$jit_state" != "enabled" ]; then
            echo "::notice title=temporary access::not confirmed enabled (HTTP ${jit_code}, state='${jit_state:-unknown}'). Enable it at Dashboard > Project Settings > Database > 'Enable temporary access', or: curl -X PUT https://api.supabase.com/v1/projects/${ref}/jit-access -H \"Authorization: Bearer \$TOKEN\" -H 'Content-Type: application/json' -d '{\"state\":\"enabled\"}'. Needs Postgres >= 17.6.1.081 (this project reports '${pgver:-unknown}') and SSL enforcement on; then authorise your user to assume the 'postgres' role."
          fi

          echo
          echo "== 7/7  Can this token run READ-ONLY SQL through the Management API? =="
          # POST /v1/projects/{ref}/database/query is the endpoint the Dashboard's
          # own SQL editor uses. It authenticates with the ACCESS TOKEN alone — no
          # database password, no pooler, no IPv6 — and accepts read_only:true. A
          # fine-grained PAT needs the database_read (or database_write) permission.
          # When it answers, a dry-run report can be produced even while every
          # Postgres credential path is broken, which is exactly this project's
          # situation: the password is refused by Supavisor on both ports, the
          # direct host is IPv6-only, and temporary access reports 'unavailable'.
          api_post "/v1/projects/${ref}/database/query" '{"query":"select 1 as ok","read_only":true}'
          mgmt_code="$CODE"; mgmt_body="$BODY"
          mgmt_sql_ok=false
          echo "POST /v1/projects/${ref}/database/query (read_only) -> HTTP ${mgmt_code}"
          echo "::notice title=api database/query::HTTP ${mgmt_code}"
          case "$mgmt_code" in
            200|201) mgmt_sql_ok=true
                     echo "  the access token CAN run read-only SQL — a dry-run report is possible without the database password."
                     printf '%s' "$mgmt_body" | head -c 200 | sed 's/^/  probe result: /'; echo ;;
            403)     echo "  refused (403): this fine-grained PAT lacks the database_read permission."
                     echo "::notice title=fix available::Grant this token the 'database_read' permission (https://supabase.com/dashboard/account/tokens) and the dry-run works with NO database password at all — it bypasses Supavisor, the pooler ports and the IPv6-only direct host." ;;
            *)       printf '%s' "$mgmt_body" | head -c 300; echo ;;
          esac

          # ---- verdict ------------------------------------------------------
          verdict=ok
          action="None — token, project and API access all look healthy."
          if [ "$token_valid" != "true" ] && [ "$project_visible" != "true" ]; then
            if [ "$SB_TOKEN_IS_PAT" != "yes" ]; then
              verdict=wrong-token-type
              action="Replace the GitHub secret SUPABASE_ACCESS_TOKEN with a personal access token created at https://supabase.com/dashboard/account/tokens (it must start with sbp_). The stored value is a ${SB_TOKEN_CLASS}, which the Supabase CLI / Management API cannot use."
            elif [ "$projects_code" = "403" ]; then
              verdict=token-forbidden
              action="The token is valid but forbidden (403): it was created by a different Supabase account/organization than the owner of project ${ref}, or it is a scoped PAT without 'Project Settings: Read'. Sign in to the account that owns the project, create a CLASSIC token at https://supabase.com/dashboard/account/tokens, and update the secret."
            elif [ "$projects_code" = "000" ]; then
              verdict=api-unreachable
              action="api.supabase.com could not be reached from the runner — just re-run the workflow."
            else
              verdict=token-rejected
              action="The token was rejected (HTTP ${projects_code}): expired, revoked, or copied incompletely. Create a new one at https://supabase.com/dashboard/account/tokens and update the secret. Stored fingerprint sha256:${SB_TOKEN_FP}."
            fi
          elif [ "$project_visible" != "true" ] && [ "$projects_code" = "403" ]; then
            verdict=token-scoped-too-narrow
            action="The token is accepted but every project call is 403: it is a scoped/fine-grained PAT without 'Project Settings: Read' (or it belongs to another Supabase account). In the SAME account that owns project ${ref}, create a CLASSIC personal access token at https://supabase.com/dashboard/account/tokens (leave permissions at full access) and store it as the GitHub secret SUPABASE_ACCESS_TOKEN."
          elif [ "$project_visible" != "true" ]; then
            verdict=project-not-visible
            action="The token works but this account cannot see project ${ref}. While signed in to the SAME account that created the token, open https://supabase.com/dashboard/project/${ref}/settings/general — if that 404s, the ref is wrong or belongs to another account; copy the ref from that URL into the workflow input."
          elif [ -n "$pstatus" ] && [ "$pstatus" != "ACTIVE_HEALTHY" ]; then
            verdict=project-unhealthy
            action="Project status is ${pstatus}. Restore it first (Dashboard > Project Settings > General > Restore project); a paused project refuses migrations."
          fi

          if [ "$project_visible" = "true" ] && [ "$link_api_ok" != "true" ]; then
            echo
            echo "::warning::'supabase link' will fail on the api-keys endpoint (HTTP ${akeys_code})."
            echo "::warning::With a scoped PAT that is Supabase bug supabase/supabase#50244 — no scoped token can pass it."
            echo "::warning::Not fatal here: this workflow pushes over a direct Postgres URL instead of linking."
            if [ "$verdict" = "ok" ]; then
              action="Optional only: create a CLASSIC personal access token (https://supabase.com/dashboard/account/tokens, permissions left at full access) so that 'supabase link' works again. The dry-run/apply below does not need it."
            fi
          fi

          if [ "$token_valid" != "true" ] && [ "$project_visible" = "true" ]; then
            echo "::notice title=token scope::GET /v1/projects is denied (HTTP ${projects_code}) but GET /v1/projects/${ref} works — enough to resolve the region; 'supabase link' will still fail."
            if [ "$verdict" = "ok" ]; then
              action="Optional: this token cannot list projects (HTTP ${projects_code}). A CLASSIC personal access token from https://supabase.com/dashboard/account/tokens also makes 'supabase link' work again."
            fi
          fi

          echo
          echo "verdict: $verdict"
          echo "::notice title=preflight verdict::${verdict} | projects=${projects_code} project=${proj_code} api-keys=${akeys_code} rest=${rest} | status=${pstatus:-?} region=${region:-?}"
          {
            echo "token_valid=$token_valid"
            echo "project_visible=$project_visible"
            echo "project_status=$pstatus"
            echo "region=$region"
            echo "link_api_ok=$link_api_ok"
            echo "ref_exists=$ref_exists"
            echo "pooler_host=$pooler_host"
            echo "pooler_port=$pooler_port"
            echo "pooler_user=$pooler_user"
            echo "pool_mode=$pool_mode"
            echo "mgmt_sql_ok=$mgmt_sql_ok"
            echo "mgmt_sql_code=$mgmt_code"
            echo "jit_state=$jit_state"
            echo "jit_code=$jit_code"
            echo "postgres_version=$pgver"
            echo "project_body_keys=$proj_keys"
            echo "api_codes=projects:${projects_code} project:${proj_code} api-keys:${akeys_code} pooler:${pooler_code} jit:${jit_code} query:${mgmt_code} rest:${rest}"
            echo "verdict=$verdict"
            echo "manual_action=$action"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the Postgres endpoint to work against
        id: endpoint
        env:
          INPUT_DB_HOST: ${{ inputs.db_host }}
          INPUT_DB_PORT: ${{ inputs.db_port }}
          PREFLIGHT_REGION: ${{ steps.preflight.outputs.region }}
          POOLER_HOST: ${{ steps.preflight.outputs.pooler_host }}
          POOLER_PORT: ${{ steps.preflight.outputs.pooler_port }}
          POOLER_USER: ${{ steps.preflight.outputs.pooler_user }}
          POOL_MODE: ${{ steps.preflight.outputs.pool_mode }}
        run: |
          set -euo pipefail
          ref="$PROJECT_REF"

          # Build an ORDERED candidate list instead of betting everything on one
          # host:port pair. Fields are separated by ';' and entries by ' ':
          #   host;port;user;label
          #
          # The previous version hard-coded port 5432 here and threw away the port
          # the Management API had just reported ("API reported 6543/transaction,
          # using 5432 for migrations"). GET /v1/projects/{ref}/config/database/pooler
          # is the authority on what THIS project actually serves; overriding it
          # meant a single wrong guess aborted the whole run and was then reported
          # as "SUPABASE_DB_PASSWORD is not this project's database password".
          cands=""
          ckeys=""
          add() {  # host port user label   (label is space-sanitised: the list is
                   # space-separated, so a space inside a label would split an entry)
            [ -n "$1" ] || return 0
            local l="${4//[[:space:]]/-}"
            local k="$1;$2;$3"
            # de-duplicate on host;port;user — the label is only cosmetic, and a
            # repeated endpoint would waste one of the bounded attempts
            case " $ckeys " in *" $k "*) return 0 ;; esac
            ckeys="${ckeys:+$ckeys }$k"
            cands="${cands:+$cands }$k;$l"
          }

          if [ -n "$INPUT_DB_HOST" ]; then
            # An explicit operator input outranks everything and is tried first.
            case "$INPUT_DB_HOST" in
              *pooler.supabase.com) iuser="postgres.${ref}" ;;
              *)                    iuser="postgres" ;;
            esac
            add "$INPUT_DB_HOST" "${INPUT_DB_PORT:-5432}" "$iuser" "workflow input"
          fi

          if [ -n "$POOLER_HOST" ]; then
            puser="${POOLER_USER:-postgres.${ref}}"
            pport="${POOLER_PORT:-5432}"
            # 1. the shared SESSION pooler (IPv4) on port 5432 FIRST — the
            #    operator-specified migration target. Transaction mode (6543) does
            #    not support the prepared statements migrations and the CLI rely
            #    on, so the API-advertised port is no longer tried first.
            if [ -z "$INPUT_DB_PORT" ]; then
              add "$POOLER_HOST" 5432 "$puser" "pooler-session/5432"
            fi
            # 2. exactly what the API advertised — kept in the list as a fallback,
            #    never second-guessed, just demoted behind session mode.
            add "$POOLER_HOST" "${INPUT_DB_PORT:-$pport}" "$puser" "api-pooler/${POOL_MODE:-?}"
            # 3. if the API advertised session mode itself, transaction mode on the
            #    SAME host still gets one fallback attempt.
            if [ -z "$INPUT_DB_PORT" ]; then
              case "$pport" in
                5432) add "$POOLER_HOST" 6543 "$puser" "pooler-transaction/6543" ;;
              esac
            fi
          fi

          # 3. the direct connection (IPv6-only unless the project has the IPv4
          #    add-on, so it is a fallback rather than a preference)
          add "db.${ref}.supabase.co" "${INPUT_DB_PORT:-5432}" "postgres" "direct"

          # 4. only when the API gave us no pooler config at all: try the templated
          #    regional hosts. These are NOT universal, hence last.
          if [ -z "$POOLER_HOST" ] && [ -n "$PREFLIGHT_REGION" ]; then
            add "aws-0-${PREFLIGHT_REGION}.pooler.supabase.com" "${INPUT_DB_PORT:-5432}" "postgres.${ref}" "templated/aws-0"
            add "aws-1-${PREFLIGHT_REGION}.pooler.supabase.com" "${INPUT_DB_PORT:-6543}" "postgres.${ref}" "templated/aws-1"
          fi

          # First candidate is the default for every later step; the probe step
          # overrides SB_DB_* if a different candidate is the one that authenticates.
          first="${cands%% *}"
          host="${first%%;*}"; rest="${first#*;}"
          port="${rest%%;*}"; rest="${rest#*;}"
          user="${rest%%;*}"; label="${rest#*;}"

          n=$(printf '%s' "$cands" | wc -w)
          echo "${n} endpoint candidate(s), in order:"
          for c in $cands; do
            ch="${c%%;*}"; cr="${c#*;}"; cp="${cr%%;*}"; cr="${cr#*;}"
            cu="${cr%%;*}"; cl="${cr#*;}"
            echo "  - ${cu}@${ch}:${cp}  (${cl})"
          done
          echo "::notice title=endpoint candidates::${n} — first: ${user}@${host}:${port} (${label}); API pooler said ${POOLER_PORT:-?}/${POOL_MODE:-?}"
          {
            echo "SB_DB_HOST=$host"
            echo "SB_DB_PORT=$port"
            echo "SB_DB_USER=$user"
            echo "SB_DB_CANDIDATES=$cands"
          } >> "$GITHUB_ENV"
          {
            echo "db_host=$host"
            echo "db_port=$port"
            echo "db_user=$user"
            echo "db_candidates=$n"
          } >> "$GITHUB_OUTPUT"

      - name: Probe the database (read-only, also validates SUPABASE_DB_PASSWORD)
        id: probe
        env:
          # The secret is read again here so that the ALTERNATIVE normalisations can
          # be tried without ever persisting more than one password into GITHUB_ENV.
          RAW_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          JIT_STATE: ${{ steps.preflight.outputs.jit_state }}
          JIT_CODE: ${{ steps.preflight.outputs.jit_code }}
          POSTGRES_VERSION: ${{ steps.preflight.outputs.postgres_version }}
          POOLER_PORT_KNOWN: ${{ steps.preflight.outputs.pooler_port }}
        run: |
          set -uo pipefail
          nl=$'\n'; cr=$'\r'
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          echo "::add-mask::$RAW_PASSWORD"
          export PGSSLMODE=require PGCONNECT_TIMEOUT=15
          errfile="$RUNNER_TEMP/psql.err"

          outfile="$RUNNER_TEMP/psql.out"
          try() {  # host port user password [options] — credential travels via env, never argv
            # Verifies connectivity AND runs the operator's check query. Role and
            # database names are not secrets and are surfaced on success.
            if [ -n "${5:-}" ]; then
              PGPASSWORD="$4" PGOPTIONS="$5" psql -h "$1" -p "$2" -U "$3" -d postgres -At -F'|' -c 'SELECT current_user, current_database();' >"$outfile" 2>"$errfile"
            else
              PGPASSWORD="$4" psql -h "$1" -p "$2" -U "$3" -d postgres -At -F'|' -c 'SELECT current_user, current_database();' >"$outfile" 2>"$errfile"
            fi
          }

          K=""; D=""; MSG=""
          classify() {  # read $errfile, set K (kind), D (operator guidance), MSG (raw)
            MSG=$(head -3 "$errfile" 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g')
            local low; low=$(printf '%s' "$MSG" | tr '[:upper:]' '[:lower:]')
            case "$low" in
              *"circuit breaker"*)
                K=CIRCUIT_BREAKER
                D="Supavisor's auth circuit breaker is OPEN for this tenant because of repeated failed logins. Stop retrying, wait 10-15 minutes without any attempt, then run once more." ;;
              *"password authentication failed"*)
                K=AUTH
                D="The pooler resolved the tenant/user and then rejected the credential, so the endpoint is right and only the password value is in question." ;;
              *"tenant or user not found"*|*"tenant/user"*|*"enotfound"*)
                K=TENANT
                D="This host:port does not know that tenant/user — wrong project ref, wrong pooler cluster, this pool mode is not enabled for the project, or the project is paused." ;;
              *"could not translate host name"*|*"name or service not known"*|*"nodename nor servname"*)
                K=DNS
                D="The host does not resolve — wrong project ref/region, or the project is paused/deleted." ;;
              *"network is unreachable"*|*"no route to host"*)
                K=NET
                D="Not reachable over IPv4 from the runner (Supabase direct connections can be IPv6-only). Use the shared pooler host." ;;
              *"connection refused"*|*"timed out"*|*"timeout"*)
                K=REFUSED
                D="Nothing answered on that host:port — wrong port for this project, IPv4 direct access off, or the project is paused." ;;
              *"no pg_hba.conf entry"*|*"ssl connection"*|*"certificate"*|*"self signed"*)
                K=TLS
                D="TLS/pg_hba rejection — connect with sslmode=require to the shared pooler." ;;
              *)
                K=OTHER
                D="psql could not establish the connection." ;;
            esac
          }

          # ---- password variants -------------------------------------------------
          # A GitHub secret is very often NOT byte-identical to the password it is
          # meant to hold: a trailing space, a wrapping quote pair, a stray CR/LF.
          # Supavisor answers "password authentication failed" for all of them, which
          # is indistinguishable from a genuinely wrong password. Instead of guessing
          # which artifact (if any) the operator stored, try the plausible
          # normalisations — de-duplicated and bounded, so the pooler is never
          # hammered hard enough to trip its auth circuit breaker.
          vlabels=(); vvals=(); vfps=()
          add_variant() {  # label value
            local fp known
            fp=$(printf '%s' "$2" | sha256sum | cut -c1-12)
            if [ ${#vfps[@]} -gt 0 ]; then
              for known in "${vfps[@]}"; do
                [ "$known" = "$fp" ] && return 0
              done
            fi
            echo "::add-mask::$2"
            vlabels+=("$1"); vvals+=("$2"); vfps+=("$fp")
          }
          add_variant "canonical/normalised" "$SUPABASE_DB_PASSWORD"
          add_variant "raw/as-stored" "$RAW_PASSWORD"
          v=$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          add_variant "whitespace-trimmed" "$v"
          v=$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')
          if [ "${#v}" -ge 2 ]; then
            case "$v" in
              '"'*'"') v="${v#\"}"; v="${v%\"}" ;;
              "'"*"'") v="${v#\'}"; v="${v%\'}" ;;
            esac
          fi
          add_variant "unquoted" "$v"

          echo "password variants (values are never printed — only length and fingerprint):"
          vsum=""
          i=0
          while [ $i -lt ${#vlabels[@]} ]; do
            echo "  [$i] ${vlabels[$i]}: length=${#vvals[$i]} sha256[1:12]=${vfps[$i]}"
            vsum="${vsum}${vsum:+, }${vlabels[$i]}:len=${#vvals[$i]}/${vfps[$i]}"
            i=$((i+1))
          done
          echo "::notice title=password variants::${vsum}"

          # Number of PASSWORD variants — phase B may only iterate over these.
          pw_variants=${#vlabels[@]}

          # The access token is offered as a LAST credential. Supabase "temporary
          # access" (JIT) accepts a Personal Access Token in place of the role
          # password, and validates it LIVE against Supabase on every connection
          # instead of against Supavisor's cached copy of the role password. That
          # makes it immune to the failure mode where a freshly reset database
          # password is rejected on every pooler port for a long time
          # (supabase/supabase#44210 — the Dashboard did not invalidate the pooler
          # cache). Supabase's own docs recommend exactly this for CI:
          #   "generate API tokens for services you don't want to share your Postgres
          #    role password with (for example a GitHub Action)"
          # Shared-pooler connections additionally need options='-c jit=true';
          # direct connections do not.
          jit_index=-1
          # JIT fallback intentionally DISABLED (operator directive, 2026-09-14):
          # this project's /database/jit Management-API endpoints return an
          # undocumented HTTP 406 for BOTH fine-grained and classic PATs, and the
          # database-password path above is the required supported path. Set
          # ALLOW_JIT_FALLBACK=yes to re-enable the old last-resort behaviour.
          if [ "${ALLOW_JIT_FALLBACK:-no}" = "yes" ] && [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ "${SB_TOKEN_IS_PAT:-no}" = "yes" ]; then
            add_variant "jit/access-token" "$SUPABASE_ACCESS_TOKEN"
            jit_index=$(( ${#vlabels[@]} - 1 ))
            if [ "${vlabels[$jit_index]:-}" != "jit/access-token" ]; then jit_index=-1; fi
          fi
          if [ "$jit_index" -ge 0 ]; then
            echo "temporary access (JIT) credential registered as variant [${jit_index}] — it will be tried only if every password credential is refused."
          else
            echo "temporary access (JIT) fallback DISABLED — the database password is the only credential in scope for this run."
          fi

          # ---- attempt loop ------------------------------------------------------
          reachable=false; auth_blocked=no; attempts=0; MAX_ATTEMPTS=9
          auth_endpoint=""; last_kind=""; last_detail=""; last_msg=""; last_where=""
          win_label=""; win_fp=""; win_len=""; winning_pw=""
          SB_DB_JIT=""; jit_opts=""
          # The AUTH answer is the diagnostically important one, and later phases
          # (direct cross-check, JIT) overwrite last_kind — so remember it here.
          pw_auth_where=""; pw_auth_port=""; jit_kinds=""

          probe_once() {  # host port user label variant_index [pgoptions]
            local h="$1" p="$2" u="$3" lbl="$4" vi="$5" opts="${6:-}"
            attempts=$((attempts+1))
            echo "probing ${u}@${h}:${p} (${lbl}) with credential [${vi}] ${vlabels[$vi]}${opts:+ options='${opts}'} …"
            if try "$h" "$p" "$u" "${vvals[$vi]}" "$opts"; then
              ident=$(head -1 "$outfile" 2>/dev/null | tr -d '\r')
              cu="${ident%%|*}"; cd_="${ident#*|}"
              echo "  -> connected and authenticated OK — current_user='${cu}' current_database='${cd_}'"
              echo "::notice title=psql OK ${u}@${h}:${p}::current_user=${cu} current_database=${cd_}"
              return 0
            fi
            classify
            echo "  -> ${K}: ${MSG}"
            echo "::notice title=psql ${u}@${h}:${p} [${vlabels[$vi]}]::${K} — ${MSG}"
            last_kind="$K"; last_detail="$D"; last_msg="$MSG"; last_where="${u}@${h}:${p} (${lbl}, ${vlabels[$vi]})"
            return 1
          }

          # Phase A: the canonical password against the endpoint candidates, in the
          # order the endpoint step established. An AUTH answer already proves the
          # tenant/user resolved on that host:port, so there is no point burning more
          # attempts on other endpoints with the same credential — vary the
          # credential instead (phase B). Anything else (DNS/REFUSED/TENANT) does
          # move on to the next candidate.
          for c in ${SB_DB_CANDIDATES:-}; do
            [ "$attempts" -lt "$MAX_ATTEMPTS" ] || { echo "attempt budget reached"; break; }
            h="${c%%;*}"; r="${c#*;}"; p="${r%%;*}"; r="${r#*;}"; u="${r%%;*}"; lbl="${r#*;}"
            if probe_once "$h" "$p" "$u" "$lbl" 0; then
              reachable=true
              SB_DB_HOST="$h"; SB_DB_PORT="$p"; SB_DB_USER="$u"
              win_label="${vlabels[0]}"; win_fp="${vfps[0]}"; win_len="${#vvals[0]}"; winning_pw="${vvals[0]}"
              break
            fi
            if [ "$last_kind" = "CIRCUIT_BREAKER" ]; then auth_blocked=yes; break; fi
            if [ "$last_kind" = "AUTH" ]; then
              auth_endpoint="$c"; pw_auth_where="${u}@${h}:${p}"; pw_auth_port="$p"
              break
            fi
          done

          # Phase B: same endpoint, alternative normalisations of the stored secret.
          # Only PASSWORD variants are in scope here (0..pw_variants-1) — the JIT
          # variant needs a connection option and is handled in phase D.
          if [ "$reachable" != "true" ] && [ "$auth_blocked" != "yes" ] && [ -n "$auth_endpoint" ] && [ "$pw_variants" -gt 1 ]; then
            h="${auth_endpoint%%;*}"; r="${auth_endpoint#*;}"; p="${r%%;*}"; r="${r#*;}"; u="${r%%;*}"; lbl="${r#*;}"
            echo
            echo "${u}@${h}:${p} resolved the tenant/user but rejected the canonical password."
            echo "Re-trying that SAME endpoint with the alternative normalisations (this is what distinguishes a paste artifact from a genuinely wrong password) …"
            vi=1
            while [ $vi -lt "$pw_variants" ] && [ "$attempts" -lt "$MAX_ATTEMPTS" ]; do
              if probe_once "$h" "$p" "$u" "$lbl" "$vi"; then
                reachable=true
                SB_DB_HOST="$h"; SB_DB_PORT="$p"; SB_DB_USER="$u"
                win_label="${vlabels[$vi]}"; win_fp="${vfps[$vi]}"; win_len="${#vvals[$vi]}"; winning_pw="${vvals[$vi]}"
                break
              fi
              if [ "$last_kind" = "AUTH" ]; then pw_auth_where="${pw_auth_where:-${u}@${h}:${p}}"; fi
              if [ "$last_kind" = "CIRCUIT_BREAKER" ]; then auth_blocked=yes; break; fi
              vi=$((vi+1))
            done
          fi

          # Phase C: the DIRECT connection, even though a pooler already answered
          # AUTH. This is not a redundant retry — it is the decisive diagnostic that
          # Supabase's own troubleshooting guide asks for ("confirm the new password
          # is correct by connecting directly, bypassing the pooler"). Postgres
          # itself and Supavisor keep separate credential stores, so:
          #   direct also refuses -> the value is not the project's password at all
          #   direct accepts      -> Supavisor's cached credential is stale
          # It costs nothing against Supavisor's circuit breaker because it does not
          # touch Supavisor.
          direct_tried=no; direct_kind=""
          if [ "$reachable" != "true" ] && [ "$attempts" -lt "$MAX_ATTEMPTS" ]; then
            for c in ${SB_DB_CANDIDATES:-}; do
              h="${c%%;*}"; r="${c#*;}"; p="${r%%;*}"; r="${r#*;}"; u="${r%%;*}"; lbl="${r#*;}"
              case "$h" in db.*.supabase.co) ;; *) continue ;; esac
              echo
              echo "Cross-checking the password against the DIRECT connection (bypasses Supavisor entirely) …"
              direct_tried=yes
              if probe_once "$h" "$p" "$u" "$lbl" 0; then
                reachable=true
                SB_DB_HOST="$h"; SB_DB_PORT="$p"; SB_DB_USER="$u"
                win_label="${vlabels[0]}"; win_fp="${vfps[0]}"; win_len="${#vvals[0]}"; winning_pw="${vvals[0]}"
              else
                direct_kind="$last_kind"
              fi
              break
            done
          fi

          # Phase D: temporary access (JIT) — the access token as the password.
          # Tried only after every password credential was refused, because it needs
          # a project-side setting (Dashboard > Database > "Enable temporary access")
          # that is off by default. Shared pooler first on 5432 (the port Supabase's
          # docs use for the JIT example), then the API-advertised port, then direct.
          jit_opts=""
          if [ "$reachable" != "true" ] && [ "$jit_index" -ge 0 ] && [ "$attempts" -lt "$MAX_ATTEMPTS" ]; then
            echo
            echo "Every password credential was refused. Trying Supabase TEMPORARY ACCESS (JIT): the access token as the password."
            echo "JIT is validated live against Supabase on each connection, not against Supavisor's cached role password."
            jit_order=""
            for want in 5432 6543 other; do
              for c in ${SB_DB_CANDIDATES:-}; do
                h="${c%%;*}"; r="${c#*;}"; p="${r%%;*}"
                case "$h" in *pooler.supabase.com) ;; *) continue ;; esac
                case "$want" in
                  5432|6543) [ "$p" = "$want" ] || continue ;;
                  other)     { [ "$p" = "5432" ] || [ "$p" = "6543" ]; } && continue ;;
                esac
                case " $jit_order " in *" $c "*) continue ;; esac
                jit_order="${jit_order:+$jit_order }$c"
              done
            done
            for c in ${SB_DB_CANDIDATES:-}; do   # direct connection last, no jit option
              case "${c%%;*}" in db.*.supabase.co) jit_order="${jit_order:+$jit_order }$c" ;; esac
            done
            for c in ${jit_order:-}; do
              [ "$attempts" -lt "$MAX_ATTEMPTS" ] || break
              h="${c%%;*}"; r="${c#*;}"; p="${r%%;*}"; r="${r#*;}"; u="${r%%;*}"; lbl="${r#*;}"
              case "$h" in *pooler.supabase.com) jit_opts="-c jit=true" ;; *) jit_opts="" ;; esac
              if probe_once "$h" "$p" "$u" "jit/${lbl}" "$jit_index" "$jit_opts"; then
                reachable=true
                SB_DB_HOST="$h"; SB_DB_PORT="$p"; SB_DB_USER="$u"; SB_DB_JIT=yes
                win_label="${vlabels[$jit_index]}"; win_fp="${vfps[$jit_index]}"
                win_len="${#vvals[$jit_index]}"; winning_pw="${vvals[$jit_index]}"
                break
              fi
              jit_kinds="${jit_kinds}${jit_kinds:+,}${last_kind}"
              if [ "$last_kind" = "CIRCUIT_BREAKER" ]; then auth_blocked=yes; break; fi
            done
          fi

          if [ "$reachable" = "true" ]; then
            last_kind=""; last_detail=""; last_msg=""
            echo
            echo "working endpoint: ${SB_DB_USER}@${SB_DB_HOST}:${SB_DB_PORT} (credential: ${win_label}, length ${win_len}, sha256[1:12]=${win_fp}, attempts ${attempts}${SB_DB_JIT:+, temporary-access/JIT})"
            echo "::notice title=working endpoint::${SB_DB_USER}@${SB_DB_HOST}:${SB_DB_PORT} | credential='${win_label}' len=${win_len} sha256[1:12]=${win_fp} | attempts=${attempts} | jit=${SB_DB_JIT:-no}"
            {
              echo "SB_DB_HOST=$SB_DB_HOST"
              echo "SB_DB_PORT=$SB_DB_PORT"
              echo "SB_DB_USER=$SB_DB_USER"
            } >> "$GITHUB_ENV"
            if [ "${SB_DB_JIT:-no}" = "yes" ]; then
              # The access token IS the password from here on. It is already masked
              # (the guard step registered it), and PGOPTIONS carries the jit flag so
              # the later psql steps authenticate the same way this probe did.
              echo "::add-mask::$winning_pw"
              {
                echo "SUPABASE_DB_PASSWORD=$winning_pw"
                echo "SB_DB_JIT=yes"
                echo "SB_DB_JIT_OPTS=$jit_opts"
              } >> "$GITHUB_ENV"
              [ -n "$jit_opts" ] && echo "PGOPTIONS=$jit_opts" >> "$GITHUB_ENV"
              echo "::notice title=authenticated via temporary access::The database password was refused everywhere, but the ACCESS TOKEN was accepted through Supabase temporary access (JIT) at ${SB_DB_USER}@${SB_DB_HOST}:${SB_DB_PORT}. SUPABASE_DB_PASSWORD was not usable for this run and was not needed."
              if [ "${JIT_STATE:-}" != "enabled" ]; then
                echo "::warning title=temporary access::JIT worked even though GET /v1/projects/${PROJECT_REF}/jit-access reported '${JIT_STATE:-unknown}' (HTTP ${JIT_CODE:-?})."
              fi
            elif [ "$win_fp" != "${SB_PW_FP:-}" ]; then
              # Only the value that actually authenticated may be promoted, and never
              # through the single-line GITHUB_ENV form if it somehow holds a newline.
              case "$winning_pw" in
                *"$nl"*|*"$cr"*)
                  echo "::warning title=SUPABASE_DB_PASSWORD::variant '${win_label}' authenticated but contains CR/LF; not re-exported." ;;
                *)
                  echo "::add-mask::$winning_pw"
                  echo "SUPABASE_DB_PASSWORD=$winning_pw" >> "$GITHUB_ENV"
                  echo "::warning title=SUPABASE_DB_PASSWORD::The stored secret only authenticated after '${win_label}' (length ${win_len}, sha256[1:12]=${win_fp}). The secret holds extra characters around the real password — re-save it in Settings > Secrets and variables > Actions as exactly the password, with no quotes and no trailing space."
              esac
            fi
          fi

          db_error=""
          if [ "$reachable" != "true" ]; then
            if [ -n "$pw_auth_where" ]; then
              # The pooler resolved the tenant/user and THEN rejected the credential.
              # That is the informative case, and it must not be masked by whatever
              # the later direct/JIT attempts happened to fail with.
              db_error="The connection method is correct — Supavisor resolved the tenant/user and then refused the CREDENTIAL. At ${pw_auth_where} (port ${pw_auth_port}) every one of the ${pw_variants} stored-password normalisation(s) was rejected with 'password authentication failed for user \"postgres\"' (${vsum}). Host, username format (postgres.${PROJECT_REF}), TLS and the API-advertised port are therefore all fine."
              if [ "$direct_tried" = "yes" ]; then
                if [ "$direct_kind" = "AUTH" ]; then
                  db_error="${db_error} The DIRECT connection (db.${PROJECT_REF}.supabase.co, which bypasses Supavisor and asks Postgres itself) ALSO refused it — that rules out a stale pooler cache: the value in the GitHub secret is not this project's current database password. Stored: length ${#SUPABASE_DB_PASSWORD}, sha256[1:12]=${SB_PW_FP:-?}, edges ${SB_PW_EDGE:-?}, normalisation '${SB_PW_FIXES:-?}'."
                else
                  db_error="${db_error} The direct cross-check that would separate 'wrong value' from 'stale Supavisor cache' could not run: db.${PROJECT_REF}.supabase.co answered '${direct_kind:-unavailable}' (IPv6-only without the IPv4 add-on, so IPv4 runners cannot reach it)."
                fi
              fi
              if [ "$jit_index" -ge 0 ]; then
                case ",${jit_kinds}," in
                  *,AUTH,*) db_error="${db_error} Temporary access (JIT) with the access token was ALSO refused (classes: ${jit_kinds}), so it is not enabled for this project/user — GET /v1/projects/${PROJECT_REF}/jit-access returned HTTP ${JIT_CODE:-?}, state '${JIT_STATE:-unknown}'." ;;
                  *)        db_error="${db_error} Temporary access (JIT) with the access token did not succeed either (classes: ${jit_kinds:-none}); GET /v1/projects/${PROJECT_REF}/jit-access returned HTTP ${JIT_CODE:-?}, state '${JIT_STATE:-unknown}'." ;;
                esac
                db_error="${db_error} RECOMMENDED FIX — the one Supabase documents for CI ('generate API tokens for services you don't want to share your Postgres role password with, for example a GitHub Action'): enable temporary access at Dashboard > Project Settings > Database > 'Enable temporary access', then authorise your user to assume the 'postgres' role. It is validated live per connection instead of against Supavisor's cached role password, so it sidesteps this failure entirely. Needs Postgres >= 17.6.1.081 (project reports '${POSTGRES_VERSION:-unknown}') and SSL enforcement on. This workflow retries that path automatically on every run."
              fi
              db_error="${db_error} Attempts: ${attempts} (bounded; stopped early so Supavisor's auth circuit breaker is not tripped). Do NOT rotate the password again — each rotation re-opens the pooler-cache window and repeated failures can trip that breaker."
            elif [ "$last_kind" = "CIRCUIT_BREAKER" ] || [ "$auth_blocked" = "yes" ]; then
              db_error="Supavisor's auth circuit breaker is open for this tenant (${last_msg}). ${last_detail}"
            elif [ -n "$last_kind" ]; then
              db_error="No endpoint accepted a connection (${last_where}): ${last_detail} Raw: ${last_msg}"
            else
              db_error="No endpoint candidates were produced — check the 'Resolve the Postgres endpoint' step."
            fi
            echo "::warning::${db_error}"
          fi
          {
            echo "db_reachable=$reachable"
            echo "db_attempts=$attempts"
            echo "db_pw_variant=$win_label"
            echo "db_last_kind=$last_kind"
            echo "db_direct_kind=$direct_kind"
            echo "db_pw_auth_at=$pw_auth_where"
            echo "db_jit_kinds=$jit_kinds"
            echo "db_jit=${SB_DB_JIT:-no}"
            echo "db_error=$db_error"
          } >> "$GITHUB_OUTPUT"
      - name: supabase link — diagnostic only, no longer a hard requirement
        id: link
        if: steps.guard.outputs.token_is_pat == 'yes'
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          if supabase link --project-ref "$PROJECT_REF"; then
            echo "supabase link succeeded."
            echo "link_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::supabase link failed. With a scoped PAT that is Supabase bug supabase/supabase#50244; it is not fatal here because the steps below use --db-url."
            echo "link_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Fail fast when neither the Management API nor Postgres can be reached
        if: steps.probe.outputs.db_reachable != 'true' && steps.link.outputs.link_ok != 'true' && steps.preflight.outputs.mgmt_sql_ok != 'true'
        env:
          ACTION_NEEDED: ${{ steps.preflight.outputs.manual_action }}
          DB_ERROR: ${{ steps.probe.outputs.db_error }}
          DB_KIND: ${{ steps.probe.outputs.db_last_kind }}
          DB_PW_AUTH_AT: ${{ steps.probe.outputs.db_pw_auth_at }}
          DB_JIT_KINDS: ${{ steps.probe.outputs.db_jit_kinds }}
          MGMT_SQL_CODE: ${{ steps.preflight.outputs.mgmt_sql_code }}
          API_CODES: ${{ steps.preflight.outputs.api_codes }}
          PW_SHAPE: ${{ steps.guard.outputs.pw_shape }}
          POOLER_HOST: ${{ steps.preflight.outputs.pooler_host }}
          DB_DIRECT_KIND: ${{ steps.probe.outputs.db_direct_kind }}
          DB_ATTEMPTS: ${{ steps.probe.outputs.db_attempts }}
          DB_JIT: ${{ steps.probe.outputs.db_jit }}
          JIT_STATE: ${{ steps.preflight.outputs.jit_state }}
          JIT_CODE: ${{ steps.preflight.outputs.jit_code }}
          POSTGRES_VERSION: ${{ steps.preflight.outputs.postgres_version }}
          PW_FIXES: ${{ steps.guard.outputs.pw_fixes }}
          PW_EDGE: ${{ steps.guard.outputs.pw_edge }}
          PW_FP: ${{ steps.guard.outputs.pw_fp }}
          PW_RAW_FP: ${{ steps.guard.outputs.pw_raw_fp }}
          TOKEN_VALID: ${{ steps.preflight.outputs.token_valid }}
          PROJECT_VISIBLE: ${{ steps.preflight.outputs.project_visible }}
          VERDICT: ${{ steps.preflight.outputs.verdict }}
        run: |
          set -uo pipefail
          echo "::error::No working path to project ${PROJECT_REF} yet (verdict: ${VERDICT}). Nothing was written to the database."
          if [ -n "$DB_ERROR" ]; then echo "::error::Database: ${DB_ERROR}"; fi
          # Non-revealing credential forensics: enough to tell a paste artifact from
          # a genuinely wrong value without ever printing the password.
          echo "::error::Credential forensics: pooler-refused-credential-at=${DB_PW_AUTH_AT:-never} last-failure-class=${DB_KIND:-n/a} direct-connection-class=${DB_DIRECT_KIND:-not-tested} jit-classes=${DB_JIT_KINDS:-none} attempts=${DB_ATTEMPTS:-0} | secret-as-stored sha256[1:12]=${PW_RAW_FP:-?} | after-normalisation sha256[1:12]=${PW_FP:-?} | normalisation applied='${PW_FIXES:-?}' | edge characters: ${PW_EDGE:-?} | temporary-access(JIT)=state '${JIT_STATE:-unknown}' (HTTP ${JIT_CODE:-?}), used=${DB_JIT:-no} | postgres=${POSTGRES_VERSION:-unknown}"
          if [ -n "${DB_PW_AUTH_AT:-}" ] && [ "${PW_FIXES:-none}" = "none" ]; then
            echo "::error::The stored secret is byte-clean (no quotes, no stray whitespace, no CR/LF) and was still refused, so this is NOT a paste artifact and NOT a port/username/endpoint problem — Supavisor resolved the tenant/user and then rejected the credential itself."
            if [ "${DB_DIRECT_KIND:-}" = "AUTH" ]; then
              echo "::error::The direct connection (bypassing Supavisor) rejected it too, which rules out a stale pooler cache: the value stored in GitHub is not this project's current database password."
            else
              echo "::error::The direct connection could not confirm this (class '${DB_DIRECT_KIND:-not-tested}'), so a stale Supavisor credential cache after the recent rotation is still possible — re-run ONCE after a few minutes before touching the password. Do not rotate again: each rotation re-opens that window and repeated failures can trip the auth circuit breaker."
            fi
            echo "::error::Recommended fix: verify the value in the SUPABASE_DB_PASSWORD GitHub secret against Dashboard > Project Settings > Database > Database password (reset it there if unsure, then paste the SAME value into the secret). Do not rotate blindly — each rotation re-opens the pooler-cache window and repeated failures can trip the auth circuit breaker. (The JIT temporary-access fallback is deliberately disabled in this workflow per operator directive: this project's /database/jit Management-API endpoints return an undocumented HTTP 406 for every token class. JIT requires Postgres >= 17.6.1.081 — project reports '${POSTGRES_VERSION:-unknown}') "
          fi
          if [ "$PROJECT_VISIBLE" = "true" ]; then
            echo "::error::The access token CAN read this project, so the access token is not the blocker — fix the database credential/endpoint above and re-run."
          elif [ "$TOKEN_VALID" = "true" ]; then
            echo "::error::The token is accepted but cannot read this project; check the project ref and the token's account."
          elif [ -n "$ACTION_NEEDED" ]; then
            echo "::error::Action needed: ${ACTION_NEEDED}"
          fi

          # Every credential path this workflow knows, what it actually answered on
          # THIS run, and the one action that unblocks it. Cheapest first.
          {
            echo "### Every path tried, and what unblocks it"
            echo
            echo "| # | path | result on this run | what unblocks it |"
            echo "| --- | --- | --- | --- |"
            echo "| 1 | read-only SQL over the Management API (\`POST /v1/projects/${PROJECT_REF}/database/query\`, \`read_only:true\`) — the access token only, no password, no pooler, no IPv6 | HTTP ${MGMT_SQL_CODE:-?} | **Cheapest.** Give the fine-grained PAT the \`database_read\` permission at supabase.com/dashboard/account/tokens (or use a classic PAT). The dry-run then works with NO database password at all. |"
            echo "| 2 | shared pooler ${POOLER_HOST:-?} on BOTH ${POOLER_PORT:-6543} (transaction, as the API advertises) and 5432 (session), user \`postgres.${PROJECT_REF}\`, TLS require | tenant/user resolved, credential refused (${DB_PW_AUTH_AT:-n/a}) | Supavisor's copy of the \`postgres\` role password is not the value in \`SUPABASE_DB_PASSWORD\`. Secret shape: ${PW_SHAPE:-?}. |"
            echo "| 3 | temporary access (JIT): the access token as the password, \`options='-c jit=true'\` | \`GET /jit-access\` -> HTTP ${JIT_CODE:-?}, state '${JIT_STATE:-unknown}'; token refused (${DB_JIT_KINDS:-n/a}) | Needs Postgres >= 17.6.1.081 (project reports '${POSTGRES_VERSION:-unknown}'), then Dashboard > Database > 'Enable temporary access' + authorise your user to assume \`postgres\`. |"
            echo "| 4 | direct connection \`db.${PROJECT_REF}.supabase.co:5432\` (bypasses Supavisor; the check Supabase's docs ask for) | ${DB_DIRECT_KIND:-not tested} — resolves to an IPv6 address, unreachable from IPv4 runners | The IPv4 add-on. Only needed to prove whether the password itself is right; not needed if path 1 is opened. |"
            echo "| 5 | \`supabase link\` (needs \`GET /api-keys\`) | HTTP 403 for a scoped PAT (Supabase bug supabase/supabase#50244) | A classic PAT. Not required — everything here uses \`--db-url\` or the Management API. |"
            echo
            echo "Management API status codes this run: \`${API_CODES:-?}\`"
            echo
            echo "**Nothing was written to the database.** Paths 2-5 are blocked by project/token configuration on the Supabase side, not by this workflow: the endpoint, username format, port and TLS now come straight from the project's own API response, and the stored secret was verified byte-clean."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=cheapest unblock::Grant this fine-grained PAT the 'database_read' permission (supabase.com/dashboard/account/tokens). POST /v1/projects/${PROJECT_REF}/database/query with read_only:true then produces the dry-run using the access token alone — no database password, no pooler port, no IPv6. It returned HTTP ${MGMT_SQL_CODE:-?} on this run."
          exit 1

      - name: Dry run — list pending migrations (never writes)
        id: dryrun
        env:
          DB_REACHABLE: ${{ steps.probe.outputs.db_reachable }}
          LINK_OK: ${{ steps.link.outputs.link_ok }}
          MGMT_SQL_OK: ${{ steps.preflight.outputs.mgmt_sql_ok }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          # percent-encoded connection string, built in-shell so the password is
          # never repeated on a command line and never printed.
          #
          # Port 6543 is Supavisor's TRANSACTION pooler, which does not support the
          # prepared statements / statement cache the CLI's pgx driver uses by
          # default. pgbouncer=true turns that cache off, so a project whose pooler
          # config only advertises transaction mode (which is what the Management
          # API reports for this one) can still be driven by the CLI.
          build_db_url() {
            python3 -c 'import sys, urllib.parse as u; h, prt, usr, pw, jit, opts = sys.argv[1:7]; q = lambda s: u.quote(s, safe=""); e = ("&pgbouncer=true&statement_cache_size=0" if prt == "6543" else "") + (("&options=" + q(opts)) if (jit == "yes" and opts and h.endswith("pooler.supabase.com")) else ""); print("postgresql://%s:%s@%s:%s/postgres?sslmode=require%s" % (q(usr), q(pw), h, prt, e))' \
              "$1" "$2" "$3" "$SUPABASE_DB_PASSWORD" "${SB_DB_JIT:-no}" "${SB_DB_JIT_OPTS:-}"
          }
          url=$(build_db_url "$SB_DB_HOST" "$SB_DB_PORT" "$SB_DB_USER")
          echo "::add-mask::$url"
          echo "target: ${SB_DB_USER}@${SB_DB_HOST}:${SB_DB_PORT}/postgres"
          echo "local migration files: $(ls -1 supabase/migrations/*.sql | wc -l)"
          echo

          ran=false
          LAST_PENDING=""

          # ---- remote migration history: read-only and SQLSTATE 42P01-safe ---------
          # A FRESH Supabase database has no supabase_migrations.schema_migrations
          # table until the first migration is applied. That is the EXPECTED state
          # before the first migration, not an error, and it must never fail the dry
          # run or hide the real report behind a generic "could not produce" error.
          #
          # Why the previous single-statement guard could not work:
          #     select case when to_regclass('supabase_migrations.schema_migrations')
          #                     is null then '(none)'
          #                 else (select string_agg(version, ...) from
          #                         supabase_migrations.schema_migrations) end;
          # PostgreSQL resolves EVERY relation named ANYWHERE in a statement during
          # parse analysis, long before any CASE branch is evaluated — so the missing
          # table still raised SQLSTATE 42P01 ("relation ... does not exist") and the
          # migration-history preflight died on exactly the fresh database it was
          # written to describe.
          #
          # The fix asks about EXISTENCE first — to_regclass() takes a string and
          # returns NULL instead of raising — and reads the rows only in a SECOND
          # statement, once the table is known to exist. VERBOSITY=verbose puts the
          # SQLSTATE into the message, so 42P01 is matched exactly and a missing
          # history table is reported as an EMPTY remote history.
          #
          # Nothing here creates a schema, a table or a row and nothing applies a
          # migration: every statement is a SELECT. `supabase db push` is also
          # deliberately NOT invoked against a database whose history table is
          # missing, because the CLI is free to create that table there and a dry run
          # must create nothing. The dry-run/apply gates below are untouched — apply
          # still requires workflow_dispatch + mode=apply + a confirmed connection.
          HISTORY_STATE=unknown          # missing | empty | applied | unknown
          HISTORY_VERSIONS=""            # comma-separated, no spaces (for matching)
          hist_err="$RUNNER_TEMP/history.err"
          cli_out="$RUNNER_TEMP/cli.out"

          psql_ro() {  # $1 = sql — read-only; credential travels via env, never argv
            PGSSLMODE=require PGCONNECT_TIMEOUT=15 PGPASSWORD="$SUPABASE_DB_PASSWORD" \
              psql -h "$SB_DB_HOST" -p "$SB_DB_PORT" -U "$SB_DB_USER" -d postgres \
                   -X -At -v VERBOSITY=verbose -v ON_ERROR_STOP=1 -qc "$1"
          }

          history_is_missing_error() {  # $1 = captured psql/CLI output
            grep -qE '42P01|3F000|relation "supabase_migrations\.schema_migrations" does not exist' "$1" 2>/dev/null
          }

          read_remote_history() {  # sets HISTORY_STATE / HISTORY_VERSIONS; never writes
            local missing versions
            HISTORY_STATE=unknown; HISTORY_VERSIONS=""
            # 1. existence only — cannot raise 42P01 by construction
            if ! missing=$(psql_ro "select to_regclass('supabase_migrations.schema_migrations') is null" 2>"$hist_err"); then
              if history_is_missing_error "$hist_err"; then
                HISTORY_STATE=missing
                echo "  remote history : MISSING -> EMPTY (SQLSTATE $(grep -oE '42P01|3F000' "$hist_err" | head -1))"
                return 0
              fi
              echo "  remote history : could not be read — $(head -1 "$hist_err" 2>/dev/null)"
              return 1
            fi
            if [ "$missing" = "t" ]; then
              HISTORY_STATE=missing
              echo "  remote history : EMPTY — supabase_migrations.schema_migrations does not exist yet (fresh database)"
              return 0
            fi
            # 2. rows — read only now that the table is known to exist
            if ! versions=$(psql_ro "select coalesce(string_agg(version, ',' order by version), '') from supabase_migrations.schema_migrations" 2>"$hist_err"); then
              if history_is_missing_error "$hist_err"; then  # dropped between the two statements
                HISTORY_STATE=missing
                echo "  remote history : MISSING -> EMPTY (SQLSTATE 42P01 while reading rows)"
                return 0
              fi
              echo "  remote history : could not be read — $(head -1 "$hist_err" 2>/dev/null)"
              return 1
            fi
            HISTORY_VERSIONS="$versions"
            if [ -n "$HISTORY_VERSIONS" ]; then
              HISTORY_STATE=applied
              echo "  remote history : $(printf '%s' "$HISTORY_VERSIONS" | sed 's/,/, /g')"
            else
              HISTORY_STATE=empty
              echo "  remote history : EMPTY — history table exists but holds no rows"
            fi
            return 0
          }

          report_local_vs_remote() {  # $1 = applied versions, comma-separated (may be empty)
            local remote="$1" f v
            LAST_PENDING=""
            echo "  local migration files : $(ls -1 supabase/migrations/*.sql | wc -l)"
            for f in supabase/migrations/*.sql; do
              v=$(basename "$f" .sql); v="${v%%_*}"
              case ",${remote}," in
                *",${v},"*) echo "    already applied : $v" ;;
                *)          LAST_PENDING="${LAST_PENDING}${LAST_PENDING:+ }$v"; echo "    PENDING         : $v" ;;
              esac
            done
            echo "  would be applied by 'mode = apply': ${LAST_PENDING:-nothing (remote is up to date)}"
          }

          fresh_database_report() {  # read-only report for a database with no history yet
            echo "== fresh database: no remote migration history yet — read-only report =="
            echo "  remote history : EMPTY — supabase_migrations.schema_migrations does not exist (SQLSTATE 42P01 is expected before the first migration)"
            report_local_vs_remote ""
            echo "  skipped        : 'supabase db push' — it may create supabase_migrations.schema_migrations, and a dry run creates nothing"
            echo "  created        : nothing — no schema, no table, no row, no migration applied"
            echo "::notice title=dry-run on a fresh database::supabase_migrations.schema_migrations does not exist; SQLSTATE 42P01 treated as EMPTY remote history. Pending='${LAST_PENDING:-none}'. Nothing was created and no migration was applied."
            HISTORY_STATE=missing
            ran=true
          }

          run_cli() {  # $1 = label, rest = command; captures output and classifies 42P01
            local label="$1" rc=0
            shift
            echo "== ${label} =="
            "$@" >"$cli_out" 2>&1 || rc=$?
            sed 's/^/  /' "$cli_out"
            if [ "$rc" -eq 0 ]; then return 0; fi
            if history_is_missing_error "$cli_out"; then
              echo "  -> SQLSTATE 42P01 / missing supabase_migrations.schema_migrations: the remote history is EMPTY (fresh database). Expected before the first migration — not a failure."
              return 2
            fi
            echo "  -> (${label} failed)"
            return 1
          }

          if [ "$DB_REACHABLE" = "true" ]; then
            echo "== remote migration history preflight (read-only, 42P01-safe) =="
            if read_remote_history; then :; fi
            echo
            if [ "$HISTORY_STATE" = "missing" ]; then
              fresh_database_report
            else
              rc=0
              run_cli "supabase migration list (local files vs remote history)" supabase migration list --db-url "$url" || rc=$?
              if [ "$rc" -eq 2 ]; then
                echo
                fresh_database_report
              elif [ "$rc" -eq 0 ]; then
                ran=true
                echo
                rc=0
                run_cli "supabase db push --dry-run" supabase db push --dry-run --db-url "$url" || rc=$?
                if [ "$rc" -eq 2 ]; then
                  echo
                  fresh_database_report
                fi
              fi
            fi
          fi

          if [ "$ran" != "true" ] && [ "$LINK_OK" = "true" ]; then
            echo
            rc=0
            run_cli "falling back to the linked project — supabase migration list --linked" supabase migration list --linked || rc=$?
            if [ "$rc" -eq 2 ]; then
              # The linked project has no migration-history table yet: report from the
              # local files alone and do NOT run `db push`, which would create it.
              echo
              fresh_database_report
            elif [ "$rc" -eq 0 ]; then
              ran=true
              echo "== supabase db push --dry-run (linked project) =="
              supabase db push --dry-run || true
            fi
          fi

          # Read-only last resort: the CLI needs a linked project for some subcommands
          # and this repository only has a scoped PAT (see the api-keys 403 above), so
          # the report is produced straight from Postgres instead — still strictly
          # read-only, and exactly the information a dry run has to give.
          if [ "$ran" != "true" ] && [ "$DB_REACHABLE" = "true" ]; then
            echo
            echo "== psql fallback: remote migration history vs local files (read-only) =="
            if read_remote_history; then
              report_local_vs_remote "$HISTORY_VERSIONS"
              if [ "$HISTORY_STATE" = "missing" ]; then
                echo "  note           : a missing supabase_migrations.schema_migrations (SQLSTATE 42P01) is the expected state of a fresh database and is reported as an EMPTY remote history — nothing was created to make this query succeed."
                echo "::notice title=dry-run on a fresh database::remote history EMPTY (no supabase_migrations.schema_migrations); pending='${LAST_PENDING:-none}'. Read-only: nothing created, nothing applied."
              fi
              ran=true
            else
              echo "(psql fallback failed too)"
            fi
          fi

          # Management-API path: the endpoint the Dashboard's own SQL editor uses.
          # It authenticates with the ACCESS TOKEN alone, so it needs no database
          # password, no pooler port and no IPv6 reachability — and read_only:true
          # keeps it strictly non-mutating. This is what makes the dry-run work for a
          # project whose Supavisor credential is broken.
          if [ "$ran" != "true" ] && [ "${MGMT_SQL_OK:-false}" = "true" ]; then
            echo
            echo "== Management API read-only SQL — dry-run report without the database password =="
            mgmt_query() {  # $1 = sql ; never prints the token
              local body
              body=$(python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1], "read_only": True}))' "$1")
              curl -sS -m 90 -X POST \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                -H "Accept: application/json" -H "Content-Type: application/json" \
                -d "$body" \
                "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"
            }
            mgmt_scalar() {  # $1 = json, $2 = column ; prints the first row's column
              printf '%s' "$1" | jq -r --arg c "$2" 'if type=="array" and length>0 then ((.[0][$c] // "") | tostring) else "" end' 2>/dev/null
            }
            # Existence FIRST, rows SECOND — both read_only:true. A single-statement
            # CASE cannot guard this: PostgreSQL resolves the relation at parse time
            # and answers SQLSTATE 42P01 on a fresh database.
            resp=$(mgmt_query "select to_regclass('supabase_migrations.schema_migrations') is null as missing") || resp=""
            remote=""
            HISTORY_STATE=unknown
            # A successful /database/query answer is a JSON ARRAY of rows; an error is
            # a JSON object (or plain text). Accepting only an array is what stops an
            # error body from being mistaken for an empty migration history.
            if printf '%s' "$resp" | jq -e 'type=="array"' >/dev/null 2>&1; then
              if [ "$(mgmt_scalar "$resp" missing)" = "true" ]; then
                echo "  remote migration history : EMPTY — supabase_migrations.schema_migrations does not exist (fresh database; SQLSTATE 42P01 is expected here)"
                HISTORY_STATE=missing
              else
                rows=$(mgmt_query "select coalesce(string_agg(version, ',' order by version), '') as history from supabase_migrations.schema_migrations") || rows=""
                if printf '%s' "$rows" | jq -e 'type=="array"' >/dev/null 2>&1; then
                  remote=$(mgmt_scalar "$rows" history)
                  echo "  remote migration history : ${remote:-EMPTY — history table exists but holds no rows}"
                  if [ -n "$remote" ]; then HISTORY_STATE=applied; else HISTORY_STATE=empty; fi
                elif printf '%s' "$rows" | grep -qE '42P01|does not exist'; then
                  echo "  remote migration history : EMPTY — the API reported SQLSTATE 42P01 while reading the rows (fresh database)"
                  HISTORY_STATE=missing
                else
                  echo "  unexpected response while reading the history rows: $(printf '%s' "$rows" | head -c 300)"
                fi
              fi
              if [ "$HISTORY_STATE" != "unknown" ]; then
                report_local_vs_remote "$remote"
                echo "  created                  : nothing — read_only:true on both statements"
                echo "::notice title=dry-run via Management API::read-only SQL over the access token; remote history='${remote:-none (fresh database)}'; pending='${LAST_PENDING:-none}'. No database password, no pooler and no IPv6 needed. Nothing was created."
                ran=true
              fi
            elif printf '%s' "$resp" | grep -qE '42P01|does not exist'; then
              # The API itself reported the missing relation — same classification.
              echo "  remote migration history : EMPTY — the API reported SQLSTATE 42P01 / 'does not exist' (fresh database)"
              HISTORY_STATE=missing
              report_local_vs_remote ""
              echo "::notice title=dry-run via Management API::SQLSTATE 42P01 treated as EMPTY remote history; pending='${LAST_PENDING:-none}'. Nothing was created."
              ran=true
            else
              echo "  unexpected response: $(printf '%s' "$resp" | head -c 300)"
            fi
          fi

          if [ "$ran" != "true" ]; then
            echo "::error::Could not produce a dry-run report through any available path."
            exit 1
          fi
          echo "::notice title=dry-run::report produced against ${SB_DB_USER}@${SB_DB_HOST}:${SB_DB_PORT} (remote migration history: ${HISTORY_STATE:-unknown})"
          echo "dry_run_ok=true" >> "$GITHUB_OUTPUT"
          echo "remote_history_state=${HISTORY_STATE:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Dry run — read-only cross-check of the remote migration history
        if: steps.probe.outputs.db_reachable == 'true'
        run: |
          set -uo pipefail
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          export PGSSLMODE=require PGCONNECT_TIMEOUT=15 PGPASSWORD="$SUPABASE_DB_PASSWORD"
          # Read-only and SQLSTATE 42P01-safe: existence is asked about FIRST
          # (to_regclass takes a string and returns NULL instead of raising), and the
          # rows are read only in a SECOND statement. A single-statement CASE cannot
          # do this — PostgreSQL resolves every relation named anywhere in the
          # statement at parse time, so on a fresh database, where
          # supabase_migrations.schema_migrations does not exist yet, the previous
          # query aborted this cross-check with SQLSTATE 42P01 instead of reporting an
          # EMPTY remote history. No table is created here to make the query succeed.
          xerr="$RUNNER_TEMP/xcheck.err"
          psql_ro() {  # $1 = sql — read-only; credential travels via env, never argv
            psql -h "$SB_DB_HOST" -p "$SB_DB_PORT" -U "$SB_DB_USER" -d postgres \
                 -X -At -v VERBOSITY=verbose -v ON_ERROR_STOP=1 -qc "$1"
          }
          missing=""
          if missing=$(psql_ro "select to_regclass('supabase_migrations.schema_migrations') is null" 2>"$xerr"); then
            if [ "$missing" = "t" ]; then
              echo "remote history: EMPTY — supabase_migrations.schema_migrations does not exist yet -> nothing applied (expected on a fresh database before the first migration; SQLSTATE 42P01 is not an error here)"
            else
              versions=""
              versions=$(psql_ro "select coalesce(string_agg(version, ', ' order by version), '') from supabase_migrations.schema_migrations" 2>"$xerr") || versions=""
              if [ -z "$versions" ] && grep -qE '42P01|3F000' "$xerr" 2>/dev/null; then
                echo "remote history: EMPTY — the history table disappeared while being read (SQLSTATE 42P01) -> nothing applied"
              else
                echo "remote history: ${versions:-EMPTY — table exists but holds no rows -> nothing applied}"
              fi
            fi
          elif grep -qE '42P01|3F000' "$xerr" 2>/dev/null; then
            echo "remote history: EMPTY — SQLSTATE $(grep -oE '42P01|3F000' "$xerr" | head -1) -> nothing applied (fresh database)"
          else
            echo "remote history: could not be cross-checked — $(head -1 "$xerr" 2>/dev/null)"
          fi
          echo "local files : $(ls -1 supabase/migrations/*.sql | wc -l)"

      - name: APPLY gate — a real PostgreSQL connection is mandatory for mode=apply
        # Without this step an APPLY run whose database probe failed — but whose
        # read-only Management API path worked (mgmt_sql_ok=true) — would skip the
        # fail-fast step above, skip every apply/verify step below (they are gated
        # on db_reachable == 'true'), and finish GREEN having applied nothing.
        # A read-only fallback is acceptable for a dry-run report; it must never be
        # reported as a successful apply. This gate turns that silent skip into a
        # hard, clearly-worded failure. It prints no secret values.
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && steps.probe.outputs.db_reachable != 'true'
        env:
          DB_ERROR: ${{ steps.probe.outputs.db_error }}
        run: |
          set -uo pipefail
          echo "::error::mode=apply was requested but NO real PostgreSQL connection was confirmed (db_reachable != true). Nothing was applied — the read-only Management API fallback can only produce dry-run reports and is never a substitute for an apply."
          if [ -n "${DB_ERROR:-}" ]; then echo "::error::Database probe: ${DB_ERROR}"; fi
          {
            echo "### APPLY refused — no confirmed PostgreSQL connection"
            echo
            echo "This run was started with \`mode = apply\`, but the database probe could not"
            echo "confirm a working PostgreSQL connection. **No migration was applied.**"
            echo
            echo "The read-only Management API path (used for dry-run reports) is NOT accepted"
            echo "as an apply path. Fix the database connectivity (see the probe step above),"
            echo "then re-run with \`mode = apply\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Apply migrations (only when mode = apply)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && steps.probe.outputs.db_reachable == 'true'
        env:
          PROJECT_STATUS: ${{ steps.preflight.outputs.project_status }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          if [ -n "$PROJECT_STATUS" ] && [ "$PROJECT_STATUS" != "ACTIVE_HEALTHY" ]; then
            echo "::error::Refusing to push: project status is ${PROJECT_STATUS}."
            exit 1
          fi
          build_db_url() {
            python3 -c 'import sys, urllib.parse as u; h, prt, usr, pw, jit, opts = sys.argv[1:7]; q = lambda s: u.quote(s, safe=""); e = ("&pgbouncer=true&statement_cache_size=0" if prt == "6543" else "") + (("&options=" + q(opts)) if (jit == "yes" and opts and h.endswith("pooler.supabase.com")) else ""); print("postgresql://%s:%s@%s:%s/postgres?sslmode=require%s" % (q(usr), q(pw), h, prt, e))' \
              "$1" "$2" "$3" "$SUPABASE_DB_PASSWORD" "${SB_DB_JIT:-no}" "${SB_DB_JIT_OPTS:-}"
          }
          url=$(build_db_url "$SB_DB_HOST" "$SB_DB_PORT" "$SB_DB_USER")
          echo "::add-mask::$url"
          supabase db push --db-url "$url" --include-all --yes

      - name: Verify — run supabase/verify.sql (apply only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && steps.probe.outputs.db_reachable == 'true'
        env:
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          echo "::add-mask::$PGPASSWORD"
          export PGHOST="$SB_DB_HOST" PGPORT="$SB_DB_PORT" PGUSER="$SB_DB_USER"
          echo "verifying against ${PGUSER}@${PGHOST}:${PGPORT}"
          psql -v ON_ERROR_STOP=1 -f supabase/verify.sql

      - name: Verify — assert expected seed counts (apply only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && steps.probe.outputs.db_reachable == 'true'
        env:
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          echo "::add-mask::$PGPASSWORD"
          export PGHOST="$SB_DB_HOST" PGPORT="$SB_DB_PORT" PGUSER="$SB_DB_USER"
          actual=$(psql -v ON_ERROR_STOP=1 -At -F, -c "
            select
              (select count(*) from public.flavors),
              (select count(*) from public.products),
              (select count(*) from public.product_variants),
              (select count(*) from public.inventory),
              (select count(*) from public.recipes),
              (select count(*) from public.site_content),
              (select count(*) from public.site_settings),
              (select count(*) from public.products where image_url like 'images/products/%');
          ")
          expected="22,22,22,22,2,5,1,22"
          echo "expected: $expected"
          echo "actual:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Seed counts do not match the expected values."
            exit 1
          fi
          echo "✅ Migrations applied and verified."

      - name: Result summary
        if: always()
        env:
          MODE: ${{ github.event.inputs.mode || github.event_name }}
          TOKEN_CLASS: ${{ steps.guard.outputs.token_class }}
          TOKEN_VALID: ${{ steps.preflight.outputs.token_valid }}
          PROJECT_VISIBLE: ${{ steps.preflight.outputs.project_visible }}
          PROJECT_STATUS: ${{ steps.preflight.outputs.project_status }}
          REGION: ${{ steps.preflight.outputs.region }}
          LINK_API_OK: ${{ steps.preflight.outputs.link_api_ok }}
          VERDICT: ${{ steps.preflight.outputs.verdict }}
          ACTION_NEEDED: ${{ steps.preflight.outputs.manual_action }}
          DB_REACHABLE: ${{ steps.probe.outputs.db_reachable }}
          DB_ERROR: ${{ steps.probe.outputs.db_error }}
          DB_ATTEMPTS: ${{ steps.probe.outputs.db_attempts }}
          DB_PW_VARIANT: ${{ steps.probe.outputs.db_pw_variant }}
          DB_KIND: ${{ steps.probe.outputs.db_last_kind }}
          DB_PW_AUTH_AT: ${{ steps.probe.outputs.db_pw_auth_at }}
          DB_DIRECT_KIND: ${{ steps.probe.outputs.db_direct_kind }}
          DB_JIT: ${{ steps.probe.outputs.db_jit }}
          JIT_STATE: ${{ steps.preflight.outputs.jit_state }}
          MGMT_SQL_OK: ${{ steps.preflight.outputs.mgmt_sql_ok }}
          MGMT_SQL_CODE: ${{ steps.preflight.outputs.mgmt_sql_code }}
          POSTGRES_VERSION: ${{ steps.preflight.outputs.postgres_version }}
          PW_FIXES: ${{ steps.guard.outputs.pw_fixes }}
          PW_EDGE: ${{ steps.guard.outputs.pw_edge }}
          API_CODES: ${{ steps.preflight.outputs.api_codes }}
          POOL_MODE: ${{ steps.preflight.outputs.pool_mode }}
          LINK_OK: ${{ steps.link.outputs.link_ok }}
          DRY_RUN_OK: ${{ steps.dryrun.outputs.dry_run_ok }}
        run: |
          set -uo pipefail
          db_action=""
          if [ "${DB_REACHABLE:-}" != "true" ]; then
            db_action="Database not reachable. ${DB_ERROR:-See the probe step.} Check SUPABASE_DB_PASSWORD (Dashboard > Project Settings > Database), confirm the project is running, and/or pass the Session-pooler host from Dashboard > Connect as the db_host input with db_port 5432."
          fi
          {
            echo "### Supabase migrate — ${MODE}"
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| project ref | \`${PROJECT_REF}\` |"
            echo "| token class | ${TOKEN_CLASS:-n/a} |"
            echo "| token accepted by the Management API | ${TOKEN_VALID:-n/a} |"
            echo "| project visible to this token | ${PROJECT_VISIBLE:-n/a} |"
            echo "| project status | ${PROJECT_STATUS:-unknown} |"
            echo "| region | ${REGION:-unknown} |"
            echo "| api-keys endpoint (needed by \`supabase link\`) | ${LINK_API_OK:-n/a} |"
            echo "| Management API status codes | ${API_CODES:-n/a} |"
            echo "| pool_mode from the API | ${POOL_MODE:-unknown} |"
            echo "| \`supabase link\` | ${LINK_OK:-skipped} |"
            echo "| Postgres endpoint used | \`${SB_DB_USER:-?}@${SB_DB_HOST:-?}:${SB_DB_PORT:-?}\` |"
            echo "| database reachable | ${DB_REACHABLE:-n/a} |"
            echo "| connection attempts (bounded) | ${DB_ATTEMPTS:-0} |"
            echo "| secret normalisation applied | ${PW_FIXES:-n/a} |"
            echo "| secret edge characters (class only) | ${PW_EDGE:-n/a} |"
            echo "| credential that authenticated | ${DB_PW_VARIANT:-none} |"
            echo "| authenticated via temporary access (JIT) | ${DB_JIT:-no} |"
            echo "| temporary access state (Management API) | ${JIT_STATE:-unknown} |"
            echo "| postgres version | ${POSTGRES_VERSION:-unknown} |"
            echo "| pooler refused the credential at | ${DB_PW_AUTH_AT:-never} |"
            echo "| last failure class (pooler) | ${DB_KIND:-none} |"
            echo "| last failure class (direct, bypasses Supavisor) | ${DB_DIRECT_KIND:-not tested} |"
            echo "| read-only SQL via Management API | ${MGMT_SQL_OK:-false} (HTTP ${MGMT_SQL_CODE:-?}) |"
            echo "| dry-run report produced | ${DRY_RUN_OK:-no} |"
            echo
            echo "**Verdict:** \`${VERDICT:-unknown}\`"
            echo
            echo "**Action needed (access token):** ${ACTION_NEEDED:-none}"
            if [ -n "$db_action" ]; then
              echo
              echo "**Action needed (database):** ${db_action}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "verdict: ${VERDICT:-unknown}"
          echo "action needed (access token): ${ACTION_NEEDED:-none}"
          if [ -n "$db_action" ]; then echo "action needed (database): ${db_action}"; fi
          exit 0
