name: Supabase migrate (manual)

# Manual-only workflow. It reports (dry-run) or applies the exact SQL files in
# supabase/migrations/ to the real Supabase project and then runs supabase/verify.sql.
#
# Nothing here touches the frontend, design, cart, checkout or animations.
# No secret value is ever printed: the access token is described only by its
# class / length / sha256 fingerprint, the DB password is masked, and every
# Postgres connection string is registered with ::add-mask:: before it is used.
#
# Why this version no longer dies on
# "Authorization failed for the access token and project ref pair":
#   1. The token is normalised first — a pasted newline, space, quote or
#      "Bearer " prefix is stripped automatically (a very common cause of a 401).
#   2. A pre-flight step asks the Management API directly what the token can do,
#      so the log names the exact failure mode instead of a generic message.
#   3. `supabase link` is now a best-effort diagnostic, not a gate. A
#      scoped/fine-grained PAT can never satisfy
#      GET /v1/projects/{ref}/api-keys?reveal=true — the call `supabase link`
#      depends on (open Supabase bug supabase/supabase#50244, reported
#      2026-09-10). All migration commands therefore run against an explicit
#      percent-encoded Postgres URL (--db-url), which needs no link at all.
#   4. The Postgres endpoint is READ from
#      GET /v1/projects/{ref}/config/database/pooler (the PRIMARY entry, exactly
#      like the CLI does when linking) instead of being composed from the region:
#      aws-0-{region}.pooler.supabase.com is not universal and answering
#      "FATAL: (ENOTFOUND) tenant/user postgres.{ref} not found" means the project
#      lives on a different Supavisor cluster. db.{ref}.supabase.co is IPv6-only
#      unless the project has the IPv4 add-on, so IPv4 runners cannot use it.
#
# Why this version no longer reports a correct password as a wrong one
# (the "SUPABASE_DB_PASSWORD is not this project's database password" failure):
#   5. The endpoint is no longer a single bet. The previous version read the
#      pooler config and then THREW THE PORT AWAY — the log literally said
#      "API reported 6543/transaction, using 5432 for migrations". One wrong
#      guess aborted the whole run. It now builds an ordered candidate list
#      (the API-advertised host:port first, then the other Supavisor mode on the
#      same host, then the direct connection, then templated regional hosts) and
#      tries them in turn.
#   6. The password normalisation was broken. It deleted \r and \n but never
#      trimmed spaces/tabs, and its quote patterns were \"\"* and ''* — TWO
#      leading quotes — so a single wrapping pair, the common paste artifact,
#      survived into the connection string. It now trims whitespace, removes one
#      matching pair of wrapping quotes, records WHICH transform fired, and —
#      because a password may legitimately contain those characters — keeps the
#      alternatives so the probe can try them instead of guessing.
#   7. The probe distinguishes failure classes instead of blaming the password
#      for everything: tenant/user-not-found, DNS, refused/timeout, TLS,
#      Supavisor's auth circuit breaker, and a genuine credential rejection are
#      all reported separately. "The password is wrong" is now only claimed
#      after every endpoint AND every normalisation has been refused.
#      Attempts are bounded (max 6, stopping early on AUTH and on a circuit
#      breaker) so diagnosing cannot itself trip Supavisor's failure lockout.
#   8. Diagnostics never reveal the secret: only its length, its sha256[1:12]
#      fingerprint and the CHARACTER CLASS of its first/last character
#      (quote / space / tab / letter / digit / other-symbol) are printed, which
#      is enough to spot a paste artifact without exposing the value.

on:
  # A pull request that touches this workflow or the SQL files runs the SAME job in
  # dry-run mode only: `inputs.mode` does not exist for pull_request events and every
  # mutating step is additionally gated on github.event_name == 'workflow_dispatch'.
  pull_request:
    paths:
      - ".github/workflows/supabase-migrate.yml"
      - "supabase/**"
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref"
        required: true
        default: kijhqsyftzufydonggeb
      mode:
        description: "dry-run = report pending migrations only | apply = really push"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      db_host:
        description: "Optional: Postgres host from Dashboard > Connect (blank = auto-detect)"
        required: false
        default: ""
      db_port:
        description: "Optional: Postgres port, 5432 = session / 6543 = transaction (blank = auto)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_REF: ${{ github.event.inputs.project_ref || 'kijhqsyftzufydonggeb' }}
      # Only a private repository's log may show project / organization names.
      SHOW_NAMES: ${{ github.event.repository.private }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — secrets present, token normalised and classified
        id: guard
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RAW_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${RAW_TOKEN:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions)."
            missing=1
          fi
          if [ -z "${RAW_PASSWORD:-}" ]; then
            echo "::error::Missing repository secret SUPABASE_DB_PASSWORD (Dashboard > Project Settings > Database > Database password)."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

          # A token pasted into a GitHub secret very often carries a trailing
          # newline, surrounding spaces/quotes or a "Bearer " prefix. Any of
          # those makes the Management API answer 401 and the CLI report
          # "Authorization failed for the access token and project ref pair".
          tok=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n\t' \
                | sed -e "s/^[[:space:]\"']*//" -e "s/[[:space:]\"']*$//" \
                      -e "s/^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]*//" \
                      -e "s/^[[:space:]\"']*//" -e "s/[[:space:]\"']*$//")
          if [ "$tok" != "$RAW_TOKEN" ]; then
            echo "note: SUPABASE_ACCESS_TOKEN contained stray whitespace/quotes/'Bearer ' — trimmed automatically."
          fi
          echo "::add-mask::$tok"

          is_pat=no; is_scoped=no
          case "$tok" in
            sbp_fc*)          cls="scoped (fine-grained) personal access token, sbp_fc…"
                              is_pat=yes; is_scoped=yes ;;
            sbp_*)            cls="classic personal access token, sbp_…"
                              is_pat=yes ;;
            sb_secret_*)      cls="PROJECT SECRET API KEY, sb_secret_… (data key — the CLI cannot use it)" ;;
            sb_publishable_*) cls="PROJECT PUBLISHABLE API KEY, sb_publishable_… (data key — the CLI cannot use it)" ;;
            eyJ*)             cls="legacy JWT, eyJ… (anon/service_role key — the CLI cannot use it)" ;;
            *)                cls="unrecognised format (a Supabase access token starts with sbp_)" ;;
          esac

          # ---- database password: normalise, and record WHAT had to be removed ----
          # A secret pasted from the Dashboard, a .env file or a JSON blob very often
          # carries a trailing newline, a leading/trailing space, or ONE wrapping pair
          # of quotes. Any of those makes Supavisor answer
          #   FATAL: password authentication failed for user "postgres"
          # even though the operator is certain the stored value "is exactly the
          # password" — and even though the tenant/user was resolved correctly, which
          # is why the failure looks like a wrong password rather than a wrong user.
          #
          # The previous version of this step was broken in two ways:
          #   * its quote patterns were \"\"* and ''*, i.e. they required TWO leading
          #     quote characters, so a single wrapping pair — the common case — was
          #     never removed;
          #   * it only deleted \r and \n, so leading/trailing spaces and tabs were
          #     never trimmed at all.
          # Both artifacts are invisible in the UI and add 1-2 characters to the
          # reported length. Normalise properly, and (because a password may
          # legitimately contain a trailing space or quotes) keep the alternatives so
          # the probe step can try them instead of us having to guess.
          char_class() {  # describe ONE character without ever printing it
            case "$1" in
              '')       echo 'empty' ;;
              '"')      echo 'double-quote' ;;
              "'")      echo 'single-quote' ;;
              ' ')      echo 'space' ;;
              $'\t')    echo 'tab' ;;
              $'\r')    echo 'carriage-return' ;;
              $'\n')    echo 'newline' ;;
              [0-9])    echo 'digit' ;;
              [A-Za-z]) echo 'letter' ;;
              *)        echo 'other-symbol' ;;
            esac
          }
          raw_first_class=$(char_class "${RAW_PASSWORD:0:1}")
          raw_last_class=$(char_class "${RAW_PASSWORD: -1}")

          pw="$RAW_PASSWORD"
          fixes="none"
          note_fix() { [ "$fixes" = "none" ] && fixes="$1" || fixes="$fixes+$1"; }

          step=$(printf '%s' "$pw" | tr -d '\r\n')
          if [ "$step" != "$pw" ]; then note_fix "CR/LF removed"; fi
          pw="$step"

          step=$(printf '%s' "$pw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ "$step" != "$pw" ]; then note_fix "surrounding whitespace trimmed"; fi
          pw="$step"

          if [ "${#pw}" -ge 2 ]; then
            case "$pw" in
              '"'*'"') step="${pw#\"}"; step="${step%\"}"
                       note_fix "one wrapping pair of double quotes removed"; pw="$step" ;;
              "'"*"'") step="${pw#\'}"; step="${step%\'}"
                       note_fix "one wrapping pair of single quotes removed"; pw="$step" ;;
            esac
          fi

          step=$(printf '%s' "$pw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ "$step" != "$pw" ]; then note_fix "whitespace inside the quotes trimmed"; fi
          pw="$step"

          echo "::add-mask::$pw"
          if [ "$fixes" != "none" ]; then
            echo "note: SUPABASE_DB_PASSWORD was normalised — ${fixes}."
            echo "::warning title=SUPABASE_DB_PASSWORD normalised::${fixes} — the stored secret was not byte-identical to the password. Re-save it in Settings > Secrets without the extra characters."
          else
            echo "note: SUPABASE_DB_PASSWORD needed no normalisation (stored value is byte-clean)."
          fi
          pwfp=$(printf '%s' "$pw" | sha256sum | cut -c1-12)

          fp=$(printf '%s' "$tok" | sha256sum | cut -c1-12)
          echo "Both secrets are present."
          echo "  token class        : $cls"
          echo "  token length       : ${#tok}"
          echo "  token sha256[1:12] : $fp"
          echo "  db password length : ${#pw} (raw ${#RAW_PASSWORD}), sha256[1:12]=${pwfp}"
          echo "  db password edge   : first char=${raw_first_class}, last char=${raw_last_class} (classes only — the value is never printed)"
          echo "  db password fixes  : ${fixes}"
          echo "  (to check which token is stored, run locally:"
          echo "   printf '%s' \"\$MY_TOKEN\" | sha256sum | cut -c1-12 )"

          # Annotations are readable through the API without downloading the job log.
          echo "::notice title=SUPABASE_ACCESS_TOKEN::class=${cls} | length=${#tok} | sha256[1:12]=${fp}"
          echo "::notice title=SUPABASE_DB_PASSWORD::length=${#pw} (raw ${#RAW_PASSWORD}) | sha256[1:12]=${pwfp} | normalisation=${fixes} | first=${raw_first_class} last=${raw_last_class}"

          {
            echo "SUPABASE_ACCESS_TOKEN=$tok"
            echo "SUPABASE_DB_PASSWORD=$pw"
            echo "SB_TOKEN_CLASS=$cls"
            echo "SB_TOKEN_IS_PAT=$is_pat"
            echo "SB_TOKEN_IS_SCOPED=$is_scoped"
            echo "SB_TOKEN_FP=$fp"
            echo "SB_PW_FP=$pwfp"
            echo "SB_PW_RAW_FP=$(printf '%s' "$RAW_PASSWORD" | sha256sum | cut -c1-12)"
            echo "SB_PW_FIXES=$fixes"
            echo "SB_PW_EDGE=first=${raw_first_class},last=${raw_last_class}"
          } >> "$GITHUB_ENV"
          {
            echo "token_is_pat=$is_pat"
            echo "token_is_scoped=$is_scoped"
            echo "token_class=$cls"
            echo "pw_fixes=$fixes"
            echo "pw_fp=$pwfp"
            echo "pw_raw_fp=$(printf '%s' "$RAW_PASSWORD" | sha256sum | cut -c1-12)"
            echo "pw_edge=first=${raw_first_class},last=${raw_last_class}"
          } >> "$GITHUB_OUTPUT"

      - name: Show the exact migration files that would be applied
        run: |
          set -euo pipefail
          ls -l supabase/migrations
          echo "--- sha256 (must stay identical to PR #31) ---"
          sha256sum supabase/migrations/*.sql supabase/verify.sql

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned on purpose: `latest` makes setup-cli resolve the newest release
          # through the unauthenticated GitHub API and dies with
          # "Failed to resolve latest Supabase CLI release: rate limit exceeded"
          # (seen in run 34755552801). Bump deliberately, never implicitly.
          version: 2.117.0

      - name: Record CLI version and ensure supabase/config.toml exists
        run: |
          set -euo pipefail
          echo "supabase CLI: $(supabase --version 2>&1 | head -1)"
          if [ ! -f supabase/config.toml ]; then
            supabase init --force
            echo "Created a default supabase/config.toml for the CLI (no SQL file was touched)."
          fi
          sha256sum supabase/migrations/*.sql

      - name: Pre-flight — what can this token actually do?
        id: preflight
        run: |
          set -uo pipefail
          ref="${PROJECT_REF:?the project_ref input is empty}"
          tmp="$RUNNER_TEMP/preflight"; mkdir -p "$tmp"
          CODE=000; BODY=""

          api_get() {  # $1 = path -> sets CODE and BODY, never fails the step
            local resp
            resp=$(curl -sS -m 30 \
                     -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                     -H "Accept: application/json" \
                     -w $'\n%{http_code}' \
                     "https://api.supabase.com$1" 2>"$tmp/curl.err") || true
            CODE="${resp##*$'\n'}"
            BODY="${resp%$'\n'*}"
            case "$CODE" in ''|*[!0-9]*) CODE="000" ;; esac
          }

          echo "== 1/5  Does project ref '$ref' exist? (public probe, no credentials used) =="
          rest=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://${ref}.supabase.co/rest/v1/" 2>/dev/null) || rest="000"
          echo "https://${ref}.supabase.co/rest/v1/ -> HTTP ${rest}"
          echo "::notice title=probe rest/v1::https://${ref}.supabase.co/rest/v1/ -> HTTP ${rest}"
          rest_headers=$(curl -s -D - -o /dev/null -m 20 "https://${ref}.supabase.co/rest/v1/" 2>/dev/null | tr -d '\r' | grep -iE '^(server|x-|cf-|via)' | head -8 | tr '\n' '; ')
          [ -n "$rest_headers" ] && echo "response headers: ${rest_headers}"
          ref_exists=yes
          if [ "$rest" = "000" ]; then
            ref_exists=no
            echo "::warning::That hostname did not answer at all — the ref is mistyped, or the project is paused/deleted."
          else
            echo "The API gateway answered, so the ref itself is real."
          fi

          echo
          echo "== 2/5  Token -> Management API =="
          api_get "/v1/projects"
          projects_code="$CODE"; projects_body="$BODY"
          token_valid=false
          if [ "$projects_code" = "200" ]; then
            token_valid=true
            n=$(printf '%s' "$projects_body" | jq -r 'if type=="array" then length else 0 end' 2>/dev/null || echo "?")
            echo "GET /v1/projects -> 200 — the token is accepted and can see ${n} project(s)."
            if [ "$SHOW_NAMES" = "true" ]; then
              printf '%s' "$projects_body" | jq -r '.[]? | "    - \(.id // .ref)  name=\(.name)  status=\(.status)  org=\(.organization_slug // .organization_id)"'
            else
              printf '%s' "$projects_body" | jq -r '.[]? | "    - \(.id // .ref)  status=\(.status)"'
            fi
          else
            echo "GET /v1/projects -> HTTP ${projects_code}"
            [ -s "$tmp/curl.err" ] && sed 's/^/  curl: /' "$tmp/curl.err"
            printf '%s' "$projects_body" | head -c 400; echo
          fi
          echo "::notice title=api /v1/projects::HTTP ${projects_code}"

          api_get "/v1/organizations"
          echo "GET /v1/organizations -> HTTP ${CODE}"
          if [ "$CODE" = "200" ] && [ "$SHOW_NAMES" = "true" ]; then
            printf '%s' "$BODY" | jq -r '.[]? | "    - \(.id)  \(.name)"'
          fi

          echo
          echo "== 3/5  This project, as seen by this token =="
          api_get "/v1/projects/${ref}"
          proj_code="$CODE"; proj_body="$BODY"
          echo "::notice title=api /v1/projects/{ref}::HTTP ${proj_code}"
          project_visible=false; region=""; pstatus=""; pname=""
          if [ "$proj_code" = "200" ]; then
            project_visible=true
            region=$(printf '%s' "$proj_body"  | jq -r '.region // empty' 2>/dev/null) || region=""
            pstatus=$(printf '%s' "$proj_body" | jq -r '.status // empty' 2>/dev/null) || pstatus=""
            pname=$(printf '%s' "$proj_body"   | jq -r '.name // empty'   2>/dev/null) || pname=""
            echo "GET /v1/projects/${ref} -> 200   status=${pstatus:-?}   region=${region:-?}"
            if [ "$SHOW_NAMES" = "true" ] && [ -n "$pname" ]; then
              echo "project name: $pname"
            fi
          else
            echo "GET /v1/projects/${ref} -> HTTP ${proj_code}"
            printf '%s' "$proj_body" | head -c 300; echo
          fi

          echo
          echo "== 4/5  The endpoint 'supabase link' depends on =="
          api_get "/v1/projects/${ref}/api-keys?reveal=false"
          akeys_code="$CODE"
          echo "::notice title=api /v1/projects/{ref}/api-keys::HTTP ${akeys_code}"
          link_api_ok=false
          case "$akeys_code" in 2*) link_api_ok=true ;; esac
          echo "GET /v1/projects/${ref}/api-keys -> HTTP ${akeys_code}"

          echo
          echo "== 5/5  The project's REAL pooler connection (read, never templated) =="
          api_get "/v1/projects/${ref}/config/database/pooler"
          pooler_code="$CODE"; pooler_body="$BODY"
          echo "GET /v1/projects/${ref}/config/database/pooler -> HTTP ${pooler_code}"
          echo "::notice title=api pooler-config::HTTP ${pooler_code}"
          pooler_host=""; pooler_port=""; pooler_user=""; pool_mode=""
          if [ "$pooler_code" = "200" ]; then
            # array with one entry per database; the CLI uses the PRIMARY one
            entry=$(printf '%s' "$pooler_body" | jq -c 'if type=="array" then (map(select((.database_type // "")=="PRIMARY"))[0] // .[0]) else . end' 2>/dev/null) || entry=""
            if [ -n "$entry" ] && [ "$entry" != "null" ]; then
              pooler_host=$(printf '%s' "$entry" | jq -r '.db_host // empty' 2>/dev/null) || pooler_host=""
              pooler_port=$(printf '%s' "$entry" | jq -r '.db_port // empty' 2>/dev/null) || pooler_port=""
              pooler_user=$(printf '%s' "$entry" | jq -r '.db_user // empty' 2>/dev/null) || pooler_user=""
              pool_mode=$(printf '%s' "$entry" | jq -r '(.pool_mode // .db_pool_mode // empty)' 2>/dev/null) || pool_mode=""
              echo "pooler PRIMARY: ${pooler_user:-?}@${pooler_host:-?}:${pooler_port:-?}  pool_mode=${pool_mode:-?}"
              echo "::notice title=pooler PRIMARY::${pooler_user:-?}@${pooler_host:-?}:${pooler_port:-?} pool_mode=${pool_mode:-?}"
              printf '%s' "$pooler_body" | jq -c 'if type=="array" then map({database_type, db_host, db_port, db_user, pool_mode}) else . end' 2>/dev/null | sed 's/^/  entries: /'
            else
              echo "  no usable entry in the response"
            fi
          else
            printf '%s' "$pooler_body" | head -c 300; echo
          fi
          if [ -z "$pooler_host" ]; then
            echo "::warning::The pooler host could not be read (HTTP ${pooler_code}). Pass it manually: Dashboard > Connect > Session pooler, then run this workflow with db_host/db_port."
          fi

          # ---- verdict ------------------------------------------------------
          verdict=ok
          action="None — token, project and API access all look healthy."
          if [ "$token_valid" != "true" ] && [ "$project_visible" != "true" ]; then
            if [ "$SB_TOKEN_IS_PAT" != "yes" ]; then
              verdict=wrong-token-type
              action="Replace the GitHub secret SUPABASE_ACCESS_TOKEN with a personal access token created at https://supabase.com/dashboard/account/tokens (it must start with sbp_). The stored value is a ${SB_TOKEN_CLASS}, which the Supabase CLI / Management API cannot use."
            elif [ "$projects_code" = "403" ]; then
              verdict=token-forbidden
              action="The token is valid but forbidden (403): it was created by a different Supabase account/organization than the owner of project ${ref}, or it is a scoped PAT without 'Project Settings: Read'. Sign in to the account that owns the project, create a CLASSIC token at https://supabase.com/dashboard/account/tokens, and update the secret."
            elif [ "$projects_code" = "000" ]; then
              verdict=api-unreachable
              action="api.supabase.com could not be reached from the runner — just re-run the workflow."
            else
              verdict=token-rejected
              action="The token was rejected (HTTP ${projects_code}): expired, revoked, or copied incompletely. Create a new one at https://supabase.com/dashboard/account/tokens and update the secret. Stored fingerprint sha256:${SB_TOKEN_FP}."
            fi
          elif [ "$project_visible" != "true" ] && [ "$projects_code" = "403" ]; then
            verdict=token-scoped-too-narrow
            action="The token is accepted but every project call is 403: it is a scoped/fine-grained PAT without 'Project Settings: Read' (or it belongs to another Supabase account). In the SAME account that owns project ${ref}, create a CLASSIC personal access token at https://supabase.com/dashboard/account/tokens (leave permissions at full access) and store it as the GitHub secret SUPABASE_ACCESS_TOKEN."
          elif [ "$project_visible" != "true" ]; then
            verdict=project-not-visible
            action="The token works but this account cannot see project ${ref}. While signed in to the SAME account that created the token, open https://supabase.com/dashboard/project/${ref}/settings/general — if that 404s, the ref is wrong or belongs to another account; copy the ref from that URL into the workflow input."
          elif [ -n "$pstatus" ] && [ "$pstatus" != "ACTIVE_HEALTHY" ]; then
            verdict=project-unhealthy
            action="Project status is ${pstatus}. Restore it first (Dashboard > Project Settings > General > Restore project); a paused project refuses migrations."
          fi

          if [ "$project_visible" = "true" ] && [ "$link_api_ok" != "true" ]; then
            echo
            echo "::warning::'supabase link' will fail on the api-keys endpoint (HTTP ${akeys_code})."
            echo "::warning::With a scoped PAT that is Supabase bug supabase/supabase#50244 — no scoped token can pass it."
            echo "::warning::Not fatal here: this workflow pushes over a direct Postgres URL instead of linking."
            if [ "$verdict" = "ok" ]; then
              action="Optional only: create a CLASSIC personal access token (https://supabase.com/dashboard/account/tokens, permissions left at full access) so that 'supabase link' works again. The dry-run/apply below does not need it."
            fi
          fi

          if [ "$token_valid" != "true" ] && [ "$project_visible" = "true" ]; then
            echo "::notice title=token scope::GET /v1/projects is denied (HTTP ${projects_code}) but GET /v1/projects/${ref} works — enough to resolve the region; 'supabase link' will still fail."
            if [ "$verdict" = "ok" ]; then
              action="Optional: this token cannot list projects (HTTP ${projects_code}). A CLASSIC personal access token from https://supabase.com/dashboard/account/tokens also makes 'supabase link' work again."
            fi
          fi

          echo
          echo "verdict: $verdict"
          echo "::notice title=preflight verdict::${verdict} | projects=${projects_code} project=${proj_code} api-keys=${akeys_code} rest=${rest} | status=${pstatus:-?} region=${region:-?}"
          {
            echo "token_valid=$token_valid"
            echo "project_visible=$project_visible"
            echo "project_status=$pstatus"
            echo "region=$region"
            echo "link_api_ok=$link_api_ok"
            echo "ref_exists=$ref_exists"
            echo "pooler_host=$pooler_host"
            echo "pooler_port=$pooler_port"
            echo "pooler_user=$pooler_user"
            echo "pool_mode=$pool_mode"
            echo "api_codes=projects:${projects_code} project:${proj_code} api-keys:${akeys_code} pooler:${pooler_code} rest:${rest}"
            echo "verdict=$verdict"
            echo "manual_action=$action"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the Postgres endpoint to work against
        id: endpoint
        env:
          INPUT_DB_HOST: ${{ inputs.db_host }}
          INPUT_DB_PORT: ${{ inputs.db_port }}
          PREFLIGHT_REGION: ${{ steps.preflight.outputs.region }}
          POOLER_HOST: ${{ steps.preflight.outputs.pooler_host }}
          POOLER_PORT: ${{ steps.preflight.outputs.pooler_port }}
          POOLER_USER: ${{ steps.preflight.outputs.pooler_user }}
          POOL_MODE: ${{ steps.preflight.outputs.pool_mode }}
        run: |
          set -euo pipefail
          ref="$PROJECT_REF"

          # Build an ORDERED candidate list instead of betting everything on one
          # host:port pair. Fields are separated by ';' and entries by ' ':
          #   host;port;user;label
          #
          # The previous version hard-coded port 5432 here and threw away the port
          # the Management API had just reported ("API reported 6543/transaction,
          # using 5432 for migrations"). GET /v1/projects/{ref}/config/database/pooler
          # is the authority on what THIS project actually serves; overriding it
          # meant a single wrong guess aborted the whole run and was then reported
          # as "SUPABASE_DB_PASSWORD is not this project's database password".
          cands=""
          ckeys=""
          add() {  # host port user label   (label is space-sanitised: the list is
                   # space-separated, so a space inside a label would split an entry)
            [ -n "$1" ] || return 0
            local l="${4//[[:space:]]/-}"
            local k="$1;$2;$3"
            # de-duplicate on host;port;user — the label is only cosmetic, and a
            # repeated endpoint would waste one of the bounded attempts
            case " $ckeys " in *" $k "*) return 0 ;; esac
            ckeys="${ckeys:+$ckeys }$k"
            cands="${cands:+$cands }$k;$l"
          }

          if [ -n "$INPUT_DB_HOST" ]; then
            # An explicit operator input outranks everything and is tried first.
            case "$INPUT_DB_HOST" in
              *pooler.supabase.com) iuser="postgres.${ref}" ;;
              *)                    iuser="postgres" ;;
            esac
            add "$INPUT_DB_HOST" "${INPUT_DB_PORT:-5432}" "$iuser" "workflow input"
          fi

          if [ -n "$POOLER_HOST" ]; then
            puser="${POOLER_USER:-postgres.${ref}}"
            pport="${POOLER_PORT:-5432}"
            # 1. exactly what the API advertised — never second-guess it
            add "$POOLER_HOST" "${INPUT_DB_PORT:-$pport}" "$puser" "api-pooler/${POOL_MODE:-?}"
            # 2. the other mode on the SAME host: the shared pooler serves session
            #    mode on 5432 and transaction mode on 6543, and migrations prefer
            #    session mode, so it is worth one extra attempt.
            if [ -z "$INPUT_DB_PORT" ]; then
              case "$pport" in
                6543) add "$POOLER_HOST" 5432 "$puser" "pooler-session/5432" ;;
                5432) add "$POOLER_HOST" 6543 "$puser" "pooler-transaction/6543" ;;
              esac
            fi
          fi

          # 3. the direct connection (IPv6-only unless the project has the IPv4
          #    add-on, so it is a fallback rather than a preference)
          add "db.${ref}.supabase.co" "${INPUT_DB_PORT:-5432}" "postgres" "direct"

          # 4. only when the API gave us no pooler config at all: try the templated
          #    regional hosts. These are NOT universal, hence last.
          if [ -z "$POOLER_HOST" ] && [ -n "$PREFLIGHT_REGION" ]; then
            add "aws-0-${PREFLIGHT_REGION}.pooler.supabase.com" "${INPUT_DB_PORT:-5432}" "postgres.${ref}" "templated/aws-0"
            add "aws-1-${PREFLIGHT_REGION}.pooler.supabase.com" "${INPUT_DB_PORT:-6543}" "postgres.${ref}" "templated/aws-1"
          fi

          # First candidate is the default for every later step; the probe step
          # overrides SB_DB_* if a different candidate is the one that authenticates.
          first="${cands%% *}"
          host="${first%%;*}"; rest="${first#*;}"
          port="${rest%%;*}"; rest="${rest#*;}"
          user="${rest%%;*}"; label="${rest#*;}"

          n=$(printf '%s' "$cands" | wc -w)
          echo "${n} endpoint candidate(s), in order:"
          for c in $cands; do
            ch="${c%%;*}"; cr="${c#*;}"; cp="${cr%%;*}"; cr="${cr#*;}"
            cu="${cr%%;*}"; cl="${cr#*;}"
            echo "  - ${cu}@${ch}:${cp}  (${cl})"
          done
          echo "::notice title=endpoint candidates::${n} — first: ${user}@${host}:${port} (${label}); API pooler said ${POOLER_PORT:-?}/${POOL_MODE:-?}"
          {
            echo "SB_DB_HOST=$host"
            echo "SB_DB_PORT=$port"
            echo "SB_DB_USER=$user"
            echo "SB_DB_CANDIDATES=$cands"
          } >> "$GITHUB_ENV"
          {
            echo "db_host=$host"
            echo "db_port=$port"
            echo "db_user=$user"
            echo "db_candidates=$n"
          } >> "$GITHUB_OUTPUT"

      - name: Probe the database (read-only, also validates SUPABASE_DB_PASSWORD)
        id: probe
        env:
          # The secret is read again here so that the ALTERNATIVE normalisations can
          # be tried without ever persisting more than one password into GITHUB_ENV.
          RAW_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -uo pipefail
          nl=$'\n'; cr=$'\r'
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          echo "::add-mask::$RAW_PASSWORD"
          export PGSSLMODE=require PGCONNECT_TIMEOUT=15
          errfile="$RUNNER_TEMP/psql.err"

          try() {  # host port user password — password travels via PGPASSWORD, never argv
            PGPASSWORD="$4" psql -h "$1" -p "$2" -U "$3" -d postgres -Atc 'select 1' >/dev/null 2>"$errfile"
          }

          K=""; D=""; MSG=""
          classify() {  # read $errfile, set K (kind), D (operator guidance), MSG (raw)
            MSG=$(head -3 "$errfile" 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g')
            local low; low=$(printf '%s' "$MSG" | tr '[:upper:]' '[:lower:]')
            case "$low" in
              *"circuit breaker"*)
                K=CIRCUIT_BREAKER
                D="Supavisor's auth circuit breaker is OPEN for this tenant because of repeated failed logins. Stop retrying, wait 10-15 minutes without any attempt, then run once more." ;;
              *"password authentication failed"*)
                K=AUTH
                D="The pooler resolved the tenant/user and then rejected the credential, so the endpoint is right and only the password value is in question." ;;
              *"tenant or user not found"*|*"tenant/user"*|*"enotfound"*)
                K=TENANT
                D="This host:port does not know that tenant/user — wrong project ref, wrong pooler cluster, this pool mode is not enabled for the project, or the project is paused." ;;
              *"could not translate host name"*|*"name or service not known"*|*"nodename nor servname"*)
                K=DNS
                D="The host does not resolve — wrong project ref/region, or the project is paused/deleted." ;;
              *"network is unreachable"*|*"no route to host"*)
                K=NET
                D="Not reachable over IPv4 from the runner (Supabase direct connections can be IPv6-only). Use the shared pooler host." ;;
              *"connection refused"*|*"timed out"*|*"timeout"*)
                K=REFUSED
                D="Nothing answered on that host:port — wrong port for this project, IPv4 direct access off, or the project is paused." ;;
              *"no pg_hba.conf entry"*|*"ssl connection"*|*"certificate"*|*"self signed"*)
                K=TLS
                D="TLS/pg_hba rejection — connect with sslmode=require to the shared pooler." ;;
              *)
                K=OTHER
                D="psql could not establish the connection." ;;
            esac
          }

          # ---- password variants -------------------------------------------------
          # A GitHub secret is very often NOT byte-identical to the password it is
          # meant to hold: a trailing space, a wrapping quote pair, a stray CR/LF.
          # Supavisor answers "password authentication failed" for all of them, which
          # is indistinguishable from a genuinely wrong password. Instead of guessing
          # which artifact (if any) the operator stored, try the plausible
          # normalisations — de-duplicated and bounded, so the pooler is never
          # hammered hard enough to trip its auth circuit breaker.
          vlabels=(); vvals=(); vfps=()
          add_variant() {  # label value
            local fp known
            fp=$(printf '%s' "$2" | sha256sum | cut -c1-12)
            if [ ${#vfps[@]} -gt 0 ]; then
              for known in "${vfps[@]}"; do
                [ "$known" = "$fp" ] && return 0
              done
            fi
            echo "::add-mask::$2"
            vlabels+=("$1"); vvals+=("$2"); vfps+=("$fp")
          }
          add_variant "canonical/normalised" "$SUPABASE_DB_PASSWORD"
          add_variant "raw/as-stored" "$RAW_PASSWORD"
          v=$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          add_variant "whitespace-trimmed" "$v"
          v=$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')
          if [ "${#v}" -ge 2 ]; then
            case "$v" in
              '"'*'"') v="${v#\"}"; v="${v%\"}" ;;
              "'"*"'") v="${v#\'}"; v="${v%\'}" ;;
            esac
          fi
          add_variant "unquoted" "$v"

          echo "password variants (values are never printed — only length and fingerprint):"
          vsum=""
          i=0
          while [ $i -lt ${#vlabels[@]} ]; do
            echo "  [$i] ${vlabels[$i]}: length=${#vvals[$i]} sha256[1:12]=${vfps[$i]}"
            vsum="${vsum}${vsum:+, }${vlabels[$i]}:len=${#vvals[$i]}/${vfps[$i]}"
            i=$((i+1))
          done
          echo "::notice title=password variants::${vsum}"

          # ---- attempt loop ------------------------------------------------------
          reachable=false; auth_blocked=no; attempts=0; MAX_ATTEMPTS=6
          auth_endpoint=""; last_kind=""; last_detail=""; last_msg=""; last_where=""
          win_label=""; win_fp=""; win_len=""; winning_pw=""

          probe_once() {  # host port user label variant_index
            local h="$1" p="$2" u="$3" lbl="$4" vi="$5"
            attempts=$((attempts+1))
            echo "probing ${u}@${h}:${p} (${lbl}) with variant [${vi}] ${vlabels[$vi]} …"
            if try "$h" "$p" "$u" "${vvals[$vi]}"; then
              echo "  -> connected and authenticated OK"
              return 0
            fi
            classify
            echo "  -> ${K}: ${MSG}"
            echo "::notice title=psql ${u}@${h}:${p} [${vlabels[$vi]}]::${K} — ${MSG}"
            last_kind="$K"; last_detail="$D"; last_msg="$MSG"; last_where="${u}@${h}:${p} (${lbl})"
            return 1
          }

          # Phase A: the canonical password against the endpoint candidates, in the
          # order the endpoint step established. An AUTH answer already proves the
          # tenant/user resolved on that host:port, so there is no point burning more
          # attempts on other endpoints with the same credential — vary the
          # credential instead (phase B). Anything else (DNS/REFUSED/TENANT) does
          # move on to the next candidate.
          for c in ${SB_DB_CANDIDATES:-}; do
            [ "$attempts" -lt "$MAX_ATTEMPTS" ] || { echo "attempt budget reached"; break; }
            h="${c%%;*}"; r="${c#*;}"; p="${r%%;*}"; r="${r#*;}"; u="${r%%;*}"; lbl="${r#*;}"
            if probe_once "$h" "$p" "$u" "$lbl" 0; then
              reachable=true
              SB_DB_HOST="$h"; SB_DB_PORT="$p"; SB_DB_USER="$u"
              win_label="${vlabels[0]}"; win_fp="${vfps[0]}"; win_len="${#vvals[0]}"; winning_pw="${vvals[0]}"
              break
            fi
            if [ "$last_kind" = "CIRCUIT_BREAKER" ]; then auth_blocked=yes; break; fi
            if [ "$last_kind" = "AUTH" ]; then auth_endpoint="$c"; break; fi
          done

          # Phase B: same endpoint, alternative normalisations of the stored secret.
          if [ "$reachable" != "true" ] && [ "$auth_blocked" != "yes" ] && [ -n "$auth_endpoint" ] && [ ${#vlabels[@]} -gt 1 ]; then
            h="${auth_endpoint%%;*}"; r="${auth_endpoint#*;}"; p="${r%%;*}"; r="${r#*;}"; u="${r%%;*}"; lbl="${r#*;}"
            echo
            echo "${u}@${h}:${p} resolved the tenant/user but rejected the canonical password."
            echo "Re-trying that SAME endpoint with the alternative normalisations (this is what distinguishes a paste artifact from a genuinely wrong password) …"
            vi=1
            while [ $vi -lt ${#vlabels[@]} ] && [ "$attempts" -lt "$MAX_ATTEMPTS" ]; do
              if probe_once "$h" "$p" "$u" "$lbl" "$vi"; then
                reachable=true
                SB_DB_HOST="$h"; SB_DB_PORT="$p"; SB_DB_USER="$u"
                win_label="${vlabels[$vi]}"; win_fp="${vfps[$vi]}"; win_len="${#vvals[$vi]}"; winning_pw="${vvals[$vi]}"
                break
              fi
              if [ "$last_kind" = "CIRCUIT_BREAKER" ]; then auth_blocked=yes; break; fi
              vi=$((vi+1))
            done
          fi

          if [ "$reachable" = "true" ]; then
            echo
            echo "working endpoint: ${SB_DB_USER}@${SB_DB_HOST}:${SB_DB_PORT} (password variant: ${win_label}, length ${win_len}, sha256[1:12]=${win_fp}, attempts ${attempts})"
            echo "::notice title=working endpoint::${SB_DB_USER}@${SB_DB_HOST}:${SB_DB_PORT} | variant='${win_label}' len=${win_len} sha256[1:12]=${win_fp} | attempts=${attempts}"
            {
              echo "SB_DB_HOST=$SB_DB_HOST"
              echo "SB_DB_PORT=$SB_DB_PORT"
              echo "SB_DB_USER=$SB_DB_USER"
            } >> "$GITHUB_ENV"
            if [ "$win_fp" != "${SB_PW_FP:-}" ]; then
              # Only the value that actually authenticated may be promoted, and never
              # through the single-line GITHUB_ENV form if it somehow holds a newline.
              case "$winning_pw" in
                *"$nl"*|*"$cr"*)
                  echo "::warning title=SUPABASE_DB_PASSWORD::variant '${win_label}' authenticated but contains CR/LF; not re-exported." ;;
                *)
                  echo "::add-mask::$winning_pw"
                  echo "SUPABASE_DB_PASSWORD=$winning_pw" >> "$GITHUB_ENV"
                  echo "::warning title=SUPABASE_DB_PASSWORD::The stored secret only authenticated after '${win_label}' (length ${win_len}, sha256[1:12]=${win_fp}). The secret holds extra characters around the real password — re-save it in Settings > Secrets and variables > Actions as exactly the password, with no quotes and no trailing space."
              esac
            fi
          fi

          db_error=""
          if [ "$reachable" != "true" ]; then
            if [ "$last_kind" = "AUTH" ]; then
              db_error="Endpoint ${last_where} resolved the tenant/user but rejected every one of the ${#vlabels[@]} stored-password normalisations (${vsum}). So the connection method, host, port and username are correct and the credential itself is what Supabase refuses. Only two explanations are left: (1) the GitHub secret holds a password that is not the project's current one — the stored value is length ${#SUPABASE_DB_PASSWORD}, sha256[1:12]=${SB_PW_FP:-?}, edges ${SB_PW_EDGE:-?}; compare that fingerprint against the value in Dashboard > Project Settings > Database; or (2) Supavisor is still checking the new password against credentials it cached before the last rotation, which clears on a reconnect attempt within ~15s — re-run this workflow once after a few minutes before concluding the value is wrong. Do not rotate the password again: each rotation restarts that window. Attempts made: ${attempts}."
            elif [ "$last_kind" = "CIRCUIT_BREAKER" ] || [ "$auth_blocked" = "yes" ]; then
              db_error="Supavisor's auth circuit breaker is open for this tenant (${last_msg}). ${last_detail}"
            elif [ -n "$last_kind" ]; then
              db_error="No endpoint accepted a connection (${last_where}): ${last_detail} Raw: ${last_msg}"
            else
              db_error="No endpoint candidates were produced — check the 'Resolve the Postgres endpoint' step."
            fi
            echo "::warning::${db_error}"
          fi
          {
            echo "db_reachable=$reachable"
            echo "db_attempts=$attempts"
            echo "db_pw_variant=$win_label"
            echo "db_last_kind=$last_kind"
            echo "db_error=$db_error"
          } >> "$GITHUB_OUTPUT"
      - name: supabase link — diagnostic only, no longer a hard requirement
        id: link
        if: steps.guard.outputs.token_is_pat == 'yes'
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          if supabase link --project-ref "$PROJECT_REF"; then
            echo "supabase link succeeded."
            echo "link_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::supabase link failed. With a scoped PAT that is Supabase bug supabase/supabase#50244; it is not fatal here because the steps below use --db-url."
            echo "link_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Fail fast when neither the Management API nor Postgres can be reached
        if: steps.probe.outputs.db_reachable != 'true' && steps.link.outputs.link_ok != 'true'
        env:
          ACTION_NEEDED: ${{ steps.preflight.outputs.manual_action }}
          DB_ERROR: ${{ steps.probe.outputs.db_error }}
          DB_KIND: ${{ steps.probe.outputs.db_last_kind }}
          DB_ATTEMPTS: ${{ steps.probe.outputs.db_attempts }}
          PW_FIXES: ${{ steps.guard.outputs.pw_fixes }}
          PW_EDGE: ${{ steps.guard.outputs.pw_edge }}
          PW_FP: ${{ steps.guard.outputs.pw_fp }}
          PW_RAW_FP: ${{ steps.guard.outputs.pw_raw_fp }}
          TOKEN_VALID: ${{ steps.preflight.outputs.token_valid }}
          PROJECT_VISIBLE: ${{ steps.preflight.outputs.project_visible }}
          VERDICT: ${{ steps.preflight.outputs.verdict }}
        run: |
          set -uo pipefail
          echo "::error::No working path to project ${PROJECT_REF} yet (verdict: ${VERDICT}). Nothing was written to the database."
          if [ -n "$DB_ERROR" ]; then echo "::error::Database: ${DB_ERROR}"; fi
          # Non-revealing credential forensics: enough to tell a paste artifact from
          # a genuinely wrong value without ever printing the password.
          echo "::error::Credential forensics: failure-class=${DB_KIND:-n/a} attempts=${DB_ATTEMPTS:-0} | secret-as-stored sha256[1:12]=${PW_RAW_FP:-?} | after-normalisation sha256[1:12]=${PW_FP:-?} | normalisation applied='${PW_FIXES:-?}' | edge characters: ${PW_EDGE:-?}"
          if [ "$DB_KIND" = "AUTH" ] && [ "${PW_FIXES:-none}" = "none" ]; then
            echo "::error::The stored secret is byte-clean (no quotes, no stray whitespace, no CR/LF) and was still refused, so the value itself is not this project's current database password — or Supavisor is still serving credentials cached before the last rotation. Wait a few minutes and re-run ONCE before touching the password; repeated rotations keep re-opening that window and can trip the auth circuit breaker."
          fi
          if [ "$PROJECT_VISIBLE" = "true" ]; then
            echo "::error::The access token CAN read this project, so the access token is not the blocker — fix the database credential/endpoint above and re-run."
          elif [ "$TOKEN_VALID" = "true" ]; then
            echo "::error::The token is accepted but cannot read this project; check the project ref and the token's account."
          elif [ -n "$ACTION_NEEDED" ]; then
            echo "::error::Action needed: ${ACTION_NEEDED}"
          fi
          exit 1

      - name: Dry run — list pending migrations (never writes)
        id: dryrun
        env:
          DB_REACHABLE: ${{ steps.probe.outputs.db_reachable }}
          LINK_OK: ${{ steps.link.outputs.link_ok }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          # percent-encoded connection string, built in-shell so the password is
          # never repeated on a command line and never printed.
          #
          # Port 6543 is Supavisor's TRANSACTION pooler, which does not support the
          # prepared statements / statement cache the CLI's pgx driver uses by
          # default. pgbouncer=true turns that cache off, so a project whose pooler
          # config only advertises transaction mode (which is what the Management
          # API reports for this one) can still be driven by the CLI.
          build_db_url() {
            python3 -c 'import sys, urllib.parse as u; h, p, usr, pw = sys.argv[1:5]; q = lambda s: u.quote(s, safe=""); extra = "&pgbouncer=true&statement_cache_size=0" if p == "6543" else ""; print("postgresql://%s:%s@%s:%s/postgres?sslmode=require%s" % (q(usr), q(pw), h, p, extra))' \
              "$1" "$2" "$3" "$SUPABASE_DB_PASSWORD"
          }
          url=$(build_db_url "$SB_DB_HOST" "$SB_DB_PORT" "$SB_DB_USER")
          echo "::add-mask::$url"
          echo "target: ${SB_DB_USER}@${SB_DB_HOST}:${SB_DB_PORT}/postgres"
          echo "local migration files: $(ls -1 supabase/migrations/*.sql | wc -l)"
          echo

          ran=false
          if [ "$DB_REACHABLE" = "true" ]; then
            echo "== supabase migration list (local files vs remote history) =="
            if supabase migration list --db-url "$url"; then ran=true; else echo "(migration list --db-url failed)"; fi
            echo
            echo "== supabase db push --dry-run =="
            if supabase db push --dry-run --db-url "$url"; then ran=true; else echo "(db push --dry-run --db-url failed)"; fi
          fi

          if [ "$ran" != "true" ] && [ "$LINK_OK" = "true" ]; then
            echo
            echo "== falling back to the linked project =="
            if supabase migration list --linked; then ran=true; fi
            supabase db push --dry-run || true
          fi

          # Last resort: the CLI needs a linked project for some subcommands and this
          # repository only has a scoped PAT (see the api-keys 403 above). The
          # dry-run report is then produced straight from Postgres instead — still
          # read-only, and it is exactly the information a dry run has to give.
          if [ "$ran" != "true" ] && [ "$DB_REACHABLE" = "true" ]; then
            echo
            echo "== psql fallback: remote migration history vs local files (read-only) =="
            export PGSSLMODE=require PGCONNECT_TIMEOUT=15 PGPASSWORD="$SUPABASE_DB_PASSWORD"
            if psql -h "$SB_DB_HOST" -p "$SB_DB_PORT" -U "$SB_DB_USER" -d postgres -Atc "
                 select case
                   when to_regclass('supabase_migrations.schema_migrations') is null
                     then '(none) — supabase_migrations.schema_migrations does not exist yet'
                   else coalesce((select string_agg(version, ', ' order by version)
                                    from supabase_migrations.schema_migrations),
                                 '(none) — history table exists but is empty')
                 end;" | sed 's/^/  remote history: /'; then
              echo "  local files   : $(ls -1 supabase/migrations/*.sql | tr '\n' ' ')"
              echo "  pending       : $(ls -1 supabase/migrations/*.sql | wc -l) file(s) would be pushed by 'mode = apply'"
              ran=true
            else
              echo "(psql fallback failed too)"
            fi
          fi

          if [ "$ran" != "true" ]; then
            echo "::error::Could not produce a dry-run report through any available path."
            exit 1
          fi
          echo "::notice title=dry-run::report produced against ${SB_DB_USER}@${SB_DB_HOST}:${SB_DB_PORT}"
          echo "dry_run_ok=true" >> "$GITHUB_OUTPUT"

      - name: Dry run — read-only cross-check of the remote migration history
        if: steps.probe.outputs.db_reachable == 'true'
        run: |
          set -uo pipefail
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          export PGSSLMODE=require PGCONNECT_TIMEOUT=15 PGPASSWORD="$SUPABASE_DB_PASSWORD"
          psql -h "$SB_DB_HOST" -p "$SB_DB_PORT" -U "$SB_DB_USER" -d postgres -v ON_ERROR_STOP=1 -Atc "
            select case
              when to_regclass('supabase_migrations.schema_migrations') is null
                then 'remote history: supabase_migrations.schema_migrations does not exist yet -> nothing applied'
              else 'remote history: ' || coalesce(
                     (select string_agg(version, ', ' order by version)
                        from supabase_migrations.schema_migrations),
                     'table exists but is empty -> nothing applied')
            end;"
          echo "local files : $(ls -1 supabase/migrations/*.sql | wc -l)"

      - name: Apply migrations (only when mode = apply)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && steps.probe.outputs.db_reachable == 'true'
        env:
          PROJECT_STATUS: ${{ steps.preflight.outputs.project_status }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          if [ -n "$PROJECT_STATUS" ] && [ "$PROJECT_STATUS" != "ACTIVE_HEALTHY" ]; then
            echo "::error::Refusing to push: project status is ${PROJECT_STATUS}."
            exit 1
          fi
          build_db_url() {
            python3 -c 'import sys, urllib.parse as u; h, p, usr, pw = sys.argv[1:5]; q = lambda s: u.quote(s, safe=""); extra = "&pgbouncer=true&statement_cache_size=0" if p == "6543" else ""; print("postgresql://%s:%s@%s:%s/postgres?sslmode=require%s" % (q(usr), q(pw), h, p, extra))' \
              "$1" "$2" "$3" "$SUPABASE_DB_PASSWORD"
          }
          url=$(build_db_url "$SB_DB_HOST" "$SB_DB_PORT" "$SB_DB_USER")
          echo "::add-mask::$url"
          supabase db push --db-url "$url" --include-all --yes

      - name: Verify — run supabase/verify.sql (apply only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && steps.probe.outputs.db_reachable == 'true'
        env:
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          echo "::add-mask::$PGPASSWORD"
          export PGHOST="$SB_DB_HOST" PGPORT="$SB_DB_PORT" PGUSER="$SB_DB_USER"
          echo "verifying against ${PGUSER}@${PGHOST}:${PGPORT}"
          psql -v ON_ERROR_STOP=1 -f supabase/verify.sql

      - name: Verify — assert expected seed counts (apply only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && steps.probe.outputs.db_reachable == 'true'
        env:
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          echo "::add-mask::$PGPASSWORD"
          export PGHOST="$SB_DB_HOST" PGPORT="$SB_DB_PORT" PGUSER="$SB_DB_USER"
          actual=$(psql -v ON_ERROR_STOP=1 -At -F, -c "
            select
              (select count(*) from public.flavors),
              (select count(*) from public.products),
              (select count(*) from public.product_variants),
              (select count(*) from public.inventory),
              (select count(*) from public.recipes),
              (select count(*) from public.site_content),
              (select count(*) from public.site_settings),
              (select count(*) from public.products where image_url like 'images/products/%');
          ")
          expected="22,22,22,22,2,5,1,22"
          echo "expected: $expected"
          echo "actual:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Seed counts do not match the expected values."
            exit 1
          fi
          echo "✅ Migrations applied and verified."

      - name: Result summary
        if: always()
        env:
          MODE: ${{ github.event.inputs.mode || github.event_name }}
          TOKEN_CLASS: ${{ steps.guard.outputs.token_class }}
          TOKEN_VALID: ${{ steps.preflight.outputs.token_valid }}
          PROJECT_VISIBLE: ${{ steps.preflight.outputs.project_visible }}
          PROJECT_STATUS: ${{ steps.preflight.outputs.project_status }}
          REGION: ${{ steps.preflight.outputs.region }}
          LINK_API_OK: ${{ steps.preflight.outputs.link_api_ok }}
          VERDICT: ${{ steps.preflight.outputs.verdict }}
          ACTION_NEEDED: ${{ steps.preflight.outputs.manual_action }}
          DB_REACHABLE: ${{ steps.probe.outputs.db_reachable }}
          DB_ERROR: ${{ steps.probe.outputs.db_error }}
          DB_ATTEMPTS: ${{ steps.probe.outputs.db_attempts }}
          DB_PW_VARIANT: ${{ steps.probe.outputs.db_pw_variant }}
          DB_KIND: ${{ steps.probe.outputs.db_last_kind }}
          PW_FIXES: ${{ steps.guard.outputs.pw_fixes }}
          PW_EDGE: ${{ steps.guard.outputs.pw_edge }}
          API_CODES: ${{ steps.preflight.outputs.api_codes }}
          POOL_MODE: ${{ steps.preflight.outputs.pool_mode }}
          LINK_OK: ${{ steps.link.outputs.link_ok }}
          DRY_RUN_OK: ${{ steps.dryrun.outputs.dry_run_ok }}
        run: |
          set -uo pipefail
          db_action=""
          if [ "${DB_REACHABLE:-}" != "true" ]; then
            db_action="Database not reachable. ${DB_ERROR:-See the probe step.} Check SUPABASE_DB_PASSWORD (Dashboard > Project Settings > Database), confirm the project is running, and/or pass the Session-pooler host from Dashboard > Connect as the db_host input with db_port 5432."
          fi
          {
            echo "### Supabase migrate — ${MODE}"
            echo
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| project ref | \`${PROJECT_REF}\` |"
            echo "| token class | ${TOKEN_CLASS:-n/a} |"
            echo "| token accepted by the Management API | ${TOKEN_VALID:-n/a} |"
            echo "| project visible to this token | ${PROJECT_VISIBLE:-n/a} |"
            echo "| project status | ${PROJECT_STATUS:-unknown} |"
            echo "| region | ${REGION:-unknown} |"
            echo "| api-keys endpoint (needed by \`supabase link\`) | ${LINK_API_OK:-n/a} |"
            echo "| Management API status codes | ${API_CODES:-n/a} |"
            echo "| pool_mode from the API | ${POOL_MODE:-unknown} |"
            echo "| \`supabase link\` | ${LINK_OK:-skipped} |"
            echo "| Postgres endpoint used | \`${SB_DB_USER:-?}@${SB_DB_HOST:-?}:${SB_DB_PORT:-?}\` |"
            echo "| database reachable | ${DB_REACHABLE:-n/a} |"
            echo "| connection attempts (bounded) | ${DB_ATTEMPTS:-0} |"
            echo "| secret normalisation applied | ${PW_FIXES:-n/a} |"
            echo "| secret edge characters (class only) | ${PW_EDGE:-n/a} |"
            echo "| password variant that authenticated | ${DB_PW_VARIANT:-none} |"
            echo "| last failure class | ${DB_KIND:-none} |"
            echo "| dry-run report produced | ${DRY_RUN_OK:-no} |"
            echo
            echo "**Verdict:** \`${VERDICT:-unknown}\`"
            echo
            echo "**Action needed (access token):** ${ACTION_NEEDED:-none}"
            if [ -n "$db_action" ]; then
              echo
              echo "**Action needed (database):** ${db_action}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "verdict: ${VERDICT:-unknown}"
          echo "action needed (access token): ${ACTION_NEEDED:-none}"
          if [ -n "$db_action" ]; then echo "action needed (database): ${db_action}"; fi
          exit 0
